    };
    // ======= [Part 1 끝: 바로 아래 줄에 이어서 Part 2를 붙여넣으세요] =======

    // ======= [Part 2 시작: Part 1의 맨 마지막 줄 바로 아래에 붙여넣으세요] =======

    // 공통 날짜/모수 정규화 헬퍼
    const cleanScheduleDateStr = (dateVal) => {
      if (!dateVal) return "";
      let str = String(dateVal).trim();
      if (str.includes("T")) str = str.split("T")[0];
      if (str.includes(" ")) str = str.split(" ")[0];
      str = str.replace(/[.\/]/g, "-");
      const parts = str.split("-").map(v => v.trim()).filter(Boolean);
      if (parts.length === 3) {
        let [y, m, d] = parts;
        if (y.length === 2) y = "20" + y;
        return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
      }
      return "";
    };

    const formatTargetKor = (num) => {
      if (typeof num !== 'number' || isNaN(num) || num === 0) return "0만";
      const sign = num < 0 ? "-" : "";
      const abs = Math.abs(num);
      if (abs >= 10000) return sign + Math.round(abs / 10000).toLocaleString('ko-KR') + "만";
      if (abs >= 1000) return sign + Math.round(abs / 1000).toLocaleString('ko-KR') + "천";
      return sign + Math.round(abs / 100).toLocaleString('ko-KR') + "백";
    };

    const extractTargetNum = (item) => {
      if (!item) return 0;
      let targetValue = 0;
      Object.keys(item).forEach(k => {
        const nk = k.replace(/\s+/g, '');
        if (nk === '타겟수' || nk === '타겟수(만)' || nk === '전체타겟수' || nk === '발송모수' || nk === 'targetSize') {
          const cleanNum = String(item[k]).replace(/[^0-9]/g, '');
          if (cleanNum) targetValue = Number(cleanNum);
        }
      });
      return targetValue;
    };

    const checkItemHasCoupon = (item) => {
      if (!item) return false;
      const ch = String(item['채널'] || item['필터'] || '').toUpperCase();
      const cpnCol = String(item['쿠폰 여부'] || item['오퍼분류'] || item['쿠폰'] || item.hasCoupon || '').toUpperCase();
      return ch.includes('쿠폰') || cpnCol.includes('쿠폰') || cpnCol === 'Y' || cpnCol.includes('포함') || (parseInt(String(item['쿠폰'] || '0').replace(/[^0-9]/g, ''), 10) > 0);
    };

    const extractCampaignTitle = (item) => {
      if (!item) return "제목 없음";
      const direct = item['캠페인 명'] || item['캠페인명'] || item.campaignName || item['제목'] || item['Title'];
      if (direct && String(direct).trim()) return String(direct).trim();
      return "제목 없음";
    };

    const extractDeptName = (item) => String(item?.['요청 부서'] || item?.['부서'] || item?.department || '').trim();
    const extractMarketerName = (item) => String(item?.['담당자 이름'] || item?.['마케터'] || item?.marketer || '').trim();
    const extractCycleName = (item) => String(item?.['주기성 여부'] || item?.['주기'] || item?.cycle || '단발성').trim();

    const checkIsWiredDept = (item) => {
      const dept = extractDeptName(item);
      return dept.includes('밸류애드팀') || dept.includes('유선');
    };

    const calcDateOffset = (dateStr, offsetDays, fallbackStr) => {
      const clean = cleanScheduleDateStr(dateStr) || fallbackStr;
      const d = new Date(`${clean}T00:00:00`);
      if (isNaN(d.getTime())) return fallbackStr;
      d.setDate(d.getDate() + offsetDays);
      const tzOffset = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - tzOffset).toISOString().split('T')[0];
    };

    const formatShortDayLabel = (dateStr) => {
      const clean = cleanScheduleDateStr(dateStr);
      if (!clean) return "-";
      const d = new Date(`${clean}T00:00:00`);
      if (isNaN(d.getTime())) return clean;
      const days = ['일','월','화','수','목','금','토'];
      return `${clean.slice(5).replace('-', '/')}(${days[d.getDay()]})`;
    };

    const calcDailyLimit = (type, dateStr, fallbackStr) => {
      const clean = cleanScheduleDateStr(dateStr) || fallbackStr;
      const d = new Date(`${clean}T00:00:00`);
      if (type === 'banner') return (!isNaN(d.getTime()) && d.getDay() === 4) ? 2700000 : 2800000;
      if (type === 'coupon') return 2700000;
      return 0;
    };

    const calcDailyUsed = (type, dateStr, sourceArr = [], exWired = false) => {
      if (!dateStr) return 0;
      return sourceArr.reduce((sum, item) => {
        const st = String(item['상태'] || '').trim();
        if (st === '미반영' || st === '취소' || st === '제외') return sum;
        if (exWired && checkIsWiredDept(item)) return sum;
        const start = cleanScheduleDateStr(item['시작일']);
        if (start !== dateStr) return sum;
        const filterText = String(item['채널'] || item['필터'] || '').toUpperCase();
        const targetValue = extractTargetNum(item);
        if (type === 'banner' && (filterText.includes('SEG') || filterText.includes('배너'))) return sum + targetValue;
        if (type === 'coupon' && checkItemHasCoupon(item)) return sum + targetValue;
        return sum;
      }, 0);
    };

    // ====================================================================================
    // 🌟 Step 1. 프로모션 Capa 뷰 (월간 캘린더 제거 경량화 + MASS 패스트트랙 + 단일 스마트 버튼)
    // ====================================================================================
    const Step1CapaView = ({ onProceedToStep2, onOpenIntegratedStatus }) => {
      const todayObj = new Date();
      const todayLocalStr = new Date(todayObj.getTime() - (todayObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

      const [rawSourceData, setRawSourceData] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isAssigning, setIsAssigning] = useState(false);
      const [excludeWired, setExcludeWired] = useState(false);
      const [channelBarFilter, setChannelBarFilter] = useState('');

      // 발송 모수 시뮬레이터 상태
      const [capaDate, setCapaDate] = useState(todayLocalStr);
      const [capaEndDate, setCapaEndDate] = useState(todayLocalStr);
      const [capaTarget, setCapaTarget] = useState('');
      const [capaBanner, setCapaBanner] = useState(true);
      const [capaTvPopup, setCapaTvPopup] = useState(false);
      const [capaToast, setCapaToast] = useState(false);
      const [capaCoupon, setCapaCoupon] = useState(true);

      // 단순 Capa 신청서 모달 상태
      const [isReqModalOpen, setIsReqModalOpen] = useState(false);
      const [isSubmittingReq, setIsSubmittingReq] = useState(false);
      const [reqStatusMsg, setReqStatusMsg] = useState('');
      const [marketerSearch, setMarketerSearch] = useState(localStorage.getItem('myMarketerName') || '');
      const [showHistoryList, setShowHistoryList] = useState(false);

      const [reqForm, setReqForm] = useState({
        campaignName: '',
        startDate: todayLocalStr,
        endDate: todayLocalStr,
        uiVersions: ['5.0'],
        channels: ['쿠폰'],
        gnb: '홈',
        cycle: '단발성',
        couponYn: '쿠폰',
        totalTarget: '',
        segIdCount: '1개',
        department: localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
        marketer: localStorage.getItem('myMarketerName') || ''
      });

      const monthlyChartRef = useRef(null);
      const monthlyChartInstanceRef = useRef(null);

      const fetchScheduleData = async () => {
        setIsLoading(true);
        try {
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev?action=getScheduleData");
          const json = await res.json();
          if (json && json.status === 'success' && Array.isArray(json.data)) {
            setRawSourceData(json.data);
          } else if (Array.isArray(json)) {
            setRawSourceData(json);
          }
        } catch (err) {
          console.error("스케줄 로드 실패:", err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => { fetchScheduleData(); }, []);

      const handleAssignExecutionTimes = async () => {
        setIsAssigning(true);
        try {
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "assignExecutionTimes" })
          });
          const json = await res.json();
          if (json.status === 'success') {
            if (Array.isArray(json.data)) setRawSourceData(json.data);
            else await fetchScheduleData();
            const s = json.summary || {};
            alert(`✅ 스케줄 확정 및 실행시각 자동배정 완료!\n• 일정 확정: ${s.assignedCount || 0}건\n• 미반영(슬랙 알림 발송): ${s.failedCount || 0}건`);
          } else {
            alert("⚠️ 자동배정 실패: " + (json.message || "알 수 없는 오류"));
          }
        } catch (e) {
          alert("⚠️ 서버 통신 오류: " + e.message);
        } finally {
          setIsAssigning(false);
        }
      };

      // 월별 차트 렌더링
      useEffect(() => {
        if (!monthlyChartRef.current || typeof window.Chart === 'undefined') return;
        const monthMap = {};
        rawSourceData.forEach(item => {
          const st = String(item['상태'] || '').trim();
          if (st === '취소' || st === '제외') return;
          if (excludeWired && checkIsWiredDept(item)) return;
          const start = cleanScheduleDateStr(item['시작일']);
          if (!start || start.length < 7) return;
          const mKey = start.slice(0, 7);
          if (!monthMap[mKey]) monthMap[mKey] = { monthKey: mKey, label: `${Number(mKey.split('-')[1])}월`, tv: 0, toast: 0, target: 0 };
          const fText = String(item['채널'] || item['필터'] || '').toUpperCase();
          const tVal = extractTargetNum(item);
          if (fText.includes('TV')) monthMap[mKey].tv += 1;
          if (fText.includes('토스트')) monthMap[mKey].toast += 1;
          monthMap[mKey].target += tVal;
        });

        const sortedMonths = Object.values(monthMap).sort((a, b) => a.monthKey.localeCompare(b.monthKey)).slice(-8);
        if (monthlyChartInstanceRef.current) monthlyChartInstanceRef.current.destroy();

        monthlyChartInstanceRef.current = new window.Chart(monthlyChartRef.current, {
          type: 'bar',
          data: {
            labels: sortedMonths.map(d => d.label),
            datasets: [
              { type: 'bar', label: 'TV팝업', data: sortedMonths.map(d => d.tv), yAxisID: 'y', backgroundColor: '#4f3df6', borderRadius: 6, maxBarThickness: 24 },
              { type: 'bar', label: '토스트팝업', data: sortedMonths.map(d => d.toast), yAxisID: 'y', backgroundColor: '#475569', borderRadius: 6, maxBarThickness: 24 },
              { type: 'line', label: '전체 타겟 수', data: sortedMonths.map(d => d.target), yAxisID: 'yTarget', borderColor: '#32d782', backgroundColor: 'rgba(50, 215, 130, 0.15)', borderWidth: 2.5, pointRadius: 3, tension: 0.35 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', align: 'end', labels: { color: '#94a3b8', usePointStyle: true, boxWidth: 8, font: { size: 11, weight: 'bold' } } },
              datalabels: { display: false }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 11, weight: 'bold' } } },
              y: { beginAtZero: true, position: 'left', ticks: { color: '#64748b', precision: 0, callback: v => `${v}건`, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
              yTarget: { beginAtZero: true, position: 'right', ticks: { color: '#32d782', callback: v => formatTargetKor(v), font: { size: 10 } }, grid: { drawOnChartArea: false } }
            }
          }
        });
      }, [rawSourceData, excludeWired]);

      // 이번 달 요약
      const monthlySummary = (() => {
        let tvCount = 0, toastCount = 0, couponCount = 0, segCount = 0;
        let tvSum = 0, toastSum = 0, couponSum = 0, segSum = 0;
        const curYear = todayObj.getFullYear();
        const curMonth = todayObj.getMonth();
        rawSourceData.forEach(item => {
          const st = String(item['상태'] || '').trim();
          if (st === '취소' || st === '제외') return;
          if (excludeWired && checkIsWiredDept(item)) return;
          const start = cleanScheduleDateStr(item['시작일']);
          if (!start) return;
          const parts = start.split('-');
          if (Number(parts[0]) === curYear && (Number(parts[1]) - 1) === curMonth) {
            const fText = String(item['채널'] || item['필터'] || '').toUpperCase();
            const tv = extractTargetNum(item);
            if (fText.includes('TV')) { tvCount++; tvSum += tv; }
            if (fText.includes('토스트')) { toastCount++; toastSum += tv; }
            if (checkItemHasCoupon(item)) { couponCount++; couponSum += tv; }
            if (fText.includes('SEG') || fText.includes('배너')) { segCount++; segSum += tv; }
          }
        });
        return { tvCount, toastCount, couponCount, segCount, tvSum, toastSum, couponSum, segSum };
      })();

      // 향후 7일 주간 잔여 슬롯 데이터
      const weeklyData = (() => {
        const list = [];
        for (let i = 0; i < 7; i++) {
          const dStr = calcDateOffset(todayLocalStr, i, todayLocalStr);
          const bCapa = calcDailyLimit('banner', dStr, todayLocalStr);
          const bUsed = calcDailyUsed('banner', dStr, rawSourceData, excludeWired);
          const cCapa = calcDailyLimit('coupon', dStr, todayLocalStr);
          const cUsed = calcDailyUsed('coupon', dStr, rawSourceData, excludeWired);

          let tvTarget = 0, toastTarget = 0;
          rawSourceData.forEach(item => {
            const st = String(item['상태'] || '').trim();
            if (st === '미반영' || st === '취소' || st === '제외') return;
            if (excludeWired && checkIsWiredDept(item)) return;
            if (cleanScheduleDateStr(item['시작일']) !== dStr) return;
            const f = String(item['채널'] || item['필터'] || '').toUpperCase();
            const tv = extractTargetNum(item);
            if (f.includes('TV')) tvTarget += tv;
            if (f.includes('토스트')) toastTarget += tv;
          });

          list.push({
            dateStr: dStr,
            label: formatShortDayLabel(dStr),
            bannerCapa: bCapa, bannerUsed: bUsed, bannerRemain: bCapa - bUsed,
            couponCapa: cCapa, couponUsed: cUsed, couponRemain: cCapa - cUsed,
            tvPopup: tvTarget, toastPopup: toastTarget
          });
        }
        return list;
      })();

      const unassignedCount = rawSourceData.filter(item => {
        const st = String(item['상태'] || '').trim();
        const tm = String(item['실행시각'] || '').trim();
        return st === '미반영' || tm.includes('배정 불가');
      }).length;

      const pendingCount = rawSourceData.filter(item => String(item['상태'] || '').trim() === '대기 중').length;

      // 시뮬레이터 결과 계산
      const targetNumVal = Number(String(capaTarget).replace(/[^0-9]/g, '')) || 0;
      const hasVisualChannel = capaBanner || capaTvPopup;
      const hasAnyChannel = capaBanner || capaTvPopup || capaToast || capaCoupon;

      const capaSimResults = (() => {
        const checks = [
          { type: 'banner', label: '타겟 배너', checked: capaBanner },
          { type: 'coupon', label: 'B tv 쿠폰', checked: capaCoupon }
        ].filter(c => c.checked);
        if (!capaDate || !targetNumVal || checks.length === 0) return [];

        return checks.map(c => {
          const capa = calcDailyLimit(c.type, capaDate, todayLocalStr);
          const used = calcDailyUsed(c.type, capaDate, rawSourceData, excludeWired);
          const remain = Math.max(capa - used, 0);
          const ok = remain >= targetNumVal;
          const recos = [];
          if (!ok) {
            for (let i = -2; i <= 2; i++) {
              if (i === 0) continue;
              const altDate = calcDateOffset(capaDate, i, todayLocalStr);
              const altRemain = Math.max(calcDailyLimit(c.type, altDate, todayLocalStr) - calcDailyUsed(c.type, altDate, rawSourceData, excludeWired), 0);
              if (altRemain >= targetNumVal) recos.push({ dateStr: altDate, label: `${formatShortDayLabel(altDate)} 잔여 ${formatTargetKor(altRemain)}` });
            }
          }
          return { ...c, capa, used, remain, ok, recos, requested: targetNumVal };
        });
      })();

      const isAllCapaOk = capaSimResults.length === 0 ? (targetNumVal > 0) : capaSimResults.every(r => r.ok);

      // 🌟 [4번 요구사항] MASS + 쿠폰 없음 프로모션 패스트트랙 버튼 핸들러
      const handleStartMassFastTrack = () => {
        onProceedToStep2 && onProceedToStep2({
          startDate: capaDate || todayLocalStr,
          dueDate: capaEndDate >= capaDate ? capaEndDate : (capaDate || todayLocalStr),
          target: 'MASS',
          targetSize: '',
          hasCoupon: 'N',
          couponBenefit: '',
          channels: 'MASS 배너',
          isCapaChecked: true,
          department: localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
          marketer: localStorage.getItem('myMarketerName') || ''
        });
      };

      // 🌟 [2번 & 3번 요구사항] 조건에 따라 유동적으로 동작하는 단일 스마트 액션 핸들러
      const handleDynamicSmartAction = () => {
        if (!hasAnyChannel) {
          alert("⚠️ 최소 1개 이상의 발송 채널 또는 쿠폰 조건을 선택해 주세요.");
          return;
        }
        if (!targetNumVal || targetNumVal <= 0) {
          alert("⚠️ 타겟 발송 모수(명)를 입력해 주세요.\n(타겟/쿠폰이 없는 전체 고객 대상 프로모션은 상단의 [🚀 MASS 프로모션 바로 기획] 버튼을 이용해 주세요!)");
          return;
        }
        if (!isAllCapaOk) {
          alert("🚨 선택하신 일자의 잔여 Capa 한도가 부족합니다. 추천 대체일로 시작일을 변경하거나 모수를 조정해 주세요.");
          return;
        }

        const sDate = capaDate || todayLocalStr;
        const eDate = capaEndDate >= sDate ? capaEndDate : sDate;

        // Case A: 배너/TV팝업 없이 오직 쿠폰 또는 토스트팝업만 선택된 경우 -> 단순 Capa 신청서 모달 오픈
        if (!hasVisualChannel) {
          const selectedChs = [];
          if (capaToast) selectedChs.push('토스트팝업');
          if (capaCoupon) selectedChs.push('쿠폰');
          setReqForm(prev => ({
            ...prev,
            startDate: sDate,
            endDate: eDate,
            channels: selectedChs.length > 0 ? selectedChs : ['쿠폰'],
            couponYn: capaCoupon ? '쿠폰' : '미포함',
            totalTarget: String(targetNumVal),
            department: localStorage.getItem('myDepartment') || prev.department || 'Btv큐레이션팀',
            marketer: localStorage.getItem('myMarketerName') || prev.marketer || ''
          }));
          setIsReqModalOpen(true);
          return;
        }

        // Case B: 타겟배너 또는 TV팝업(이미지 시안 제작 필요)이 포함된 경우 -> 무조건 TARGET + Capa 검증 완료 상태로 Step 2 이동!
        const selectedChs = [];
        if (capaTvPopup) selectedChs.push('TV팝업');
        if (capaBanner) selectedChs.push('타겟배너');
        if (capaToast) selectedChs.push('토스트팝업');
        if (capaCoupon) selectedChs.push('쿠폰');

        onProceedToStep2 && onProceedToStep2({
          startDate: sDate,
          dueDate: eDate,
          target: 'TARGET', // 🌟 3번 요구사항: 타겟 배너/채널 선택 시 무조건 TARGET으로 설정
          targetSize: targetNumVal.toLocaleString(),
          hasCoupon: capaCoupon ? 'Y' : 'N',
          channels: selectedChs.join(', '),
          bannerTypes: capaTvPopup && capaBanner ? 'GENERAL_BANNER, PROMO_POPUP' : (capaTvPopup ? 'PROMO_POPUP' : 'GENERAL_BANNER'),
          isCapaChecked: true, // 🌟 3번 요구사항: Capa 검증 완료 상태로 전달
          department: localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
          marketer: localStorage.getItem('myMarketerName') || ''
        });
      };

      // 단순 Capa 신청서 제출 (대기 중 상태로 적재)
      const handleSimpleRequestSubmit = async (e) => {
        e.preventDefault();
        if (!reqForm.campaignName || !reqForm.startDate) {
          return alert("캠페인 명과 시작일은 필수입니다.");
        }
        setIsSubmittingReq(true);
        setReqStatusMsg("캠페인 스케줄 시트에 '대기 중' 상태로 등록 중...");

        localStorage.setItem('myDepartment', reqForm.department);
        localStorage.setItem('myMarketerName', reqForm.marketer);

        const targetNum = Number(String(reqForm.totalTarget).replace(/[^0-9]/g, '')) || 0;
        const isCpn = reqForm.couponYn === '쿠폰' || reqForm.channels.includes('쿠폰');

        const scheduleItem = {
          "캠페인 명": reqForm.campaignName,
          "캠페인명": reqForm.campaignName,
          "시작일": reqForm.startDate,
          "종료일": reqForm.endDate || reqForm.startDate,
          "UI버전": reqForm.uiVersions.join(", "),
          "채널": reqForm.channels.join(", "),
          "필터": reqForm.channels.join(", "),
          "GNB": reqForm.gnb,
          "주기성 여부": reqForm.cycle,
          "주기": reqForm.cycle,
          "쿠폰 여부": isCpn ? "쿠폰" : "미포함",
          "오퍼분류": isCpn ? "쿠폰" : "콘텐츠",
          "타겟 수": targetNum,
          "타겟수": targetNum,
          "SEG ID 수": reqForm.segIdCount || (targetNum > 0 ? "1개" : "-"),
          "요청 부서": reqForm.department,
          "부서": reqForm.department,
          "담당자 이름": reqForm.marketer,
          "마케터": reqForm.marketer,
          "반영 여부": "N",
          "상태": "대기 중"
        };

        try {
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "submitSchedule", scheduleItem, autoAssign: false })
          });
          const json = await res.json();
          if (json.status === 'success') {
            if (Array.isArray(json.data)) setRawSourceData(json.data);
            else await fetchScheduleData();
            setReqStatusMsg("✅ 스케줄 요청이 '대기 중' 상태로 등록되었습니다!");
            setTimeout(() => {
              setIsReqModalOpen(false);
              setReqStatusMsg('');
            }, 1000);
          } else {
            setReqStatusMsg("⚠️ 오류: " + (json.message || "저장 실패"));
          }
        } catch (err) {
          setReqStatusMsg("⚠️ 통신 에러: " + err.message);
        } finally {
          setIsSubmittingReq(false);
        }
      };

      const recentMarketerHistory = (() => {
        const keyword = (marketerSearch || reqForm.marketer || '').trim().toUpperCase();
        if (!keyword) return [];
        return rawSourceData.filter(item => {
          const m = extractMarketerName(item).toUpperCase();
          return m.includes(keyword);
        }).slice(-15).reverse();
      })();

      return (
        <div className="flex-1 h-full overflow-y-auto custom-scrollbar bg-[#06070a] p-6 space-y-6">
          {/* 1. 상단 헤더 & MASS 패스트트랙 바 */}
          <div className="bg-gradient-to-r from-[#12141c] to-[#1a1c26] border border-[#262833] rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-black px-2.5 py-0.5 rounded-full bg-[#4f3df6] text-white">STEP 1</span>
                <h2 className="text-xl font-black text-white tracking-tight">프로모션 Capa 검증 & 시작하기</h2>
              </div>
              <p className="text-xs text-slate-400 mt-1.5">타겟/쿠폰 발송 모수를 먼저 검증하거나, 타겟·쿠폰이 없는 MASS 배너 프로모션은 우측 패스트트랙 버튼으로 바로 기획을 시작하세요.</p>
            </div>
            <div className="flex items-center gap-2.5 flex-wrap">
              {/* 🌟 4번 요구사항: MASS + 쿠폰 없는 프로모션 바로 기획 버튼 */}
              <button
                onClick={handleStartMassFastTrack}
                className="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-black shadow-lg shadow-emerald-600/25 transition-all"
              >
                <Sparkles size={14} /> 🚀 MASS 프로모션 바로 기획 (타겟/쿠폰 없음) 〉
              </button>

              <button

              <div className="bg-[#12141c] border border-[#262833] rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[88vh]">
                <div className="p-5 border-b border-[#262833] bg-[#0f111a] flex items-center justify-between">
                  <div>
                    <h3 className="text-base font-black text-white">📝 단순 캠페인 Capa 신청 (배너 시안 불필요)</h3>
                    <p className="text-[11px] text-slate-400 mt-0.5">'캠페인 스케줄' 시트에 [대기 중] 상태로 적재되며, 일일 배치(또는 자동배정 버튼) 실행 시 확정됩니다.</p>
                  </div>
                  <button onClick={() => setIsReqModalOpen(false)} className="p-1.5 text-slate-400 hover:text-white"><X size={18} /></button>
                </div>

                <div className="p-6 overflow-y-auto custom-scrollbar space-y-4 bg-[#0a0812]">
                  <div className="bg-[#12141c] border border-[#262833] rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                    <span className="text-xs text-slate-400 font-medium">담당자 이름으로 과거 신청 이력을 불러와 빠르게 채울 수 있습니다.</span>
                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        value={marketerSearch}
                        onChange={e => setMarketerSearch(e.target.value)}
                        placeholder="담당자 이름"
                        className="bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-1.5 text-xs text-white w-32 outline-none focus:border-[#4f3df6]"
                      />
                      <button
                        type="button"
                        onClick={() => setShowHistoryList(!showHistoryList)}
                        className="px-3 py-1.5 bg-[#1a1c26] hover:bg-[#262833] text-[#7387ff] border border-[#303340] rounded-lg text-xs font-bold"
                      >
                        {showHistoryList ? '목록 닫기' : '이력 불러오기'}
                      </button>
                    </div>
                  </div>

                  {showHistoryList && (
                    <div className="bg-[#12141c] border border-[#303340] rounded-xl max-h-44 overflow-y-auto custom-scrollbar divide-y divide-[#1e202b]">
                      {recentMarketerHistory.length === 0 ? (
                        <div className="p-4 text-center text-xs text-slate-500">해당 담당자의 신청 이력이 없습니다.</div>
                      ) : (
                        recentMarketerHistory.map((h, i) => (
                          <button
                            key={i}
                            type="button"
                            onClick={() => {
                              const chText = String(h['채널'] || h['필터'] || '');
                              const chs = ['쿠폰', '토스트팝업'].filter(c => chText.includes(c));
                              setReqForm({
                                campaignName: extractCampaignTitle(h),
                                startDate: cleanScheduleDateStr(h['시작일']) || todayLocalStr,
                                endDate: cleanScheduleDateStr(h['종료일']) || todayLocalStr,
                                uiVersions: String(h['UI버전'] || '5.0').split(',').map(s => s.trim()).filter(Boolean),
                                channels: chs.length > 0 ? chs : ['쿠폰'],
                                gnb: h['GNB'] || '홈',
                                cycle: extractCycleName(h),
                                couponYn: checkItemHasCoupon(h) ? '쿠폰' : '미포함',
                                totalTarget: String(extractTargetNum(h) || ''),
                                segIdCount: h['SEG ID 수'] || '1개',
                                department: extractDeptName(h) || 'Btv큐레이션팀',
                                marketer: extractMarketerName(h) || marketerSearch
                              });
                              setShowHistoryList(false);
                            }}
                            className="w-full p-3 text-left hover:bg-[#1a1c26] transition-colors"
                          >
                            <div className="text-xs font-bold text-white">{extractCampaignTitle(h)}</div>
                            <div className="text-[11px] text-slate-400 mt-0.5">{cleanScheduleDateStr(h['시작일'])} ~ {cleanScheduleDateStr(h['종료일'])} · {h['채널'] || h['필터'] || '-'} · 타겟 {formatTargetKor(extractTargetNum(h))}</div>
                          </button>
                        ))
                      )}
                    </div>
                  )}

                  <form id="simpleScheduleForm" onSubmit={handleSimpleRequestSubmit} className="grid grid-cols-2 gap-4">
                    <div className="col-span-2">
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">캠페인 명 *</label>
                      <input type="text" required value={reqForm.campaignName} onChange={e => setReqForm({...reqForm, campaignName: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">시작일 *</label>
                      <input type="date" required value={reqForm.startDate} onChange={e => setReqForm({...reqForm, startDate: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6] [&::-webkit-calendar-picker-indicator]:invert" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">종료일 *</label>
                      <input type="date" required value={reqForm.endDate} onChange={e => setReqForm({...reqForm, endDate: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6] [&::-webkit-calendar-picker-indicator]:invert" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">UI버전</label>
                      <div className="flex gap-2">
                        {['4.0', '5.0'].map(v => {
                          const checked = reqForm.uiVersions.includes(v);
                          return (
                            <button type="button" key={v} onClick={() => setReqForm({...reqForm, uiVersions: checked ? reqForm.uiVersions.filter(x => x !== v) : [...reqForm.uiVersions, v]})} className={`flex-1 py-2 rounded-lg text-xs font-bold border ${checked ? 'bg-[#4f3df6]/20 border-[#4f3df6] text-white' : 'bg-[#12141c] border-[#262833] text-slate-500'}`}>
                              UI {v}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">채널 (시안 불필요 채널)</label>
                      <div className="flex gap-1.5">
                        {['쿠폰', '토스트팝업'].map(ch => {
                          const checked = reqForm.channels.includes(ch);
                          return (
                            <button type="button" key={ch} onClick={() => setReqForm({...reqForm, channels: checked ? reqForm.channels.filter(x => x !== ch) : [...reqForm.channels, ch]})} className={`flex-1 py-2 rounded-lg text-[11px] font-bold border ${checked ? 'bg-amber-500/20 border-amber-400 text-white' : 'bg-[#12141c] border-[#262833] text-slate-500'}`}>
                              {ch}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">편성 GNB</label>
                      <input type="text" value={reqForm.gnb} onChange={e => setReqForm({...reqForm, gnb: e.target.value})} placeholder="예: 홈, 영화시리즈" className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">주기성 여부</label>
                      <select value={reqForm.cycle} onChange={e => setReqForm({...reqForm, cycle: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]">
                        <option value="단발성">단발성</option>
                        <option value="주기성">주기성</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">쿠폰 여부</label>
                      <select value={reqForm.couponYn} onChange={e => setReqForm({...reqForm, couponYn: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]">
                        <option value="쿠폰">쿠폰 (포함)</option>
                        <option value="미포함">미포함</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">타겟 수 (명) *</label>
                      <input type="number" required value={reqForm.totalTarget} onChange={e => setReqForm({...reqForm, totalTarget: e.target.value})} placeholder="예: 500000" className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">SEG ID 수</label>
                      <input type="text" value={reqForm.segIdCount} onChange={e => setReqForm({...reqForm, segIdCount: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">요청 부서 *</label>
                      <input type="text" required value={reqForm.department} onChange={e => setReqForm({...reqForm, department: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]" />
                    </div>
                    <div className="col-span-2">
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">담당자 이름 *</label>
                      <input type="text" required value={reqForm.marketer} onChange={e => setReqForm({...reqForm, marketer: e.target.value})} className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-[#4f3df6]" />
                    </div>
                  </form>
                  {reqStatusMsg && <div className="text-xs font-bold text-[#7387ff] text-center">{reqStatusMsg}</div>}
                </div>

                <div className="p-4 border-t border-[#262833] bg-[#0f111a] flex justify-end gap-2">
                  <button type="button" onClick={() => setIsReqModalOpen(false)} className="px-4 py-2 bg-[#1a1c26] text-slate-300 rounded-lg text-xs font-bold">닫기</button>
                  <button type="submit" form="simpleScheduleForm" disabled={isSubmittingReq} className="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-black rounded-lg text-xs font-black shadow-lg disabled:opacity-50">
                    {isSubmittingReq ? "처리 중..." : "스케줄 요청 등록 (대기 중 적재)"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ====================================================================================
    // 🌟 [6번 요구사항 완벽 구현] 🗂️ 통합 프로모션 현황 뷰 (캘린더 뷰 + 리스트 뷰 통합 및 유형별 맞춤 액션)
    // ====================================================================================
    const IntegratedStatusView = ({ initialMode = 'CALENDAR', onLoadCampaign, onDuplicateCampaign, onStartPlanWithDate }) => {
      const todayObj = new Date();
      const todayLocalStr = new Date(todayObj.getTime() - (todayObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

      const [viewMode, setViewMode] = useState(initialMode); // 'CALENDAR' | 'LIST'
      const [scheduleData, setScheduleData] = useState([]);
      const [campaignData, setCampaignData] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isAssigning, setIsAssigning] = useState(false);

      // 공통 필터 상태
      const [categoryFilter, setCategoryFilter] = useState('ALL'); // 'ALL' | 'INTEGRATED' | 'CAPA_ONLY' | 'BANNER_ONLY'
      const [typeFilters, setTypeFilters] = useState([]);
      const [dateFilters, setDateFilters] = useState(['start']);
      const [excludeWired, setExcludeWired] = useState(false);
      const [onlyUnassigned, setOnlyUnassigned] = useState(false);
      const [searchText, setSearchText] = useState('');

      // 모달 상태
      const [detailModal, setDetailModal] = useState(null);
      const [editEventForm, setEditEventForm] = useState(null);
      const [isUpdatingEvent, setIsUpdatingEvent] = useState(false);

      const calendarNodeRef = useRef(null);
      const calendarInstanceRef = useRef(null);
      const tooltipRef = useRef(null);
      const filteredEventsRef = useRef([]);
      const scheduleRef = useRef([]);

      // 두 시트('캠페인 스케줄' + '요청 접수') 데이터 동시 로드
      const fetchAllStatusData = async () => {
        setIsLoading(true);
        try {
          const [schedRes, campRes] = await Promise.all([
            fetch("https://btv-proxy.alcheminos.workers.dev?action=getScheduleData").then(r => r.json()).catch(() => ({ data: [] })),
            fetch("https://btv-proxy.alcheminos.workers.dev?action=getCampaigns").then(r => r.json()).catch(() => [])
          ]);
          const sList = (schedRes && Array.isArray(schedRes.data)) ? schedRes.data : (Array.isArray(schedRes) ? schedRes : []);
          const cList = Array.isArray(campRes) ? campRes : [];
          setScheduleData(sList);
          scheduleRef.current = sList;
          setCampaignData(cList);
        } catch (err) {
          console.error("통합 현황 로드 실패:", err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => { fetchAllStatusData(); }, []);

      // 🌟 '캠페인 스케줄'과 '요청 접수(배너 시안)'를 uniqueCode / 캠페인명으로 조인하여 통합 아이템 생성
      const unifiedItems = (() => {
        const map = {};

        // 1. 배너 시안 캠페인('요청 접수') 먼저 등록
        campaignData.forEach(c => {
          const code = String(c.uniqueCode || '').trim();
          const name = String(c.campaignName || '').trim();
          const key = code || `NAME_${name}`;
          map[key] = {
            key,
            uniqueCode: code,
            campaignName: name,
            startDate: cleanScheduleDateStr(c.startDate),
            dueDate: cleanScheduleDateStr(c.dueDate) || cleanScheduleDateStr(c.startDate),
            department: c.department || c.meta?.department || 'Btv큐레이션팀',
            marketer: c.marketer || c.meta?.marketer || '',
            hasBannerAssets: Array.isArray(c.assets) && c.assets.length > 0,
            hasSchedule: false,
            bannerRecord: c,
            scheduleRecord: null,
            category: 'BANNER_ONLY' // 기본: 🖼️ 시안 전용 (MASS 배너)
          };
        });

        // 2. 스케줄 데이터('캠페인 스케줄') 병합
        scheduleData.forEach((s, idx) => {
          const st = String(s['상태'] || '').trim();
          if (st === '취소' || st === '제외') return;

          const code = String(s.uniqueCode || '').trim();
          const name = extractCampaignTitle(s);
          let matchedKey = null;
          if (code && map[code]) matchedKey = code;
          else {
            const found = Object.values(map).find(item => item.campaignName === name && item.startDate === cleanScheduleDateStr(s['시작일']));
            if (found) matchedKey = found.key;
          }

          if (matchedKey) {
            map[matchedKey].hasSchedule = true;
            map[matchedKey].scheduleRecord = s;
            map[matchedKey].category = map[matchedKey].hasBannerAssets ? 'INTEGRATED' : 'CAPA_ONLY';
            if (!map[matchedKey].department) map[matchedKey].department = extractDeptName(s);
            if (!map[matchedKey].marketer) map[matchedKey].marketer = extractMarketerName(s);
          } else {
            const newKey = code || `SCHED_${idx}_${name}`;
            map[newKey] = {
              key: newKey,
              uniqueCode: code,
              campaignName: name,
              startDate: cleanScheduleDateStr(s['시작일']),
              dueDate: cleanScheduleDateStr(s['종료일']) || cleanScheduleDateStr(s['시작일']),
              department: extractDeptName(s),
              marketer: extractMarketerName(s),
              hasBannerAssets: false,
              hasSchedule: true,
              bannerRecord: null,
              scheduleRecord: s,
              category: 'CAPA_ONLY' // ⚡ Capa 전용 (단순 Capa 신청 건)
            };
          }
        });

        return Object.values(map).sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
      })();

      // 필터링된 통합 아이템 목록
      const filteredUnifiedItems = unifiedItems.filter(u => {
        if (categoryFilter !== 'ALL' && u.category !== categoryFilter) return false;
        if (excludeWired && u.scheduleRecord && checkIsWiredDept(u.scheduleRecord)) return false;

        const st = String(u.scheduleRecord?.['상태'] || '').trim();
        const tm = String(u.scheduleRecord?.['실행시각'] || '').trim();
        const isUnassigned = st === '미반영' || tm.includes('배정 불가');
        if (onlyUnassigned && !isUnassigned) return false;

        if (searchText && !u.campaignName.toUpperCase().includes(searchText.toUpperCase())) return false;

        if (typeFilters.length > 0) {
          const fText = String(u.scheduleRecord?.['채널'] || u.scheduleRecord?.['필터'] || u.bannerRecord?.bannerTypes || '').toUpperCase();
          const hasTV = typeFilters.includes("TV") && (fText.includes("TV") || fText.includes("POPUP"));
          const hasToast = typeFilters.includes("토스트팝업") && fText.includes("토스트");
          const hasCoupon = typeFilters.includes("쿠폰") && (checkItemHasCoupon(u.scheduleRecord) || u.bannerRecord?.hasCoupon === 'Y');
          const hasSeg = typeFilters.includes("Seg채널") && (fText.includes("SEG") || fText.includes("배너") || u.hasBannerAssets);
          if (!(hasTV || hasToast || hasCoupon || hasSeg)) return false;
        }
        return true;
      });

      // 상세 모달 열기 (동기 세팅으로 프리징 완벽 방지)
      const openUnifiedDetailModal = (uItem, fallbackDateStr = todayLocalStr) => {
        if (tooltipRef.current) tooltipRef.current.style.display = 'none';
        const s = uItem.scheduleRecord || {};
        const b = uItem.bannerRecord || {};
        const sDate = uItem.startDate || fallbackDateStr || todayLocalStr;
        const eDate = uItem.dueDate || sDate;

        setEditEventForm({
          _rowIndex: s._rowIndex,
          uniqueCode: uItem.uniqueCode || '',
          campaignName: uItem.campaignName,
          startDate: sDate,
          endDate: eDate,
          channel: s['채널'] || s['필터'] || (uItem.hasBannerAssets ? 'MASS 배너' : '쿠폰'),
          gnb: s['GNB'] || b.gnbLocations || '홈',
          cycle: extractCycleName(s),
          couponYn: checkItemHasCoupon(s) || b.hasCoupon === 'Y' ? '쿠폰' : '미포함',
          targetSize: String(extractTargetNum(s) || b.targetSize || 0),
          department: uItem.department || 'Btv큐레이션팀',
          marketer: uItem.marketer || ''
        });

        setDetailModal({
          type: 'EVENT',
          title: uItem.campaignName,
          uItem: uItem,
          dateStr: sDate
        });
      };

      // 배너 시안 수정으로 이동
      const handleEditBannerAssets = (bRecord, sRecord) => {
        if (!bRecord) return;
        const meta = bRecord.meta || {
          campaignName: bRecord.campaignName, target: bRecord.target, targetSize: bRecord.targetSize,
          startDate: bRecord.startDate, dueDate: bRecord.dueDate, hasCoupon: bRecord.hasCoupon,
          couponBenefit: bRecord.couponBenefit, conceptCopy: bRecord.conceptCopy, mainImageUrl: bRecord.mainImageUrl,
          product: bRecord.product, bannerTypes: bRecord.bannerTypes, gnbLocations: bRecord.gnbLocations,
          department: bRecord.department || extractDeptName(sRecord) || localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
          marketer: bRecord.marketer || extractMarketerName(sRecord) || localStorage.getItem('myMarketerName') || ''
        };
        meta.parentJiraKey = bRecord.jiraKey ? String(bRecord.jiraKey).split('/').pop() : '';
        meta.uniqueCode = bRecord.uniqueCode || meta.uniqueCode || '';
        onLoadCampaign && onLoadCampaign(meta, bRecord.assets || [], bRecord.mermaidCode || "");
      };

      // 캠페인 복제 (유형별 분기)
      const handleDuplicateUnified = (uItem) => {
        if (uItem.hasBannerAssets && uItem.bannerRecord) {
          const item = uItem.bannerRecord;
          const meta = {
            ...(item.meta || {}),
            campaignName: `${item.campaignName} (복제본)`,
            target: item.target,
            targetSize: item.targetSize,
            startDate: item.startDate,
            dueDate: item.dueDate,
            hasCoupon: item.hasCoupon,
            couponBenefit: item.couponBenefit,
            conceptCopy: item.conceptCopy,
            mainImageUrl: item.mainImageUrl,
            product: item.product,
            bannerTypes: item.bannerTypes,
            gnbLocations: item.gnbLocations,
            isCapaChecked: true,
            department: uItem.department || localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
            marketer: uItem.marketer || localStorage.getItem('myMarketerName') || ''
          };
          delete meta.uniqueCode;
          delete meta.parentJiraKey;
          const duplicatedAssets = (item.assets || []).map((a, idx) => ({ ...a, id: `asset-dup-${Date.now()}-${idx}` }));
          onDuplicateCampaign && onDuplicateCampaign(meta, duplicatedAssets, item.mermaidCode || "");
        } else if (uItem.scheduleRecord) {
          const s = uItem.scheduleRecord;
          const tNum = extractTargetNum(s);
          onStartPlanWithDate && onStartPlanWithDate({
            campaignName: `${uItem.campaignName} (복제본)`,
            startDate: uItem.startDate,
            dueDate: uItem.dueDate,
            target: tNum > 0 ? 'TARGET' : 'MASS',
            targetSize: tNum > 0 ? tNum.toLocaleString() : '',
            hasCoupon: checkItemHasCoupon(s) ? 'Y' : 'N',
            channels: s['채널'] || s['필터'] || '쿠폰',
            isCapaChecked: true,
            department: uItem.department || 'Btv큐레이션팀',
            marketer: uItem.marketer || ''
          });
        }
      };

      // 스케줄 수정 및 재배정
      const handleUpdateEventSchedule = async () => {
        if (!editEventForm) return;
        setIsUpdatingEvent(true);
        try {
          const targetNum = Number(String(editEventForm.targetSize).replace(/[^0-9]/g, '')) || 0;
          const scheduleItem = {
            _rowIndex: editEventForm._rowIndex,
            uniqueCode: editEventForm.uniqueCode,
            "캠페인 명": editEventForm.campaignName,
            "시작일": editEventForm.startDate,
            "종료일": editEventForm.endDate || editEventForm.startDate,
            "채널": editEventForm.channel,
            "GNB": editEventForm.gnb,
            "주기성 여부": editEventForm.cycle,
            "쿠폰 여부": editEventForm.couponYn,
            "타겟 수": targetNum,
            "요청 부서": editEventForm.department,
            "담당자 이름": editEventForm.marketer
          };
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "updateSchedule", scheduleItem })
          });
          const json = await res.json();
          if (json.status === 'success') {
            await fetchAllStatusData();
            alert("✅ 일정 변경 및 실행시각 재배정이 완료되었습니다!");
            setDetailModal(null);
          } else {
            alert("⚠️ 수정 실패: " + (json.message || "오류 발생"));
          }
        } catch (err) {
          alert("⚠️ 통신 오류: " + err.message);
        } finally {
          setIsUpdatingEvent(false);
        }
      };

      // 🌟 캠페인/스케줄 취소 시 구글 시트 슬롯 반환 + Jira 티켓 자동 삭제(또는 [🚫취소됨] 처리) 동시 실행
      const handleCancelOrDeleteUnified = async (uItem) => {
        const rawJiraKey = uItem.bannerRecord?.jiraKey || uItem.bannerRecord?.meta?.parentJiraKey || '';
        const hasJira = Boolean(rawJiraKey && rawJiraKey !== '-');

        const msg = uItem.category === 'INTEGRATED'
          ? `[${uItem.campaignName}]의 배너 편성과 타겟 스케줄을 모두 취소(삭제)하여 슬롯을 반환하시겠습니까?${hasJira ? '\n(연결된 Jira 티켓도 함께 삭제/취소 처리됩니다.)' : ''}`
          : `[${uItem.campaignName}] 항목을 삭제하여 슬롯을 반환하시겠습니까?${hasJira ? '\n(연결된 Jira 티켓도 함께 삭제/취소 처리됩니다.)' : ''}`;
        if (!window.confirm(msg)) return;

        setIsUpdatingEvent(true);
        try {
          // 1. 구글 시트('요청 접수' 및 '캠페인 스케줄')에서 삭제하여 슬롯 반환
          if (uItem.hasBannerAssets) {
            await fetch("https://btv-proxy.alcheminos.workers.dev", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "cancelCampaignAssets",
                uniqueCode: uItem.uniqueCode,
                campaignName: uItem.campaignName,
                alsoDeleteSchedule: uItem.hasSchedule
              })
            });
          } else if (uItem.hasSchedule && uItem.scheduleRecord) {
            await fetch("https://btv-proxy.alcheminos.workers.dev", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "deleteSchedule",
                scheduleItem: {
                  _rowIndex: uItem.scheduleRecord._rowIndex,
                  uniqueCode: uItem.uniqueCode,
                  "캠페인 명": uItem.campaignName
                }
              })
            });
          }

          // 2. 연결된 Jira 티켓이 있으면 크롬 확장 프로그램을 통해 Jira 티켓 삭제(또는 [🚫취소됨] 마킹) 실행
          let jiraResultMsg = "";
          if (hasJira) {
            const jiraRes = await new Promise((resolve) => {
              const timeout = setTimeout(() => resolve({ status: "timeout" }), 8000);
              const listener = (e) => {
                clearTimeout(timeout);
                window.removeEventListener('RECEIVE_JIRA_CANCEL', listener);
                resolve(e.detail || { status: "unknown" });
              };
              window.addEventListener('RECEIVE_JIRA_CANCEL', listener);
              window.dispatchEvent(new CustomEvent('CANCEL_JIRA_ISSUE', {
                detail: { jiraKey: rawJiraKey, campaignName: uItem.campaignName }
              }));
            });

            if (jiraRes.status === "deleted") {
              jiraResultMsg = `\n• Jira 티켓(${jiraRes.issueKey}) 및 하위 일감이 완전히 삭제되었습니다.`;
            } else if (jiraRes.status === "marked_canceled") {
              jiraResultMsg = `\n• 사내 Jira 삭제 권한 정책에 따라 티켓(${jiraRes.issueKey}) 및 하위 일감 제목이 [🚫취소됨]으로 변경되고 취소 댓글이 등록되었습니다.`;
            } else {
              jiraResultMsg = `\n• (참고) Jira 티켓 자동 취소 응답이 지연되었습니다. Jira 로그인 상태를 확인해 주세요.`;
            }
          }

          await fetchAllStatusData();
          alert(`🗑️ 프로모션 취소 및 슬롯 반환이 완료되었습니다!${jiraResultMsg}`);
          setDetailModal(null);
        } catch (e) {
          alert("⚠️ 삭제 처리 중 오류 발생: " + e.message);
        } finally {
          setIsUpdatingEvent(false);
        }
      };

      const handleAssignExecutionTimes = async () => {
        setIsAssigning(true);
        try {
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "assignExecutionTimes" })
          });
          const json = await res.json();
          if (json.status === 'success') {
            await fetchAllStatusData();
            const s = json.summary || {};
            alert(`✅ 실행시각 자동배정 완료!\n• 확정 배정: ${s.assignedCount || 0}건\n• 미반영(슬랙 알림): ${s.failedCount || 0}건`);
          }
        } catch (e) {
          alert("⚠️ 서버 통신 오류: " + e.message);
        } finally {
          setIsAssigning(false);
        }
      };

      // FullCalendar 이벤트 빌드
      const buildCalendarEvents = () => {
        const evs = [];
        filteredUnifiedItems.forEach((u, idx) => {
          const s = u.scheduleRecord || {};
          const status = String(s['상태'] || (u.hasBannerAssets ? '편성 확정' : '대기 중')).trim();
          const execTime = String(s['실행시각'] || '').trim();
          const isUnassigned = status === '미반영' || execTime.includes('배정 불가');
          const isPending = status === '대기 중';

          let badgePrefix = '';
          let clsName = 'event-start';
          let sortOrd = 2;

          if (isUnassigned) {
            badgePrefix = '[⚠️미반영] ';
            clsName = 'event-unassigned';
            sortOrd = 0;
          } else if (isPending && u.hasSchedule) {
            badgePrefix = '[⏳대기] ';
            clsName = 'event-pending';
            sortOrd = 1;
          } else if (u.category === 'BANNER_ONLY') {
            badgePrefix = '[🖼️배너] ';
            clsName = 'event-banner-only';
            sortOrd = 3;
          } else if (execTime && execTime !== '상시(MASS)') {
            badgePrefix = `[${execTime}] `;
          }

          if (u.startDate && dateFilters.includes('start')) {
            evs.push({
              id: `uni-start-${idx}`,
              title: `${badgePrefix}${u.campaignName}`,
              start: u.startDate,
              allDay: true,
              className: clsName,
              extendedProps: { uItem: u, type: 'start', sortOrder: sortOrd }
            });
          }
          if (u.dueDate && u.dueDate !== u.startDate && dateFilters.includes('end')) {
            evs.push({
              id: `uni-end-${idx}`,
              title: `[종료] ${u.campaignName}`,
              start: u.dueDate,
              allDay: true,
              className: 'event-end',
              extendedProps: { uItem: u, type: 'end', sortOrder: 4 }
            });
          }
        });
        return evs;
      };

      const refreshCalendarCellBadges = () => {
        if (!calendarNodeRef.current) return;
        const rawArr = scheduleRef.current;

        calendarNodeRef.current.querySelectorAll('.calendar-day-target-sum').forEach(el => {
          const dateStr = el.getAttribute('data-date');
          if (!dateStr) return;
          const bUsed = calcDailyUsed('banner', dateStr, rawArr, excludeWired);
          const cUsed = calcDailyUsed('coupon', dateStr, rawArr, excludeWired);
          const totalTarget = Math.max(bUsed, cUsed);
          el.innerText = totalTarget > 0 ? `(${formatTargetKor(totalTarget)})` : '';

          const cellEl = el.closest('.fc-daygrid-day');
          if (cellEl) {
            let capaEl = cellEl.querySelector('.calendar-day-capa-remain');
            if (!capaEl) {
              capaEl = document.createElement('div');
              capaEl.className = 'calendar-day-capa-remain';
              cellEl.appendChild(capaEl);
            }
            const bannerRemain = Math.max(calcDailyLimit('banner', dateStr, todayLocalStr) - bUsed, 0);
            const couponRemain = Math.max(calcDailyLimit('coupon', dateStr, todayLocalStr) - cUsed, 0);
            capaEl.innerText = `B ${formatTargetKor(bannerRemain)} · C ${formatTargetKor(couponRemain)}`;
          }

          const topEl = el.parentElement;
          if (topEl) {
            const oldBadge = topEl.querySelector('.calendar-congestion-badge');
            if (oldBadge) oldBadge.remove();
            const congestionClass = bUsed < 1000000 ? 'green' : (bUsed < 2000000 ? 'yellow' : 'red');
            const badge = document.createElement('span');
            badge.className = `calendar-congestion-badge ${congestionClass}`;
            topEl.appendChild(badge);
          }
        });
      };

      useEffect(() => {
        if (viewMode !== 'CALENDAR') {
          if (calendarInstanceRef.current) {
            calendarInstanceRef.current.destroy();
            calendarInstanceRef.current = null;
          }
          return;
        }
        if (!calendarNodeRef.current || typeof window.FullCalendar === 'undefined') return;
        const filteredEvs = buildCalendarEvents();
        filteredEventsRef.current = filteredEvs;

        if (!calendarInstanceRef.current) {
          const cal = new window.FullCalendar.Calendar(calendarNodeRef.current, {
            initialView: 'dayGridMonth',
            locale: 'ko',
            events: filteredEvs,
            dayMaxEvents: 5,
            height: 'auto',
            eventOrder: 'sortOrder,title',
            eventClick: (info) => {
              info.jsEvent.stopPropagation();
              const uItem = info.event.extendedProps?.uItem;
              if (uItem) openUnifiedDetailModal(uItem, info.event.startStr);
            },
            dateClick: (info) => {
              if (tooltipRef.current) tooltipRef.current.style.display = 'none';
              const dayEvs = filteredEventsRef.current.filter(e => e.extendedProps?.type === 'start' && e.start === info.dateStr);
              setDetailModal({
                type: 'DATE',
                title: `${info.dateStr} 프로모션 현황 (${dayEvs.length}건)`,
                data: dayEvs,
                dateStr: info.dateStr
              });
            },
            dayCellDidMount: (info) => {
              const cellEl = info.el;
              const topEl = cellEl.querySelector('.fc-daygrid-day-top');
              const offset = info.date.getTimezoneOffset() * 60000;
              const dStr = new Date(info.date.getTime() - offset).toISOString().split('T')[0];

              if (topEl && !topEl.querySelector('.calendar-day-target-sum')) {
                const sumEl = document.createElement('span');
                sumEl.className = 'calendar-day-target-sum';
                sumEl.setAttribute('data-date', dStr);
                topEl.appendChild(sumEl);
              }
            },
            datesSet: () => {
              setTimeout(refreshCalendarCellBadges, 0);
            }
          });
          cal.render();
          calendarInstanceRef.current = cal;
        } else {
          calendarInstanceRef.current.removeAllEvents();
          calendarInstanceRef.current.addEventSource(filteredEvs);
        }
        setTimeout(refreshCalendarCellBadges, 50);
      }, [viewMode, scheduleData, campaignData, categoryFilter, typeFilters, dateFilters, excludeWired, onlyUnassigned, searchText]);

      const renderCategoryBadge = (cat) => {
        if (cat === 'INTEGRATED') return <span className="text-[10px] font-black px-2 py-0.5 rounded bg-[#4f3df6]/20 text-[#7387ff] border border-[#4f3df6]/40">🎨 통합 (시안+Capa)</span>;
        if (cat === 'CAPA_ONLY') return <span className="text-[10px] font-black px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">⚡ Capa 전용</span>;
        return <span className="text-[10px] font-black px-2 py-0.5 rounded bg-[#32d782]/20 text-[#32d782] border border-[#32d782]/40">🖼️ 시안 전용 (MASS)</span>;
      };

      return (
        <div className="flex-1 h-full overflow-y-auto custom-scrollbar bg-[#06070a] p-6 space-y-5">
          {/* 상단 헤더 & 캘린더/리스트 뷰 토글 스위치 */}
          <div className="bg-gradient-to-r from-[#12141c] to-[#1a1c26] border border-[#262833] rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div>
              <h2 className="text-xl font-black text-white tracking-tight flex items-center gap-2.5">
                <FolderOpen size={22} className="text-[#7387ff]" /> 통합 프로모션 현황 (캘린더 & 목록)
              </h2>
              <p className="text-xs text-slate-400 mt-1">Capa 전용 스케줄과 배너 시안 캠페인을 한곳에서 조회하고 유형별로 수정·복제·일정 변경을 수행합니다.</p>
            </div>

            <div className="flex items-center gap-2.5 flex-wrap">
              {/* 뷰 전환 토글 */}
              <div className="bg-[#0a0812] p-1 rounded-xl border border-[#303340] flex items-center">
                <button
                  onClick={() => setViewMode('CALENDAR')}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-black transition-all ${viewMode === 'CALENDAR' ? 'bg-[#4f3df6] text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  <CalendarDays size={14} /> 캘린더 뷰
                </button>
                <button
                  onClick={() => setViewMode('LIST')}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-black transition-all ${viewMode === 'LIST' ? 'bg-[#4f3df6] text-white shadow' : 'text-slate-400 hover:text-white'}`}
                >
                  <ListTodo size={14} /> 리스트 뷰 ({filteredUnifiedItems.length})
                </button>
              </div>

              <button
                onClick={handleAssignExecutionTimes}
                disabled={isAssigning || isLoading}
                className="flex items-center gap-1.5 px-3.5 py-2 bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold transition-all"
              >
                <Zap size={14} /> 실행시각 자동배정
              </button>

              <button
                onClick={fetchAllStatusData}
                disabled={isLoading}
                className="flex items-center gap-1.5 px-3 py-2 bg-[#12141c] hover:bg-[#262833] text-slate-300 border border-[#303340] rounded-xl text-xs font-bold"
              >
                <RefreshCw size={14} className={isLoading ? "animate-spin text-[#7387ff]" : ""} />
              </button>
            </div>
          </div>

          {/* 필터 컨트롤 바 */}
          <div className="bg-[#0f111a] border border-[#262833] rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-lg">
            <div className="flex flex-wrap items-center gap-3">
              {/* 프로모션 유형 필터 */}
              <div className="flex items-center gap-1 bg-[#12141c] p-1 rounded-xl border border-[#262833]">
                {[
                  { id: 'ALL', label: '전체 유형' },
                  { id: 'INTEGRATED', label: '🎨 통합 프로모션' },
                  { id: 'CAPA_ONLY', label: '⚡ Capa 전용' },
                  { id: 'BANNER_ONLY', label: '🖼️ 시안 전용' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCategoryFilter(tab.id)}
                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${categoryFilter === tab.id ? 'bg-[#4f3df6] text-white' : 'text-slate-400 hover:text-white'}`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="h-4 w-[1px] bg-[#262833]" />

              <button
                onClick={() => setOnlyUnassigned(!onlyUnassigned)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-all flex items-center gap-1 ${onlyUnassigned ? 'bg-red-500 text-white border-red-400' : 'bg-[#12141c] border-[#262833] text-red-400 hover:bg-red-500/15'}`}
              >
                <AlertTriangle size={12} /> 미반영만 보기
              </button>

              {viewMode === 'CALENDAR' && (
                <>
                  <div className="h-4 w-[1px] bg-[#262833]" />
                  <div className="flex items-center gap-2.5">
                    <label className="flex items-center gap-1.5 text-xs font-bold text-slate-300 cursor-pointer">
                      <input type="checkbox" checked={dateFilters.includes('start')} onChange={e => setDateFilters(e.target.checked ? [...dateFilters, 'start'] : dateFilters.filter(x => x !== 'start'))} className="accent-[#4f3df6]" />
                      시작일
                    </label>
                    <label className="flex items-center gap-1.5 text-xs font-bold text-slate-400 cursor-pointer">
                      <input type="checkbox" checked={dateFilters.includes('end')} onChange={e => setDateFilters(e.target.checked ? [...dateFilters, 'end'] : dateFilters.filter(x => x !== 'end'))} className="accent-[#4f3df6]" />
                      종료일
                    </label>
                  </div>
                </>
              )}
            </div>

            <div className="relative w-[240px]">
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
              <input
                type="text"
                value={searchText}
                onChange={e => setSearchText(e.target.value)}
                placeholder="캠페인명 검색..."
                className="w-full bg-[#0a0812] border border-[#303340] rounded-xl pl-8 pr-3 py-1.5 text-xs text-white outline-none focus:border-[#4f3df6]"
              />
            </div>
          </div>

          {/* 뷰 모드 1: 캘린더 뷰 */}
          {viewMode === 'CALENDAR' && (
            <div id="schedule-calendar" ref={calendarNodeRef} className="shadow-2xl" />
          )}

          {/* 뷰 모드 2: 리스트 뷰 (유형별 맞춤 액션 버튼 제공) */}
          {viewMode === 'LIST' && (
            <div className="bg-[#0f111a] border border-[#262833] rounded-2xl overflow-hidden shadow-xl">
              {isLoading ? (
                <div className="py-16 flex flex-col items-center justify-center gap-3 text-slate-500">
                  <Loader2 size={28} className="animate-spin text-[#7387ff]" />
                  <span className="text-sm font-medium">통합 프로모션 목록을 불러오는 중...</span>
                </div>
              ) : filteredUnifiedItems.length === 0 ? (
                <div className="py-16 flex flex-col items-center justify-center gap-2 text-slate-500">
                  <Inbox size={32} className="text-slate-700" />
                  <span className="text-sm font-medium">조건에 맞는 프로모션이 없습니다.</span>
                </div>
              ) : (
                <div className="divide-y divide-[#1a1c26]">
                  {filteredUnifiedItems.map((u) => {
                    const s = u.scheduleRecord || {};
                    const b = u.bannerRecord || {};
                    const tSize = extractTargetNum(s) || Number(String(b.targetSize || '0').replace(/[^0-9]/g, '')) || 0;
                    const schedStatus = String(s['상태'] || (u.hasBannerAssets ? '편성 확정' : '대기 중')).trim();
                    const execTime = String(s['실행시각'] || '').trim();
                    const isUnassigned = schedStatus === '미반영' || execTime.includes('배정 불가');

                    const bannerNames = u.hasBannerAssets
                      ? (b.assets || []).map(a => `${a.name}(${Array.isArray(a.data?.gnb) ? a.data.gnb.join('/') : (a.data?.gnb || '홈')})`).join(', ')
                      : (s['채널'] || s['필터'] || '배너 시안 없음');

                    return (
                      <div key={u.key} className="p-4 hover:bg-[#12141c] transition-colors flex flex-wrap items-center justify-between gap-4">
                        <div className="w-full md:w-[36%] min-w-[260px] pr-2">
                          <div className="flex items-center gap-2 flex-wrap mb-1.5">
                            {renderCategoryBadge(u.category)}
                            <h4 className="text-white font-bold text-sm truncate max-w-[240px]" title={u.campaignName}>{u.campaignName}</h4>
                            {tSize > 0 && (
                              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-pink-500/15 text-pink-400 border border-pink-500/30">
                                {formatTargetKor(tSize)}
                              </span>
                            )}
                            {u.hasSchedule && (
                              <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${isUnassigned ? 'bg-red-500/20 text-red-400 border border-red-500/40' : schedStatus === '일정 확정' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}`}>
                                {schedStatus} {execTime ? `(${execTime})` : ''}
                              </span>
                            )}
                          </div>
                          <div className="text-[11px] text-slate-400 flex items-center gap-2">
                            <span>📅 {u.startDate} ~ {u.dueDate}</span>
                            <span>•</span>
                            <span>👤 {u.department} {u.marketer}</span>

    };
    
    // ====================================================================================
    // 🌟 메인 App 컴포넌트 (Step 1 -> Step 2 -> Step 3 단계별 잠금 및 통합 현황 연결)
    // ====================================================================================
    function App() {
      // 'STEP1_CAPA' | 'PLANNER' | 'EDITOR' | 'STATUS'
      const [currentView, setCurrentView] = useState('STEP1_CAPA');
      const [statusInitialMode, setStatusInitialMode] = useState('CALENDAR');

      // 🌟 5번 요구사항: 단선적(Step-by-Step) 잠금 상태 관리
      const [unlockedSteps, setUnlockedSteps] = useState({
        step1: true,
        step2: false,
        step3: false
      });

      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [isNavExpanded, setIsNavExpanded] = useState(false); 
      const [extensionVersion, setExtensionVersion] = useState(null);
      const [githubVersion, setGithubVersion] = useState(null);
      const [jiraSession, setJiraSession] = useState('CHECKING');
      
      const [isFlowModalOpen, setIsFlowModalOpen] = useState(false);
      const [sheetBannerSpecs, setSheetBannerSpecs] = useState([]);

      const fetchBannerSpecsFromSheet = async () => {
        try {
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev?action=getBannerSpecs");
          const json = await res.json();
          if (json && json.status === 'success' && Array.isArray(json.data)) {
            setSheetBannerSpecs(json.data);
          }
        } catch (e) {
          console.error("배너 규격 시트 로드 실패:", e);
        }
      };

      const checkJiraSessionNow = () => {
        setJiraSession('CHECKING');
        const extNode = document.getElementById('btv-campaign-extension-installed');
        if (extNode) {
          setExtensionVersion(extNode.getAttribute('data-version') || '1.0.0');
          
          const sessionListener = (e) => {
            setJiraSession(e.detail?.isLogged ? 'LOGGED_IN' : 'LOGGED_OUT');
            window.removeEventListener('RECEIVE_JIRA_SESSION', sessionListener);
          };
          window.addEventListener('RECEIVE_JIRA_SESSION', sessionListener);
          window.dispatchEvent(new CustomEvent('REQUEST_JIRA_SESSION'));
        } else {
          setJiraSession('LOGGED_OUT');
        }
      };

      useEffect(() => {
        fetch('https://raw.githubusercontent.com/btvcuration/campaign/main/Tool/manifest.json')
          .then(res => res.json())
          .then(data => setGithubVersion(data.version))
          .catch(e => console.error("버전 체크 실패", e));

        checkJiraSessionNow();
        setTimeout(checkJiraSessionNow, 1000);
        fetchBannerSpecsFromSheet();
      }, []);

      const getMatchedSheetSpec = (asset) => {
        if (!asset || sheetBannerSpecs.length === 0) return null;
        const aName = String(asset.name || '').replace(/\s+/g, '');
        if (asset.type === 'BIG_BANNER' && asset.data?.subType === '가입하기형') {
          const subMatch = sheetBannerSpecs.find(s => s.bannerName.replace(/\s+/g, '').includes('월정액'));
          if (subMatch) return subMatch;
        }
        const byName = sheetBannerSpecs.find(s => aName.includes(s.bannerName.replace(/\s+/g, '')));
        if (byName) return byName;
        return sheetBannerSpecs.find(s => s.type === asset.type) || null;
      };

      const [campaignMeta, setCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', externalGift: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false,
        department: localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
        marketer: localStorage.getItem('myMarketerName') || '',
        cycle: '단발성', uiVersion: '5.0'
      });

      const [assets, setAssets] = useState([]); 
      const [mermaidCode, setMermaidCode] = useState('');
      const AUTOSAVE_KEY = 'btv_campaign_autosave_v1';
      
      const [aiCampaignMeta, setAiCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', externalGift: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false,
        department: localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
        marketer: localStorage.getItem('myMarketerName') || '',
        cycle: '단발성', uiVersion: '5.0'
      });
      const [aiChatHistory, setAiChatHistory] = useState([
        { id: 'msg-init', sender: 'ai', text: '매니저님, 환영합니다.\n어떤 프로모션을 기획하실 예정인가요? 우측 폼에 아시는 만큼 먼저 적어주셔도 좋고, 저와 대화하며 하나씩 채워가도 좋습니다!' }
      ]);

      const [exportState, setExportState] = useState({ isExporting: false, progress: 0, msg: '' });
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [openAccordions, setOpenAccordions] = useState({ campaign: true, banner: true });

      const handleSettingsClick = () => setIsSettingsOpen(true);
      const handleConfigChange = (gnbName, field, value) => setConfigMap(prev => ({ ...prev, [gnbName]: { ...prev[gnbName], [field]: value } }));
      const handleSaveConfig = async () => { setIsSettingsOpen(false); };

      // Step 2 -> Step 3 이동 (Step 3 잠금 해제)
      const handleMoveToEditor = (payload, onInvalid) => {
        setCampaignMeta({ ...aiCampaignMeta });
        if (!payload || payload.action !== "CREATE_CAMPAIGN_ASSETS") {
          setUnlockedSteps(prev => ({ ...prev, step3: true }));
          setCurrentView('EDITOR');
          return;
        }
        const aiMeta = payload.rawGasData?.meta || {};
        const aiAssets = payload.rawGasData?.assets || [];
        const aiMermaid = payload.mermaidCode || payload.rawGasData?.mermaidCode || "";
      
        if (aiAssets.length === 0 && !aiMermaid) {
          alert("🚨 AI가 최종 시안 데이터를 정상적으로 렌더링하지 못했습니다. (서버 응답 오류)\n수동으로 배너를 추가하거나, AI에게 다시 시안 생성을 요청해 주세요.");
          if (onInvalid) onInvalid();
          return;
        }
        
        if (assets.length > 0) {
          const confirmOverwrite = window.confirm("⚠️ 이미 시안 편집 화면에 작업 중인 배너가 존재합니다.\n새로운 AI 기획안으로 덮어씌우시겠습니까?");
          if (!confirmOverwrite) {
            setUnlockedSteps(prev => ({ ...prev, step3: true }));
            setCurrentView('EDITOR');
            return;
          }
        }

        const formMainImg = aiCampaignMeta.mainImageUrl || aiMeta.mainImageUrl || '';

        if (aiMermaid) setMermaidCode(aiMermaid);
        if (aiMeta) {
          if (!aiMeta.conceptCopy && (aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept)) {
             aiMeta.conceptCopy = aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept;
          }
          if (Array.isArray(aiMeta.bannerTypes)) aiMeta.bannerTypes = aiMeta.bannerTypes.join(', ');
          if (Array.isArray(aiMeta.gnbLocations)) aiMeta.gnbLocations = aiMeta.gnbLocations.join(', ');
          if (formMainImg) aiMeta.mainImageUrl = formMainImg;
          setCampaignMeta(prev => ({ 
            ...prev, 
            ...aiMeta,
            target: aiCampaignMeta.target || aiMeta.target || prev.target,
            targetSize: aiCampaignMeta.targetSize || aiMeta.targetSize || prev.targetSize,
            isCapaChecked: aiCampaignMeta.isCapaChecked || prev.isCapaChecked,
            department: aiCampaignMeta.department || prev.department || localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
            marketer: aiCampaignMeta.marketer || prev.marketer || localStorage.getItem('myMarketerName') || '',
            cycle: aiCampaignMeta.cycle || prev.cycle || '단발성'
          }));
        }

        if (aiAssets && Array.isArray(aiAssets)) {
          if (aiAssets.length === 0) {
            setAssets([]); setActiveTabId(null);
          } else {
            const timestamp = Date.now();
            const usedNames = [];
            const newAssets = aiAssets.map((aiAsset, index) => {
              let baseData = {};
              if (aiAsset.type === 'TODAY_BTV') baseData = { ...DEFAULT_TODAY_BTV };
              else if (aiAsset.type === 'GENERAL_BANNER') baseData = { ...DEFAULT_GENERAL_BANNER };
              else if (aiAsset.type === 'GENERAL_SET_BANNER') baseData = { ...DEFAULT_GENERAL_SET_BANNER };
              else if (aiAsset.type === 'FULL_PROMO_BANNER') baseData = { ...DEFAULT_FULL_PROMO_BANNER };
              else if (aiAsset.type === 'BIG_BANNER') baseData = { ...DEFAULT_BIG_BANNER };
              else if (aiAsset.type === 'LONG_BANNER') baseData = { ...DEFAULT_LONG_BANNER };
              else if (aiAsset.type === 'STRIP_BANNER') baseData = { ...DEFAULT_STRIP_BANNER };
              else if (aiAsset.type === 'SYNOPSIS_BANNER') baseData = { ...DEFAULT_SYNOPSIS_BANNER };
              else if (aiAsset.type === 'PROMO_POPUP') baseData = { ...DEFAULT_PROMO_POPUP };
              else if (aiAsset.type === 'MINI_EPG_BANNER') baseData = { ...DEFAULT_MINI_EPG_BANNER };
              else baseData = { ...DEFAULT_CUSTOM_BANNER };

              let aiData = { ...(aiAsset.data || {}) };
              const masterImg = formMainImg || aiData.imageUrl || aiData.bannerImg || aiData.bgImg || '';

              if (aiAsset.type === 'TODAY_BTV') {
                if (aiData.subTitle && !aiData.subText) aiData.subText = aiData.subTitle;
                if (!aiData.imageUrl && masterImg) aiData.imageUrl = masterImg;
              } 
              else if (aiAsset.type === 'GENERAL_BANNER') {
                if (aiData.subTitle && !aiData.previewSub) aiData.previewSub = aiData.subTitle;
                if (aiData.mainTitle && !aiData.previewTitle) aiData.previewTitle = aiData.mainTitle;
                if (aiData.mainTitle && !aiData.bannerCopy) aiData.bannerCopy = aiData.mainTitle;
                if (!aiData.bannerImg && masterImg) aiData.bannerImg = masterImg;
                if (aiData.previewImg === aiData.bannerImg || (aiData.previewImg && aiData.previewImg.includes('ui-templates'))) {
