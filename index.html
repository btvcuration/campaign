<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    
    import { 
      Tv, LayoutTemplate, Send, ChevronRight, ChevronDown, ChevronUp, Copy, CheckCircle, 
      Search, Mic, Menu, Home, Grid, Settings, Calendar, GitMerge, Plus, PlusCircle, Trash2, 
      Image as ImageIcon, ListTodo, Smartphone, LayoutPanelLeft, MonitorPlay, Sparkles, Bot, 
      X, User, ExternalLink, Monitor, Layout, Type, RectangleHorizontal, FileText, CalendarDays, MessageSquare, Loader2, Lock, Users, Download, RefreshCw, Inbox, FolderOpen, PanelLeftOpen, PanelLeftClose,
      Database // 🌟 추가됨
    } from 'lucide-react';
    
    const MermaidViewer = ({ code }) => {
      const containerRef = useRef(null);
      useEffect(() => {
        if (code && containerRef.current && window.mermaid) {
          containerRef.current.innerHTML = ''; 
          window.mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { htmlLabels: true, nodeSpacing: 40, rankSpacing: 60 },
            themeCSS: `
              .nodeLabel { font-size: 13px !important; width: 140px !important; white-space: normal !important; text-align: center !important; }
            `
          });
          window.mermaid.render(`mermaid-${Date.now()}`, code).then(({svg}) => {
            if(containerRef.current) containerRef.current.innerHTML = svg;
          }).catch(e => console.error("Mermaid Render Error:", e));
        }
      }, [code]);
      
      if (!code) return null;
      // 👇 여기에 id="mermaid-export-area" 가 추가되었습니다!
      return <div id="mermaid-export-area" ref={containerRef} className="w-full h-full overflow-auto custom-scrollbar p-4 [&>svg]:mx-auto [&>svg]:block" />;
    };

    const GNB_OPTIONS = ['홈', 'Btv+', '영화시리즈', 'TV 방송', '무료', '애니메이션', '해피시니어', '키즈', 'OTT홈', '실시간 채널', '광고 홈', '콘텐츠', '기타'];

    const TEMPLATE_URLS = {
      'TODAY_BTV': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/today_btv.png',
      'GENERAL_BANNER_1COL': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_1col.png',
      'GENERAL_BANNER_2COL': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png',
      'GENERAL_BANNER_3COL': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_3col.png',
      'GENERAL_SET_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png',
      'FULL_PROMO_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/full_promo.png',
      'BIG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/big_banner.png',
      'LONG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/long_banner.png',
      'STRIP_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/strip_banner.png',
      'SYNOPSIS_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/synopsis_banner.png',
      'PROMO_POPUP': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/promo_popup.png',
      'MINI_EPG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/mini_epg.png'
    };

    const BANNER_SPECS = [
      { type: 'TODAY_BTV', name: 'Today B tv', icon: MonitorPlay, ratio: '16:9', desc: '홈 최상단 대형 배너. 75% 이미지 배치.' },
      { type: 'GENERAL_BANNER', name: '일반 배너', icon: LayoutPanelLeft, ratio: '가변', desc: '배경 프리뷰와 하단 배너 카드 1개 세팅.' },
      { type: 'GENERAL_SET_BANNER', name: '일반 배너 (세트형)', icon: Grid, ratio: '가변', desc: '연속된 2/3단 패키지 배너 세팅 및 통합 기획.' },
      { type: 'FULL_PROMO_BANNER', name: '풀프로모션', icon: LayoutTemplate, ratio: '16:9', desc: '공통 배경 위에 메인 카피와 3개 카드 세트.' },
      { type: 'BIG_BANNER', name: '빅배너', icon: Monitor, ratio: '24.5:8.3', desc: '텍스트와 우측 이미지로 구성된 대형 영역.' },
      { type: 'LONG_BANNER', name: '롱배너', icon: Smartphone, ratio: '129:181', desc: '세로형 긴 배너. 카피 가독성 중요.' },
      { type: 'STRIP_BANNER', name: '띠배너', icon: RectangleHorizontal, ratio: '가변', desc: '콘텐츠 사이 삽입되는 가로형 긴 띠배너.' },
      { type: 'SYNOPSIS_BANNER', name: '시놉시스 배너', icon: RectangleHorizontal, ratio: '가변', desc: '시놉시스 화면에 노출되는 쿠폰/할인 띠배너.' },
      { type: 'PROMO_POPUP', name: 'TV 팝업', icon: Sparkles, ratio: '4:3', desc: '중앙 팝업 공지. 이미지와 하단 액션 버튼.' },
      { type: 'MINI_EPG_BANNER', name: '미니 EPG 배너', icon: Tv, ratio: '가변', desc: '실시간 방송 시청 중 노출되는 썸네일.' }
    ];

    const DEFAULT_MINI_EPG_BANNER = { imageUrl: '', buttonText: '감상하기', landingValue: 'UI_PATH: /join', gnb: '실시간 채널', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_TODAY_BTV = { topText: '상단 문구', mainTitle: '메인 문구', subText: '서브 텍스트', landingValue: 'UI_PATH: /join', buttonText: '자세히 보기', imageUrl: '', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_GENERAL_BANNER = { colType: '2단', previewTitle: '배경 좌상단 텍스트 (1줄)', previewSub: '서브 설명글 영역', previewImg: '', bannerCopy: '배너 내 텍스트', bannerImg: '', landingValue: 'UI_PATH: /join', gnb: '영화시리즈', note: '', memos: [], startDate: '', dueDate: '' };
    // 🌟 신규 세트 배너 초기값 (배열 형태)
    const DEFAULT_GENERAL_SET_BANNER = { 
      colType: '3단', 
      selectedCardIndex: 0,
      cards: [
        { heroTitle: '세트 1 좌상단 타이틀', heroSub: '세트 1에 대한 서브 설명글', heroImg: '', cardCopy: '카드 1 타이틀', cardImg: '', landingValue: 'UI_PATH: /set1' },
        { heroTitle: '세트 2 좌상단 타이틀', heroSub: '세트 2에 대한 서브 설명글', heroImg: '', cardCopy: '카드 2 타이틀', cardImg: '', landingValue: 'UI_PATH: /set2' },
        { heroTitle: '세트 3 좌상단 타이틀', heroSub: '세트 3에 대한 서브 설명글', heroImg: '', cardCopy: '카드 3 타이틀', cardImg: '', landingValue: 'UI_PATH: /set3' }
      ], 
      gnb: '영화시리즈', note: '', memos: [], startDate: '', dueDate: '' 
    };
    const DEFAULT_FULL_PROMO_BANNER = { bgImg: '', topLogo: '상단 타이틀', mainCopy: '메인 하이라이트 문구', subCopy: '서브 텍스트 라인', card1Title: '블룸 하우스', card1Sub: '카드 1 설명', card1Img: '', card1Landing: '', card2Title: '블룸 하우스', card2Sub: '카드 2 설명', card2Img: '', card2Landing: '', card3Title: '블룸 하우스', card3Sub: '카드 3 설명', card3Img: '', card3Landing: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_BIG_BANNER = { subType: '기본형', mainTitle: '메인 문구', subTitle: '서브 타이틀', desc: '상세 설명글을 입력해주세요.', buttonText: '바로가기', imageUrl: '', logoImg: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_LONG_BANNER = { copy: '세로형 배너 메인 카피', subTitle: '서브 카피 입력', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_STRIP_BANNER = { mainTitle: '메인 이벤트 타이틀', subTitle: '서브 프로모션 텍스트', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '이벤트', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_SYNOPSIS_BANNER = { mainTitle: '2,000명 추첨 증정', subTitle: '~7.20 | 다음날 발급', imageUrl: '', badgeText: '영화 쿠폰\n3,300원', landingValue: 'UI_PATH: /join', gnb: '콘텐츠', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_PROMO_POPUP = { imageUrl: '', buttonText: '바로가기', closeText: '닫기', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };

    const DraggableMemo = ({ memo, updateMemo, removeMemo }) => {
      const [pos, setPos] = useState({ x: memo.x || 50, y: memo.y || 50 });
      const isDragging = useRef(false);
      const dragStart = useRef({ mouseX: 0, mouseY: 0, boxX: 0, boxY: 0 });

      useEffect(() => { setPos({ x: memo.x || 50, y: memo.y || 50 }); }, [memo.x, memo.y]);

      const handleMouseDown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        
        e.preventDefault(); e.stopPropagation();
        isDragging.current = true;
        dragStart.current = { mouseX: e.clientX, mouseY: e.clientY, boxX: pos.x, boxY: pos.y };

        const handleMouseMove = (ev) => {
          if (!isDragging.current) return;
          ev.preventDefault();
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          setPos({ x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
        };

        const handleMouseUp = (ev) => {
          if (!isDragging.current) return;
          isDragging.current = false;
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          updateMemo(memo.id, { x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
          
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove, { passive: false });
        document.addEventListener('mouseup', handleMouseUp);
      };

      return (
        <div 
          onMouseDown={handleMouseDown}
          className="absolute bg-yellow-300/95 backdrop-blur-sm px-4 py-3 rounded-xl shadow-2xl border border-yellow-400 min-w-[200px] max-w-[300px] transition-shadow hover:shadow-[0_0_20px_rgba(250,204,21,0.6)] cursor-move z-50 pointer-events-auto"
          style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`, left: 0, top: 0, willChange: 'transform' }}
        >
          <div className="flex items-center justify-between gap-4 mb-2 pointer-events-none">
            <div className="flex items-center gap-1.5 text-yellow-800 font-bold text-[10px]"><MessageSquare size={12}/> 시안 메모</div>
            <button onMouseDown={(e) => e.stopPropagation()} onClick={() => removeMemo(memo.id)} className="pointer-events-auto text-yellow-700 hover:text-red-600 hover:bg-yellow-400 p-1 rounded-full transition-colors"><X size={12}/></button>
          </div>
          <textarea 
            onMouseDown={(e) => e.stopPropagation()}
            value={memo.text} 
            onChange={(e) => updateMemo(memo.id, { text: e.target.value })}
            className="w-full bg-yellow-100/50 border border-yellow-400/30 rounded p-2 text-xs text-yellow-900 font-bold outline-none resize-none focus:bg-white focus:ring-1 focus:ring-yellow-500 custom-scrollbar h-[60px] cursor-text pointer-events-auto"
            placeholder="여기에 메모를 입력하세요..."
          />
        </div>
      );
    };

    const OverlayMemos = ({ block, onUpdate }) => {
      const memos = block.data?.memos || [];
      if (memos.length === 0) return null;

      const updateMemo = (id, updates) => {
        const updatedMemos = memos.map(m => m.id === id ? { ...m, ...updates } : m);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      const removeMemo = (id) => {
        const updatedMemos = memos.filter(m => m.id !== id);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      return (
        <div className="absolute inset-0 pointer-events-none z-50 overflow-visible">
          {memos.map(memo => (
            <DraggableMemo key={memo.id} memo={memo} updateMemo={updateMemo} removeMemo={removeMemo} />
          ))}
        </div>
      );
    };

    // 🌟 수정된 PreviewDisplay: onUpdate를 전달받아 상태 변경 가능하게 함
    // 🌟 수정된 PreviewDisplay: Error #60 방지를 위한 렌더 트리 최적화
    const PreviewDisplay = ({ block, onUpdate }) => {
      if (!block) return null;
      const checkIsUrl = (str) => Boolean(str && typeof str === 'string' && str.startsWith('http'));
      const checkHasText = (str) => Boolean(str && !checkIsUrl(str) && str.trim() !== '');
      const getFallbackUrl = () => {
        if (block.type === 'GENERAL_BANNER') {
          if (block.data?.colType === '1단') return TEMPLATE_URLS.GENERAL_BANNER_1COL;
          if (block.data?.colType === '3단') return TEMPLATE_URLS.GENERAL_BANNER_3COL;
          return TEMPLATE_URLS.GENERAL_BANNER_2COL;
        }
        return TEMPLATE_URLS[block.type] || '';
      };
      
      // JSX에서 배경 이미지로 사용할 변수 할당
      const fallbackUrl = getFallbackUrl();

      const FallbackText = ({ text, alignClass = 'justify-center items-center text-center px-4' }) => {
        if (!checkHasText(text) || checkIsUrl(text)) return null;
        return (
          <div className={`absolute inset-0 flex flex-col sm:flex-row gap-2 ${alignClass} text-white font-black select-none drop-shadow-[0_4px_4px_rgba(0,0,0,0.9)] z-20`}>
            <div className="flex items-center text-white/90 shrink-0 bg-black/20 px-2 py-1 rounded-lg backdrop-blur-sm">
              <ImageIcon size={22} className="mr-1.5 opacity-90" />
              <span className="text-sm font-bold tracking-tight">요청 이미지</span>
            </div>
            <span className="text-xl sm:text-2xl truncate leading-tight">{text}</span>
          </div>
        );
      };

      if (block.type === 'TODAY_BTV') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0">
            <div className="absolute inset-0 bg-[#0a0a0f]"></div>
            
            <div className="absolute right-[0%] top-[0%] w-[70%] h-[70%] bg-no-repeat bg-cover bg-right-top z-0" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
              {!checkIsUrl(block.data?.imageUrl) && !checkHasText(block.data?.imageUrl) && <div className="absolute inset-0 bg-gradient-to-bl from-[#1e1b4b] to-[#0a0a0f] opacity-50"></div>}
              <FallbackText text={block.data?.imageUrl} alignClass="justify-end items-start pt-10 pr-10" />
              <div className="absolute inset-0 bg-gradient-to-r from-[#0a0a0f] via-transparent to-transparent w-[35%]"></div>
              <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0f] via-transparent to-transparent h-[35%] top-auto bottom-0"></div>
            </div>
            
            <div className="absolute inset-0 w-[50%] bg-gradient-to-r from-[#0a0a0f] via-[#0a0a0f]/95 to-transparent z-10 pointer-events-none"></div>
            <div className="absolute inset-0 top-[40%] bg-gradient-to-t from-[#0a0a0f] via-[#0a0a0f]/90 to-transparent z-10 pointer-events-none"></div>
            
            <div className="absolute inset-0 z-20 flex flex-col pointer-events-none text-white px-10">
              <div className="absolute left-[80px] top-[48%] -translate-y-1/2 w-[45%] pl-2">
                <h3 className="text-[#32d782] text-sm font-bold mb-2 tracking-tight">{block.data?.topText || '상단 카피'}</h3>
                <h1 className="text-white text-4xl font-black mb-3 leading-[1.15] whitespace-pre-wrap tracking-tighter drop-shadow-lg">{block.data?.mainTitle || '타이틀 입력'}</h1>
                <p className="text-slate-200 text-sm font-medium leading-[1.6] drop-shadow-md whitespace-pre-wrap">{block.data?.subText || '서브 텍스트'}</p>
                <div className="mt-5 inline-flex bg-[#4631e6] text-white px-6 py-2.5 rounded font-bold text-sm shadow-xl">자세히 보기</div>
              </div>
              <div className="absolute bottom-10 left-[80px] right-0 flex gap-3 overflow-hidden">
                {[1,2,3,4,5,6,7].map(i => (
                  <div key={i} className="w-[14%] aspect-[14/9] bg-[#222530] rounded-md border border-white/5 shadow-lg shrink-0"></div>
                ))}
              </div>
            </div>
          </div>
        );
      }
      
      if (block.type === 'FULL_PROMO_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0">
            <div className="absolute inset-0 bg-cover bg-center bg-no-repeat z-0" style={{backgroundImage: checkIsUrl(block.data?.bgImg) ? `url(${block.data.bgImg})` : 'none'}}>
              {!checkIsUrl(block.data?.bgImg) && !checkHasText(block.data?.bgImg) && <div className="absolute inset-0 bg-gradient-to-br from-[#1e1b4b] to-[#0a0a0f]"></div>}
              {/* 🌟 Error #60 수정: 형제 요소를 명확히 분리 */}
              <FallbackText text={block.data?.bgImg} />
            </div>
            <div className="absolute inset-0 bg-black/50 backdrop-blur-[2px] z-0 pointer-events-none"></div>
            
            <div className="relative z-10 flex flex-col items-center pt-[8%] px-10 gap-4">
              <h2 className="text-white text-[1.8rem] font-black drop-shadow-lg">{block.data?.topLogo || '상단 타이틀'}</h2>

                <div className="flex items-center gap-3 w-full border-t border-white/20 pt-2">

                  <div className="w-[150px] h-[3px] bg-[#333] rounded-full overflow-hidden"><div className="w-[60%] h-full bg-[#5ea3ff]"></div></div>

                </div>

            </div>

      }

      if (block.type === 'LONG_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0 flex items-center justify-center">
            <div className="absolute inset-0 p-12 flex justify-center gap-4 z-0 bg-[#0a0a0f]">
              <div className="h-[90%] aspect-[129/181.5] bg-[#1a1c26] rounded-xl overflow-hidden relative shadow-[0_10px_30px_rgba(0,0,0,0.8)] border-[3px] border-[#7387FF] shrink-0">

              {[1, 2].map(i => (
                <div key={i} className="h-[90%] aspect-[129/181.5] bg-[#222530] rounded-xl border border-white/5 shadow-lg shrink-0 flex items-center justify-center relative overflow-hidden">
                   <ImageIcon size={48} className="text-white/5" />
                </div>
              ))}
            </div>
          </div>
        );
      }
    };
    // 🌟 [추가 1] 숫자 스마트 파싱 유틸리티 ("5만" -> "50,000")
    const parseAndFormatKoreanNumber = (str) => {
      if (!str) return '';
      let cleanStr = String(str).replace(/,/g, '').replace(/명/g, '').replace(/원/g, '').trim();
      let multiplier = 1;
      if (cleanStr.includes('만')) { multiplier = 10000; cleanStr = cleanStr.replace('만', ''); }
      else if (cleanStr.includes('천')) { multiplier = 1000; cleanStr = cleanStr.replace('천', ''); }
      const num = parseFloat(cleanStr);
      if (isNaN(num)) return str; 
      return (num * multiplier).toLocaleString();
    };
    // 🌟 [신규] 배너 이름 중복 시 자동으로 번호를 붙이는 헬퍼
    const getUniqueAssetName = (existingNames, baseName) => {
      if (!existingNames.includes(baseName)) return baseName;
      let n = 2;
      while (existingNames.includes(`${baseName} (${n})`)) n++;
      return `${baseName} (${n})`;
    };
    // ====================================================================================
    // 🌟 [최종 개편] AI 프로모션 기획 뷰 (폼 확장, 팝업 제어, 머메이드 렌더링)
    // ====================================================================================
    const AiPlannerView = ({ campaignMeta, setCampaignMeta, chatHistory, setChatHistory, assets, mermaidCode, onMoveToEditor }) => {
      const [inputValue, setInputValue] = useState('');
      const [activeFormTab, setActiveFormTab] = useState('STEP1');
      const [isLoading, setIsLoading] = useState(false);
      const [pendingAiPayload, setPendingAiPayload] = useState(null); 
      const chatEndRef = useRef(null);

      // 🌟 [수정됨] App에 있던 이미지 생성 로직을 정상적인 위치(AiPlannerView 내부)로 이동
      const [isGeneratingImg, setIsGeneratingImg] = useState(false);
      const [previewImageUrl, setPreviewImageUrl] = useState('');
      const [showPreviewModal, setShowPreviewModal] = useState(false);

      const handleTargetSizeBlur = (e) => {
        setCampaignMeta(prev => ({ ...prev, targetSize: parseAndFormatKoreanNumber(e.target.value) }));
      };

      // 🌟 [수정됨] 생성 성공 시 폼에 바로 넣지 않고 모달을 엽니다.
      const handleOpenImagePreview = () => {
        if (campaignMeta.mainImageUrl) {
          setPreviewImageUrl(campaignMeta.mainImageUrl);
          setShowPreviewModal(true);
          return;
        }
        handleGenerateImage(); // 없을 때만 신규 생성
      };
      
      const handleGenerateImage = async () => {
        if (!campaignMeta.conceptCopy) {
          alert("먼저 'Key 컨셉 & 대표 문구'를 입력해 주세요!");
          return;
        }
        setIsGeneratingImg(true);
        // 모달이 닫혀있다면 미리 열어서 로딩 스피너를 보여줍니다.
        if (!showPreviewModal) setShowPreviewModal(true); 

        try {
          // 🚨 주의: 매니저님의 프록시 주소로 확인해 주세요
          const response = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "generateImage",
              product: campaignMeta.product,
              conceptCopy: campaignMeta.conceptCopy
            })
          });
          
          const resData = await response.json();
          if (resData.status === "success" && resData.url) {
            setPreviewImageUrl(resData.url); // 미리보기 URL만 업데이트
          } else {
            alert("⚠️ 이미지 생성 실패: " + resData.message);
            setShowPreviewModal(false);
          }
        } catch (error) {
          console.error(error);
          alert("⚠️ 서버와 통신하는 중 에러가 발생했습니다.");
          setShowPreviewModal(false);
        } finally {
          setIsGeneratingImg(false);
        }
      };

      // 🌟 [신규] '이 이미지로 적용' 버튼 클릭 시
      const applyGeneratedImage = () => {
        setCampaignMeta(prev => ({ ...prev, mainImageUrl: previewImageUrl }));
        setShowPreviewModal(false);
        setPreviewImageUrl('');
      };

      // 🌟 [신규] 모달 닫기
      const cancelGeneratedImage = () => {
        setShowPreviewModal(false);
        setPreviewImageUrl('');
      };
      
      const handleMetaChange = (e) => {
        setCampaignMeta(prev => ({ ...prev, [e.target.name]: e.target.value }));
      };

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isLoading]);

      const handleSendMessage = async () => {
        if (!inputValue.trim()) return;
        const userMessage = inputValue.trim();
        setInputValue('');
        
        const newHistory = [...chatHistory, { id: `msg-${Date.now()}`, sender: 'user', text: userMessage }];
        setChatHistory(newHistory);
        setIsLoading(true);

        try {
          const proxyUrl = "https://btv-proxy.alcheminos.workers.dev";
          
          // 🌟 [정규식 제거] Function Calling 응답에는 애초에 json 코드가 섞이지 않으므로 단순화
          const cleanHistory = newHistory.map(msg => ({
            sender: msg.sender,
            text: msg.text
          }));

          let resData = null;
          let isSuccess = false;
          let lastError = "";

          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const response = await fetch(proxyUrl, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'chatWithGemini', history: cleanHistory, currentState: campaignMeta })
              });

              if (!response.ok) throw new Error("HTTP 통신 에러: " + response.status);

              const rawText = await response.text();
              if (rawText.trim().startsWith('<!DOCTYPE') || rawText.trim().startsWith('<html')) {
                throw new Error("프록시 지연으로 HTML 에러 페이지가 수신되었습니다.");
              }

              resData = JSON.parse(rawText);
              if (resData.status !== 'success') throw new Error(resData.message || "서버 로직 에러");
              
              isSuccess = true;
              break;
            } catch (err) {
              lastError = err.message;
              console.warn(`[통신 튐 방어] ${attempt}차 시도 실패, 1.5초 후 재시도합니다...`, lastError);
              if (attempt < 3) await new Promise(r => setTimeout(r, 1500));
            }
          }

          if (!isSuccess) throw new Error("서버 혼잡이 심합니다. 잠시 후 다시 시도해주세요. (" + lastError + ")");

          // 🌟 기존 정규식 파싱(mermaidMatch, firstBrace/lastBrace, matchJsonStr) 블록 전체 삭제 후 아래로 교체

          let displayAiText = (resData.text || "").trim();
          
          if (resData.action === "UPDATE_STATE" && resData.rawGasData) {
            setCampaignMeta(prev => ({ ...prev, ...resData.rawGasData }));
          }
          else if (resData.action === "CREATE_CAMPAIGN_ASSETS" && resData.rawGasData) {
            const metaData = resData.rawGasData.meta || {};
            const generatedAssets = resData.rawGasData.assets || [];
          
            if (generatedAssets.length === 0) {
              displayAiText = "🚨 앗, 배너 시안 데이터를 생성하는 중에 문제가 발생했어요. (서버 스키마 에러 의심)\n번거로우시겠지만 '다시 생성해줘'라고 한 번 더 말씀해 주시겠어요?";
            } else {
              if (Array.isArray(metaData.bannerTypes)) metaData.bannerTypes = metaData.bannerTypes.join(', ');
              if (Array.isArray(metaData.gnbLocations)) metaData.gnbLocations = metaData.gnbLocations.join(', ');
              // 🌟 [신규] 실제 배너별 GNB 매핑을 assets에서 직접 추출해 bannerPlan을 더 정확한 값으로 덮어씀
              metaData.bannerPlan = generatedAssets.map(a => ({
                name: a.name || a.type,
                gnb: Array.isArray(a.data?.gnb) ? a.data.gnb.join(', ') : (a.data?.gnb || '')
              }));
              setCampaignMeta(prev => ({ ...prev, ...metaData }));
          
              setPendingAiPayload({
                action: "CREATE_CAMPAIGN_ASSETS",
                mermaidCode: resData.mermaidCode || "",
                rawGasData: resData.rawGasData
              });
          
              if (!displayAiText) {
                displayAiText = "매니저님, 우측 **'비주얼 유저플로우 시뮬레이터'**에 플로우차트가 렌더링되었습니다! 확인해 보시고, 하단의 **[완성된 기획안으로 시안 편집 이동 〉]** 버튼을 눌러주세요.";
              }
            }
          }
          
          // 🌟 UPDATE_STATE인데 텍스트가 비어있는 경우 최소한의 이어가기 문구 (대화 끊김 방지)
          if (!displayAiText) {
            displayAiText = resData.action === "UPDATE_STATE" 
              ? "네, 반영했습니다. 다음으로 어떤 정보를 알려주시겠어요?" 
              : "우측 기획 정보가 업데이트되었습니다!";
          }
          
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: displayAiText }]);

        } catch (error) {
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: "🚨 통신 에러 발생: " + error.message }]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } };

      // 🌟 [방어 로직 추가] GAS에서 보내는 데이터 위치가 꼬일 때를 대비해 다중 체크
      const displayMermaid = pendingAiPayload?.mermaidCode 
                          || pendingAiPayload?.rawGasData?.mermaidCode 
                          || campaignMeta?.mermaidCode 
                          || mermaidCode;

      return (
        <div className="flex h-full w-full bg-[#06070a] overflow-hidden p-6 gap-6">
          {/* 1단: 좌측 챗봇 (33%) */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[320px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between">
              <div className="flex items-center gap-3">

                  {msg.sender === 'user' ? (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#4f3df6] text-white rounded-br-none shadow-[0_4px_15px_rgba(79,61,246,0.3)] whitespace-pre-wrap">
                      {msg.text}
                    </div>
                  ) : (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#1a1c26] text-slate-200 border border-[#303340] rounded-bl-none shadow-md ai-chat-body" dangerouslySetInnerHTML={{ __html: typeof window.marked !== 'undefined' ? window.marked.parse(msg.text) : msg.text }} />
                  )}
                </div>
              ))}
              {isLoading && (
                <div className="flex justify-start items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-[#262833] flex items-center justify-center shrink-0"><Bot size={14} className="text-slate-300" /></div>
                  <div className="bg-[#1a1c26] border border-[#303340] rounded-2xl rounded-bl-none px-4 py-3 flex items-center gap-2">
                    <Loader2 size={14} className="text-[#7387ff] animate-spin" />
                    <span className="text-xs text-slate-400 font-medium">폼 동기화 중...</span>

              <div ref={chatEndRef} />

            <div className="p-3 bg-[#12141c] border-t border-[#262833]">
              <div className="relative flex items-end bg-[#0a0812] border border-[#303340] rounded-xl overflow-hidden focus-within:border-[#4f3df6] transition-colors">
                <textarea value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyDown={handleKeyDown} placeholder="프로모션 목적이나 타겟을 편하게 말씀해 주세요." className="flex-1 max-h-[120px] min-h-[48px] bg-transparent text-white placeholder-slate-500 px-4 py-3 outline-none resize-none custom-scrollbar text-xs" rows={1} />
                <button onClick={handleSendMessage} disabled={!inputValue.trim() || isLoading} className="mb-1.5 mr-1.5 p-2 rounded-lg bg-[#4f3df6] text-white hover:bg-[#6252ff] disabled:bg-[#262833] disabled:text-slate-500 transition-colors shrink-0"><Send size={16} /></button>
              </div>
            </div>
          </div>

          {/* 🌟 2단: 중앙 기획 폼 (매니저님 요청 완벽 반영) */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[350px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between shrink-0">
              <h3 className="text-white font-bold text-[15px] tracking-tight flex items-center gap-2"><Settings size={16} className="text-pink-400" /> 캠페인 기획 폼</h3>
              <span className="text-[9px] text-slate-400 bg-[#1a1c26] px-2 py-0.5 rounded border border-[#303340] animate-pulse">AI 실시간 동기화</span>
            </div>
            
            <div className="flex-1 overflow-y-auto custom-scrollbar p-6 bg-[#06070a]">
              
              {/* === SECTION 1 === */}
              <div className="mb-8">

                {/* 1줄: 캠페인명 + 대상 상품 (2칸) */}

                  <div>

                {/* 3줄: 컨셉 + 키비주얼 (2칸, 높이 동기화) */}
                <div className="grid grid-cols-2 gap-4">

                  </div>
                  <div className="flex flex-col">
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 ml-1">메인 키비주얼 URL</label>
                    <div className="flex flex-col gap-2 h-full">
                      <input type="text" name="mainImageUrl" placeholder="https://..." value={campaignMeta.mainImageUrl || ''} onChange={(e) => setCampaignMeta({...campaignMeta, mainImageUrl: e.target.value})} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none" />
                      <button type="button" onClick={handleOpenImagePreview} disabled={isGeneratingImg} className="bg-[#4f3df6] hover:bg-[#3b2bc7] text-white flex-1 rounded-lg text-xs font-bold w-full transition-colors h-full min-h-[38px]">

                {/* 1줄: 타겟 모수 + 배너/GNB (2칸) */}
                <div className="grid grid-cols-2 gap-4 mb-4">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 ml-1">타겟 모수 (TARGET 전용)</label>
                    <input type="text" name="targetSize" value={campaignMeta.targetSize || ''} onChange={handleMetaChange} onBlur={handleTargetSizeBlur} disabled={campaignMeta.target !== 'TARGET'} placeholder="입력 후 폼 밖을 누르면 자동 변환" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-pink-500 outline-none disabled:opacity-30" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 ml-1">제작 배너 · 편성 GNB</label>
                    <div className="w-full bg-[#1a1c26] border border-[#303340] rounded-lg px-3 py-2 min-h-[38px] max-h-[104px] overflow-y-auto custom-scrollbar flex flex-col gap-1.5">
                      {Array.isArray(campaignMeta.bannerPlan) && campaignMeta.bannerPlan.length > 0 ? (
                        campaignMeta.bannerPlan.map((b, i) => (
                          <div key={i} className="flex items-center gap-2 flex-wrap">
                            <span className="text-[11px] font-bold text-slate-200 shrink-0">{b.name}</span>
                            <span className="text-slate-600 text-[10px]">→</span>
                            {(b.gnb || '').split(',').map(g => g.trim()).filter(Boolean).map((g, gi) => (
                              <span key={gi} className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#4f3df6]/15 text-[#7387ff] border border-[#4f3df6]/30">{g}</span>
                            ))}
                          </div>
                        ))
                      ) : (campaignMeta.bannerTypes || campaignMeta.gnbLocations) ? (
                        <div className="text-[10px] text-slate-500">
                          <div className="mb-0.5 text-slate-600">(구버전 캠페인 — 배너별 매핑 정보 없음)</div>
                          {campaignMeta.bannerTypes && <div>배너: {campaignMeta.bannerTypes}</div>}
                          {campaignMeta.gnbLocations && <div>GNB: {campaignMeta.gnbLocations}</div>}
                        </div>
                      ) : (
                        <span className="text-[10px] text-slate-500">아직 배너 구성이 정해지지 않았어요</span>
                      )}
                    </div>
                  </div>
                </div>

                {/* 2줄: 쿠폰 + 혜택명 + 외부 사은품 (3칸) */}
                <div className="grid grid-cols-3 gap-4 mb-5">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 ml-1">B tv 쿠폰 발급</label>
                    <select name="hasCoupon" value={campaignMeta.hasCoupon || ''} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none">
                      <option value="N">미포함</option><option value="Y">포함</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 ml-1">쿠폰 혜택 명</label>
                    <input type="text" name="couponBenefit" value={campaignMeta.couponBenefit || ''} onChange={handleMetaChange} disabled={campaignMeta.hasCoupon === 'N'} placeholder="예: 2,000원 할인" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none disabled:opacity-30" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 ml-1">외부 사은품 (기프티콘 등)</label>
                    <input type="text" name="externalGift" value={campaignMeta.externalGift || ''} onChange={handleMetaChange} placeholder="예: 스타벅스 추첨" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none" />
                  </div>
                </div>
                
                {(() => {
                  // 🌟 [신규] 레이아웃/타이포는 고정, 색상만 상태별로 교체
                  let statusColor, StatusIcon, statusText, isSpinning = false;
                  if (campaignMeta.target !== 'TARGET') {
                    statusColor = 'slate'; StatusIcon = CheckCircle; statusText = 'MASS 캠페인 모드';
                  } else if (campaignMeta.isCapaChecked) {
                    statusColor = 'emerald'; StatusIcon = CheckCircle; statusText = 'Capa 검증 통과 완료';
                  } else {
                    statusColor = 'pink'; StatusIcon = Loader2; statusText = 'Capa 검증 대기 중...'; isSpinning = true;
                  }
                  const colorMap = {
                    slate:   { bg: 'bg-[#1a1c26]', border: 'border-[#303340]', text: 'text-slate-400' },
                    pink:    { bg: 'bg-pink-500/10', border: 'border-pink-500/30', text: 'text-pink-400' },
                    emerald: { bg: 'bg-[#32d782]/10', border: 'border-[#32d782]/30', text: 'text-[#32d782]' },
                  };
                  const c = colorMap[statusColor];
                  const subText = campaignMeta.target !== 'TARGET'
                    ? '전체 고객 대상이므로 타겟 Capa 검증이 생략됩니다.'
                    : '* AI가 타겟 모수와 일정을 확인하여 자동으로 승인합니다.';
                
                  return (
                    <div className={`p-4 rounded-xl border transition-colors ${c.bg} ${c.border} pointer-events-none select-none flex flex-col items-center justify-center gap-2`}>
                      <div className={`flex items-center gap-2 font-bold text-[14px] ${c.text}`}>
                        <StatusIcon size={18} className={isSpinning ? 'animate-spin' : ''} />
                        {statusText}
                      </div>
                      <span className="text-[10px] text-slate-500">{subText}</span>
                    </div>
                  );
                })()}
              </div>

              {/* 이미지 팝업 모달 */}
              {showPreviewModal && (
                <div className="fixed inset-0 bg-[#0a0812]/90 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-in fade-in zoom-in-95 duration-200">
                  <div className="bg-[#12141c] border border-[#262833] rounded-2xl shadow-2xl flex flex-col overflow-hidden max-w-xl w-full ring-1 ring-[#4f3df6]/30">
                    <div className="p-5 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                      <h3 className="text-base font-black text-white flex items-center gap-2"><ImageIcon size={18} className="text-[#4f3df6]"/> AI 이미지 미리보기</h3>
                      <button onClick={cancelGeneratedImage} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={16}/></button>
                    </div>
                    <div className="p-6 bg-[#0a0812] flex flex-col items-center">
                      {isGeneratingImg ? (
                        <div className="w-full aspect-[16/9] flex flex-col items-center justify-center bg-[#1a1c26] rounded-xl border border-[#303340] gap-3 shadow-inner">
                          <Loader2 size={32} className="text-[#4f3df6] animate-spin" />
                          <p className="text-slate-400 text-sm font-bold animate-pulse">새로운 이미지를 생성 중입니다...</p>
                        </div>
                      ) : (
                        <img src={previewImageUrl} alt="Generated Preview" className="w-full aspect-[16/9] object-cover rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] border border-[#303340]" />
                      )}
                    </div>
                    <div className="p-4 border-t border-[#262833] bg-[#0f111a] flex justify-end gap-3">
                      <button onClick={handleGenerateImage} disabled={isGeneratingImg} className="px-5 py-2.5 bg-[#262833] hover:bg-[#303340] text-slate-200 hover:text-white rounded-lg text-sm font-bold transition-all flex items-center gap-2 border border-[#303340] disabled:opacity-50">
                        <RefreshCw size={14} className={isGeneratingImg ? "animate-spin" : ""} /> 다시 생성
                      </button>
                      <button onClick={applyGeneratedImage} disabled={isGeneratingImg || !previewImageUrl} className="px-6 py-2.5 bg-[#4f3df6] hover:bg-[#6252ff] text-white rounded-lg text-sm font-bold transition-all shadow-lg disabled:opacity-50">
                        이 이미지로 적용
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
          
          {/* 3단: 우측 머메이드 시뮬레이터 (33%) 및 🌟 전송 버튼 위치 */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[320px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between">
              <h3 className="text-white font-bold text-[15px] tracking-tight flex items-center gap-2"><LayoutTemplate size={16} className="text-cyan-400" /> 비주얼 유저플로우 시뮬레이터</h3>
            </div>
            <div className="flex-1 overflow-hidden custom-scrollbar bg-[#0a0812] relative">
              {displayMermaid ? (
                <MermaidViewer code={displayMermaid} />
              ) : (
                <div className="flex flex-col items-center justify-center text-slate-500 opacity-50 absolute inset-0">
                  <LayoutTemplate size={32} className="mb-3" />
                  <p className="text-xs font-bold text-center">AI와 대화를 통해 기획안이 확정되면<br/>이곳에 유저플로우가 그려집니다.</p>
                </div>
              )}
            </div>

            {/* 🌟 3단 화면 맨 아래 고정된 이동 버튼 */}
            <div className="p-5 bg-[#12141c] border-t border-[#262833]">
              <button
                onClick={() => {
                  if (!campaignMeta.campaignName || !campaignMeta.product || !campaignMeta.startDate || !campaignMeta.dueDate || !campaignMeta.conceptCopy) {
                    alert("⚠️ 필수 기획 정보(캠페인명, 대상 상품, 시작/종료일, Key 컨셉)가 모두 입력되어야 다음 단계로 이동할 수 있습니다.");
                    return;
                  }
                  if (campaignMeta.target === 'TARGET' && (!campaignMeta.targetSize || !campaignMeta.isCapaChecked)) {
                    alert("⚠️ TARGET 프로모션은 '타겟 모수' 입력 및 'Capa 검증' 완료가 필수입니다.");
                    return;
                  }
                  if (pendingAiPayload) onMoveToEditor(pendingAiPayload, () => setPendingAiPayload(null));
                }}
                disabled={!pendingAiPayload}
                className={`w-full py-4 rounded-lg font-bold text-white transition-all shadow-md ${
                  pendingAiPayload
                    ? "bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 cursor-pointer"
                    : "bg-[#262833] text-slate-500 cursor-not-allowed border border-[#303340] shadow-none"
                }`}
              >
                {pendingAiPayload ? "완성된 기획안으로 시안 편집 이동 〉" : "⚠️ 시안(에셋) 데이터가 생성되어야 이동 가능합니다"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ====================================================================================
    // 🌟 [신규 추가] 프로모션 관리(과거 캠페인 목록 조회/불러오기) 뷰
    // ====================================================================================
    const PromotionListView = ({ onLoadCampaign, onDuplicateCampaign }) => {
      const [campaigns, setCampaigns] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);

      const fetchCampaigns = async () => {
        setIsLoading(true);
        setError(null);
        try {
          const response = await fetch("https://btv-proxy.alcheminos.workers.dev?action=getCampaigns");
          if (!response.ok) throw new Error("서버와 통신할 수 없습니다.");
          const data = await response.json();
          
          // 🌟 [블랙아웃 방어 로직] 데이터가 배열이 아니거나 서버 에러 객체일 경우 화면 크래시를 방지합니다.
          if (data && data.status === 'error') {
            throw new Error(data.message || "서버에서 데이터를 불러오지 못했습니다.");
          }
          if (!Array.isArray(data)) {
            throw new Error("서버에서 올바른 목록 형식을 받지 못했습니다.");
          }
          
          setCampaigns(data);
        } catch (err) { 
          console.error("캠페인 로드 실패", err); 
          setError(err.message || "목록을 불러오는 중 문제가 발생했습니다."); 
          setCampaigns([]); // 🌟 빈 배열을 강제 할당하여 map() 함수 크래시 영구 차단
        } finally { 
          setIsLoading(false); 
        }
      };

      useEffect(() => {
        fetchCampaigns();
      }, []);

      const handleLoad = (item) => {
        const meta = item.meta || {
          campaignName: item.campaignName, target: item.target, targetSize: item.targetSize,
          startDate: item.startDate, dueDate: item.dueDate, hasCoupon: item.hasCoupon, 
          couponBenefit: item.couponBenefit, externalGift: item.externalGift || '', conceptCopy: item.conceptCopy, mainImageUrl: item.mainImageUrl,
          product: item.product, bannerTypes: item.bannerTypes, gnbLocations: item.gnbLocations
        };
        // 🌟 [신규] "수정" 시엔 기존 Jira 부모 키를 반드시 함께 넘겨야 background.js가 업데이트로 인식함
        //    jiraKey가 풀 URL(https://.../browse/KEY)로 저장돼 있을 수 있어 마지막 경로 조각만 추출
        meta.parentJiraKey = item.jiraKey ? String(item.jiraKey).split('/').pop() : '';
        onLoadCampaign(meta, item.assets || [], item.mermaidCode || "");
      };

      const handleDuplicate = (item) => {
        const meta = item.meta || {
          campaignName: `${item.campaignName} (복제본)`, target: item.target, targetSize: item.targetSize,
          startDate: item.startDate, dueDate: item.dueDate, hasCoupon: item.hasCoupon, couponBenefit: item.couponBenefit,
          externalGift: item.externalGift || '', conceptCopy: item.conceptCopy, mainImageUrl: item.mainImageUrl, // 🌟 externalGift 추가
          product: item.product, bannerTypes: item.bannerTypes, gnbLocations: item.gnbLocations
        };
        const duplicatedAssets = (item.assets || []).map((a, idx) => ({ ...a, id: `asset-dup-${Date.now()}-${idx}` }));
        onDuplicateCampaign(meta, duplicatedAssets, item.mermaidCode || "");
      };

      // 🌟 [추가됨] 오늘 날짜 기준 과거 캠페인 여부 판별 함수
      const isPastCampaign = (startDateStr) => {
        if (!startDateStr) return false;
        const todayStr = new Date(new Date().getTime() - (new Date().getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        return startDateStr < todayStr;
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#06070a] overflow-hidden p-6 gap-5">
          <div className="flex items-center justify-between shrink-0">
            <div>
              <h2 className="text-white font-black text-xl tracking-tight flex items-center gap-2"><FolderOpen size={22} className="text-[#7387ff]" /> 프로모션 관리</h2>
              <p className="text-slate-500 text-xs font-medium mt-1">과거에 만든 캠페인을 확인하고 불러와 수정할 수 있습니다.</p>
            </div>
            <button onClick={fetchCampaigns} disabled={isLoading} className="flex items-center gap-1.5 px-4 py-2 bg-[#1a1c26] text-slate-300 rounded-lg text-xs font-bold border border-[#303340] hover:bg-[#262833] hover:text-white transition-colors disabled:opacity-50">
              <RefreshCw size={14} className={isLoading ? 'animate-spin' : ''} /> 새로고침
            </button>
          </div>

          <div className="flex-1 min-h-0 bg-[#0f111a] border border-[#262833] rounded-2xl overflow-hidden flex flex-col shadow-xl">
            {isLoading ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-3 text-slate-500">
                <Loader2 size={28} className="animate-spin text-[#7387ff]" />
                <span className="text-sm font-medium">캠페인 목록을 불러오는 중...</span>
              </div>
            ) : error ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-3 text-slate-500 px-8 text-center">
                <Inbox size={32} className="text-slate-700" />
                <span className="text-sm font-medium text-red-400/80">{error}</span>
                <button onClick={fetchCampaigns} className="mt-2 px-4 py-1.5 bg-[#1a1c26] border border-[#303340] rounded-lg text-xs text-slate-300 hover:text-white transition-colors">다시 시도</button>
              </div>
            ) : campaigns.length === 0 ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-2 text-slate-500">
                <Inbox size={32} className="text-slate-700" />
                <span className="text-sm font-medium">등록된 캠페인이 없습니다.</span>
              </div>
            ) : (
              <div className="flex-1 overflow-y-auto custom-scrollbar divide-y divide-[#1a1c26]">
                {campaigns.map((item) => {
                  // 숫자만 추출하여 콤마(,) 포맷팅
                  const safeTargetStr = item.targetSize ? String(item.targetSize).replace(/[^0-9]/g, '') : '';
                  const displayTargetSize = safeTargetStr ? parseInt(safeTargetStr).toLocaleString() : 0;
                  
                  // 포함된 배너 텍스트 추출
                  let bannerTypesText = "등록된 배너 없음";
                  if (item.meta && item.meta.bannerTypes) {
                    bannerTypesText = item.meta.bannerTypes;
                  } else if (item.assets && item.assets.length > 0) {
                    bannerTypesText = item.assets.map(a => a.name || a.type).join(', ');
                  }

                  // 🌟 [추가됨] 시작일이 오늘보다 과거인지 체크
                  const isPast = isPastCampaign(item.startDate);
    
                  return (
                    // 🌟 [수정 1] 카드 전체 오버레이(hover) 효과를 지워 혼선 완벽 제거
                    <div key={item.id} className="bg-[#12141c] border border-[#262833] rounded-xl p-4 transition-all">
                      
                      <div className="flex items-center w-full">
                        
                        {/* 1열: 기본 캠페인 정보 (w-[33%]로 축소) */}
                        <div className="w-[33%] min-w-[240px] shrink-0 pr-4">
                          <div className="flex items-center gap-2 mb-1.5">
                            <h4 className="text-white font-bold text-[14px] truncate" title={item.campaignName}>{item.campaignName}</h4>
                            {item.target === 'TARGET' && (
                              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30 flex items-center gap-1 shrink-0 whitespace-nowrap">
                                TARGET {displayTargetSize !== 0 && <span className="text-orange-300">({displayTargetSize}명)</span>}
                              </span>
                            )}
                            {item.status === '확정 완료' && (
                              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 shrink-0 whitespace-nowrap">확정 완료</span>
                            )}
                          </div>
                          <div className="text-[11px] text-slate-400 flex items-center gap-2">
                            <span>{item.startDate} ~ {item.dueDate}</span>
                            <span>•</span>
                            <span>수정 {item.updatedAt}</span>
                          </div>
                        </div>
    
                        {/* 2열: 포함 배너 리스트 */}
                        <div className="flex-1 px-5 text-left hidden md:block border-l border-[#262833] min-w-0 overflow-hidden">
                          <p className="text-[10px] text-slate-500 mb-0.5 font-bold">포함된 배너 에셋</p>
                          <p className="text-[12px] text-slate-300 font-medium truncate w-full" title={bannerTypesText}>
                            {bannerTypesText}
                          </p>
                        </div>
    
                        {/* 3열: 액션 버튼들 (w-[250px] 확보 및 버튼 내 텍스트 줄바꿈 금지) */}
                        <div className="w-[250px] shrink-0 pl-4 border-l border-[#262833] flex items-center justify-end gap-1.5">
                          
                          {/* 🌟 [수정 2] Jira 주소가 이미 http로 시작하면 중복 부착 방지 */}
                          {item.jiraKey && item.jiraKey !== "-" && (
                            <button 
                              onClick={() => {
                                const url = item.jiraKey.startsWith('http') ? item.jiraKey : `https://jira.skbroadband.com/browse/${item.jiraKey}`;
                                window.open(url, '_blank');
                              }} 
                              className="px-3 py-1.5 bg-[#262833] text-slate-300 rounded text-xs font-medium hover:bg-[#303340] hover:text-white transition-colors flex items-center gap-1.5 whitespace-nowrap">
                              <ExternalLink size={12} /> Jira
                            </button>
                          )}
                          
                          <button onClick={() => handleDuplicate(item)} className="px-3 py-1.5 bg-[#d946ef]/10 text-[#e879f9] border border-[#d946ef]/30 rounded text-xs font-bold hover:bg-[#d946ef]/20 transition-colors flex items-center gap-1.5 whitespace-nowrap">
                            <Copy size={12} /> 복제
                          </button>
                          
                          {!isPast && (
                            <button onClick={() => handleLoad(item)} className="px-3 py-1.5 bg-[#4f3df6]/10 text-[#7387ff] border border-[#4f3df6]/30 rounded text-xs font-bold hover:bg-[#4f3df6]/20 transition-colors flex items-center gap-1 whitespace-nowrap">
                              수정 <ChevronRight size={12} />
                            </button>
                          )}
                        </div>
    
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    };
    
    function App() {
      const [currentView, setCurrentView] = useState('PLANNER');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [isNavExpanded, setIsNavExpanded] = useState(false); 
      const [extensionVersion, setExtensionVersion] = useState(null);
      const [githubVersion, setGithubVersion] = useState(null);
      const [jiraSession, setJiraSession] = useState('CHECKING');
      
      // 🌟 [신규] 언제든 수동으로 호출할 수 있는 Jira 세션 체크 함수
      const checkJiraSessionNow = () => {
        setJiraSession('CHECKING');
        const extNode = document.getElementById('btv-campaign-extension-installed');
        if (extNode) {
          setExtensionVersion(extNode.getAttribute('data-version') || '1.0.0');
          
          const sessionListener = (e) => {
            setJiraSession(e.detail?.isLogged ? 'LOGGED_IN' : 'LOGGED_OUT');
            window.removeEventListener('RECEIVE_JIRA_SESSION', sessionListener);
          };
          window.addEventListener('RECEIVE_JIRA_SESSION', sessionListener);
          window.dispatchEvent(new CustomEvent('REQUEST_JIRA_SESSION'));
        } else {
          setJiraSession('LOGGED_OUT');
        }
      };

      useEffect(() => {
        // 1. GitHub 최신 버전 체크
        fetch('https://raw.githubusercontent.com/btvcuration/campaign/main/Tool/manifest.json')
          .then(res => res.json())
          .then(data => setGithubVersion(data.version))
          .catch(e => console.error("버전 체크 실패", e));

        // 2. 초기 로드 시 Jira 세션 체크 실행
        checkJiraSessionNow();
        setTimeout(checkJiraSessionNow, 1000);
      }, []);

      // 🌟 찌꺼기 삭제 완료! 바로 날짜 선언으로 넘어갑니다.
      const today = new Date();
      const todayStr = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
      
      // EDITOR 전용 상태
      const [campaignMeta, setCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', externalGift: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false
      });

      const [assets, setAssets] = useState([]); 
      const [mermaidCode, setMermaidCode] = useState(''); // 🌟 App 레벨에 머메이드 저장소 추가
      const AUTOSAVE_KEY = 'btv_campaign_autosave_v1';
      
      // AI 기획 폼 전용 상태
      const [aiCampaignMeta, setAiCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', externalGift: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false
      });
      const [aiChatHistory, setAiChatHistory] = useState([
        { id: 'msg-init', sender: 'ai', text: '매니저님, 환영합니다.\n어떤 프로모션을 기획하실 예정인가요? 우측 폼에 아시는 만큼 먼저 적어주셔도 좋고, 저와 대화하며 하나씩 채워가도 좋습니다!' }
      ]);

      const [exportState, setExportState] = useState({ isExporting: false, progress: 0, msg: '' });
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [openAccordions, setOpenAccordions] = useState({ campaign: true, banner: true });

      const handleSettingsClick = () => setIsSettingsOpen(true);
      const handleConfigChange = (gnbName, field, value) => setConfigMap(prev => ({ ...prev, [gnbName]: { ...prev[gnbName], [field]: value } }));
      const handleSaveConfig = async () => { setIsSettingsOpen(false); };

      const handleMoveToEditor = (payload, onInvalid) => {
        setCampaignMeta({ ...aiCampaignMeta });
        if (!payload || payload.action !== "CREATE_CAMPAIGN_ASSETS") {
          setCurrentView('EDITOR'); return;
        }
        const aiMeta = payload.rawGasData?.meta || {};
        const aiAssets = payload.rawGasData?.assets || [];
        const aiMermaid = payload.mermaidCode || payload.rawGasData?.mermaidCode || "";
      
        if (aiAssets.length === 0 && !aiMermaid) {
          alert("🚨 AI가 최종 시안 데이터를 정상적으로 렌더링하지 못했습니다. (서버 응답 오류)\n수동으로 배너를 추가하거나, AI에게 다시 시안 생성을 요청해 주세요.");
          if (onInvalid) onInvalid(); // 🌟 부모가 대신 리셋해줌
          return;
        }
        
        if (assets.length > 0) {
          const confirmOverwrite = window.confirm("⚠️ 이미 시안 편집 화면에 작업 중인 배너가 존재합니다.\n새로운 AI 기획안으로 덮어씌우시겠습니까?");
          if (!confirmOverwrite) { setCurrentView('EDITOR'); return; }
        }

        if (aiMermaid) setMermaidCode(aiMermaid);
        if (aiMeta) {
          if (!aiMeta.conceptCopy && (aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept)) {
             aiMeta.conceptCopy = aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept;
          }
          if (Array.isArray(aiMeta.bannerTypes)) aiMeta.bannerTypes = aiMeta.bannerTypes.join(', ');
          if (Array.isArray(aiMeta.gnbLocations)) aiMeta.gnbLocations = aiMeta.gnbLocations.join(', ');
          setCampaignMeta(prev => ({ ...prev, ...aiMeta }));
        }

        if (aiAssets && Array.isArray(aiAssets)) {
          if (aiAssets.length === 0) {
            setAssets([]); setActiveTabId(null);
          } else {
            const timestamp = Date.now();
            const usedNames = []; // 🌟 추가
            const newAssets = aiAssets.map((aiAsset, index) => {
              let baseData = {};
              if (aiAsset.type === 'TODAY_BTV') baseData = { ...DEFAULT_TODAY_BTV };
              else if (aiAsset.type === 'GENERAL_BANNER') baseData = { ...DEFAULT_GENERAL_BANNER };
              else if (aiAsset.type === 'GENERAL_SET_BANNER') baseData = { ...DEFAULT_GENERAL_SET_BANNER };
              else if (aiAsset.type === 'FULL_PROMO_BANNER') baseData = { ...DEFAULT_FULL_PROMO_BANNER };
              else if (aiAsset.type === 'BIG_BANNER') baseData = { ...DEFAULT_BIG_BANNER };
              else if (aiAsset.type === 'LONG_BANNER') baseData = { ...DEFAULT_LONG_BANNER };
              else if (aiAsset.type === 'STRIP_BANNER') baseData = { ...DEFAULT_STRIP_BANNER };
              else if (aiAsset.type === 'SYNOPSIS_BANNER') baseData = { ...DEFAULT_SYNOPSIS_BANNER };
              else if (aiAsset.type === 'PROMO_POPUP') baseData = { ...DEFAULT_PROMO_POPUP };
              else if (aiAsset.type === 'MINI_EPG_BANNER') baseData = { ...DEFAULT_MINI_EPG_BANNER };

              let aiData = aiAsset.data || {};
              if (aiAsset.type === 'TODAY_BTV') { if (aiData.subTitle && !aiData.subText) aiData.subText = aiData.subTitle; } 
              else if (aiAsset.type === 'GENERAL_BANNER') {
                if (aiData.subTitle && !aiData.previewSub) aiData.previewSub = aiData.subTitle;
                if (aiData.mainTitle && !aiData.previewTitle) aiData.previewTitle = aiData.mainTitle;
                if (aiData.mainTitle && !aiData.bannerCopy) aiData.bannerCopy = aiData.mainTitle;
              }
              else if (aiAsset.type === 'FULL_PROMO_BANNER') {
                if (aiData.mainTitle && !aiData.mainCopy) aiData.mainCopy = aiData.mainTitle;
                if (aiData.subTitle && !aiData.subCopy) aiData.subCopy = aiData.subTitle;
              }

              let rawGnb = aiData.gnb || baseData.gnb;
              let gnbArray = Array.isArray(rawGnb) ? rawGnb : [rawGnb];
              let cleanedGnb = gnbArray.filter(g => typeof g === 'string' && g.trim() !== '').map(g => {
                  if (g.includes('영화') && g.includes('시리즈')) return '영화시리즈';
                  if (g.includes('TV') && g.includes('방송')) return 'TV 방송';
                  if (g === 'OTT 홈' || g === 'OTT') return 'OTT홈';
                  return g;
                });
              if (cleanedGnb.length === 0) cleanedGnb = ['홈'];  
              
              const rawName = aiAsset.name || `${aiAsset.type.replace('_', ' ')} (AI)`;
              const finalName = getUniqueAssetName(usedNames, rawName);
              usedNames.push(finalName);

              return { id: `ai-asset-${index}-${timestamp}`, type: aiAsset.type, name: finalName, data: { ...baseData, ...aiData, gnb: cleanedGnb, startDate: aiMeta?.startDate || baseData.startDate, dueDate: aiMeta?.dueDate || baseData.dueDate } }; // 🌟 name: finalName 으로 교체
            });
            setAssets(newAssets); setActiveTabId(newAssets[0].id); 
            // 🌟 원본 기록 저장
            setCampaignMeta(prev => ({ ...prev, aiOriginalAssets: newAssets.map(a => ({ id: a.id, name: a.name })) }));
          }
        }
        setCurrentView('EDITOR');
      };

      const [activeTabId, setActiveTabId] = useState('asset-1');      
      const [isAddAssetModalOpen, setIsAddAssetModalOpen] = useState(false);
      const [localShowSafeZone, setLocalShowSafeZone] = useState(false);
      const [configMap, setConfigMap] = useState({});
      // 🌟 [신규] 최초 마운트 시 1회: 임시저장된 작업이 있으면 복구 여부 확인
      useEffect(() => {
        try {
          const saved = localStorage.getItem(AUTOSAVE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.assets?.length > 0) {
              const ago = Math.round((Date.now() - parsed.savedAt) / 60000);
              const restore = window.confirm(
                `⏱️ ${ago}분 전 작업 중이던 임시저장 데이터가 있습니다.\n(${parsed.campaignMeta?.campaignName || '제목 없음'})\n불러올까요?`
              );
              if (restore) {
                setCampaignMeta(parsed.campaignMeta || {});
                setAssets(parsed.assets || []);
                setMermaidCode(parsed.mermaidCode || '');
                setActiveTabId(parsed.assets[0]?.id || null);
                setCurrentView('EDITOR');
              } else {
                localStorage.removeItem(AUTOSAVE_KEY);
              }
            }
          }
        } catch (e) { console.error("자동저장 복구 실패", e); }
      }, []);
      
      // 🌟 [신규] 편집 중 변경사항을 디바운스로 자동저장 (EDITOR 뷰에서만)
      useEffect(() => {
        if (currentView !== 'EDITOR' || assets.length === 0) return;
        const timer = setTimeout(() => {
          try {
            localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ campaignMeta, assets, mermaidCode, savedAt: Date.now() }));
          } catch (e) { console.error("자동저장 실패", e); }
        }, 1500);
        return () => clearTimeout(timer);
      }, [campaignMeta, assets, mermaidCode, currentView]);

      
      useEffect(() => {
        const fetchConfig = async () => {
          try {
            const proxyUrl = "https://btv-proxy.alcheminos.workers.dev?action=getConfig";
            const response = await fetch(proxyUrl, { method: 'GET', headers: { 'Content-Type': 'application/json' } });
            if (!response.ok) throw new Error("네트워크 응답이 올바르지 않습니다.");
            const configData = await response.json();
            setConfigMap(configData);
          } catch (error) {
            console.error("Config 로드 실패:", error);
            setConfigMap({ "영화시리즈": { "name": "담당자 미지정", "jiraId": "system_auto" }, "TV 방송": { "name": "담당자 미지정", "jiraId": "system_auto" } });
          }
        };
        fetchConfig();
      }, []);

      const handleMetaChange = (e) => setCampaignMeta({ ...campaignMeta, [e.target.name]: e.target.value });
      
      const handleAssetChange = (id, field, value) => {
        setAssets(prevAssets => prevAssets.map(asset => asset.id === id ? { ...asset, data: { ...asset.data, [field]: value } } : asset));
      };
      
      const handleCardChange = (id, cardIndex, field, value) => {
        setAssets(prevAssets => prevAssets.map(asset => {
          if (asset.id !== id) return asset;
          const newCards = [...(asset.data.cards || [])];
          newCards[cardIndex] = { ...newCards[cardIndex], [field]: value };
          return { ...asset, data: { ...asset.data, cards: newCards } };
        }));
      };

      const handleAddMemo = () => {
        const currentMemos = activeAsset.data?.memos || [];
        const offset = currentMemos.length * 20; 
        const newMemo = { id: `memo-${Date.now()}`, text: '', x: 50 + offset, y: 50 + offset };
        handleAssetChange(activeAsset.id, 'memos', [...currentMemos, newMemo]);
      };

      const addAsset = (type, name) => {
        const newId = `asset-${Date.now()}`;
        const uniqueName = getUniqueAssetName(assets.map(a => a.name), name); // 🌟 추가
        let newData = {};
        if (type === 'TODAY_BTV') newData = { ...DEFAULT_TODAY_BTV };
        else if (type === 'GENERAL_BANNER') newData = { ...DEFAULT_GENERAL_BANNER };
        else if (type === 'GENERAL_SET_BANNER') newData = { ...DEFAULT_GENERAL_SET_BANNER };
        else if (type === 'FULL_PROMO_BANNER') newData = { ...DEFAULT_FULL_PROMO_BANNER };
        else if (type === 'BIG_BANNER') newData = { ...DEFAULT_BIG_BANNER };
        else if (type === 'LONG_BANNER') newData = { ...DEFAULT_LONG_BANNER };
        else if (type === 'STRIP_BANNER') newData = { ...DEFAULT_STRIP_BANNER };
        else if (type === 'SYNOPSIS_BANNER') newData = { ...DEFAULT_SYNOPSIS_BANNER };
        else if (type === 'PROMO_POPUP') newData = { ...DEFAULT_PROMO_POPUP };
        else if (type === 'MINI_EPG_BANNER') newData = { ...DEFAULT_MINI_EPG_BANNER }; // 🌟 누락 분기 추가
      
        newData.startDate = campaignMeta.startDate;
        newData.dueDate = campaignMeta.dueDate;

        setAssets([...assets, { id: newId, type, name: uniqueName, data: newData }]); // 🌟 name → uniqueName
        setActiveTabId(newId);
        setIsAddAssetModalOpen(false);
        setOpenAccordions({ ...openAccordions, banner: true }); 
      };

      const removeAsset = (id, e) => {
        e.stopPropagation();
        const filteredAssets = assets.filter(a => a.id !== id);
        setAssets(filteredAssets); 
        
        if (filteredAssets.length === 0) setActiveTabId(null);
        else if (activeTabId === id) setActiveTabId(filteredAssets[0].id);
      };

      // 🌟 1. 확장프로그램 다운로드 함수 (에러 복구 완료)
      const handleDownloadExtension = async () => {
        setExportState({ isExporting: true, progress: 10, msg: "최신 확장프로그램 패킹 준비 중..." });
        try {
          const zip = new window.JSZip();
          const filesToFetch = ["manifest.json", "background.js", "content.js"];
          const baseUrl = "https://raw.githubusercontent.com/btvcuration/campaign/main/Tool";

          for (let i = 0; i < filesToFetch.length; i++) {
            const fileName = filesToFetch[i];
            setExportState({ isExporting: true, progress: 10 + Math.floor((i / filesToFetch.length) * 60), msg: `${fileName} 가져오는 중...` });
            const response = await fetch(`${baseUrl}/${fileName}?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error(`${fileName} 파일을 찾을 수 없습니다.`);
            zip.file(fileName, await response.text());
          }

          setExportState({ isExporting: true, progress: 85, msg: "압축 파일 생성 중..." });
          const blob = await zip.generateAsync({ type: "blob" });
          const downloadUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = downloadUrl; link.download = `btv-campaign-extension-${new Date().toISOString().slice(0,10)}.zip`;
          document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(downloadUrl);
          
          setExportState({ isExporting: true, progress: 100, msg: "✅ 최신 버전 다운로드 완료!" });
          setTimeout(() => {
            setExportState({ isExporting: false, progress: 0, msg: '' });
            alert("확장 프로그램 다운로드가 완료되었습니다.\n기존 버전 삭제 후 새로 등록하시고 키보드 F5를 눌러 새로고침 해주세요!");
          }, 1500);
        } catch (e) {
          console.error("Extension Download Error:", e);
          setExportState({ isExporting: true, progress: 100, msg: "⚠️ 다운로드 실패" });
          setTimeout(() => setExportState({ isExporting: false, progress: 0, msg: '' }), 3000);
          alert("다운로드 중 오류가 발생했습니다: " + e.message);
        }
      };

      // 🌟 2. Jira 전송 함수 (마크다운 치환 및 용량 최적화 완벽 반영)
      const handleExport = async () => {
        if (!assets || assets.length === 0) {
          if (campaignMeta.target !== 'TARGET') return alert("전송할 배너 기획안이 없고, 타겟팅 캠페인도 아닙니다.");
        }
        
        const isConfirmed = window.confirm("Jira 일감 전송을 시작하시겠습니까?\n확인을 누르면 화면 캡처가 시작됩니다.");
        if (!isConfirmed) return;

        const meta = campaignMeta || {};
        const myJiraId = localStorage.getItem('myJiraId') || '';
        if (!myJiraId) { alert("🚨 지라 전송을 위해 담당자 ID가 필요합니다!"); return handleSettingsClick(); }
        const cleanAssignee = myJiraId.split('@')[0].trim();

        setExportState({ isExporting: true, progress: 10, msg: "이미지 추출 준비 중..." });
        let capturedImages = {};

        const captureElementNative = async (element) => {
          const rect = element.getBoundingClientRect();
          let dataUrl = await new Promise((resolve) => {
            const timeout = setTimeout(() => resolve(null), 3500); 
            const listener = (e) => { clearTimeout(timeout); window.removeEventListener('RECEIVE_SCREENSHOT', listener); resolve(e.detail?.dataUrl); };
            window.addEventListener('RECEIVE_SCREENSHOT', listener);
            window.dispatchEvent(new CustomEvent('REQUEST_SCREENSHOT', { detail: { x: rect.left, y: rect.top, width: rect.width, height: rect.height } }));
          });
          if (!dataUrl) { setExportState({ isExporting: false, progress: 0, msg: '' }); throw new Error("Capture failed"); }
          return dataUrl;
        };

        for (let i = 0; i < assets.length; i++) {
          const asset = assets[i];
          const currentProgress = 10 + Math.floor((i / assets.length) * 40); 
          setActiveTabId(asset.id);
          
          if (asset.type === 'GENERAL_SET_BANNER') {
            const colCount = asset.data?.colType === '3단' ? 2 : 3;
            let setImages = [];
            for (let c = 0; c < colCount; c++) {
              setExportState({ isExporting: true, progress: currentProgress, msg: `[${asset.name}] 세트 ${c+1}/${colCount} 캡처 중...` });
              handleAssetChange(asset.id, 'selectedCardIndex', c);
              await new Promise(r => setTimeout(r, 1000)); 
              const element = document.getElementById('capture-preview-area');
              if (element) { const dataUrl = await captureElementNative(element); if (dataUrl) setImages.push(dataUrl); }
            }
            capturedImages[asset.id] = setImages;
          } else {
            setExportState({ isExporting: true, progress: currentProgress, msg: `[${asset.name}] 캡처 진행 중...` });
            await new Promise(r => setTimeout(r, 800)); 
            const element = document.getElementById('capture-preview-area');
            if (element) { const dataUrl = await captureElementNative(element); if (dataUrl) capturedImages[asset.id] = dataUrl; }
          }
        }

        setExportState({ isExporting: true, progress: 60, msg: "AI 기획 변경 내역 분석 중..." });

        const originalAssets = meta.aiOriginalAssets || [];
        const currentAssetIds = assets.map(a => a.id);
        const addedAssets = assets.filter(a => !a.id.startsWith('ai-asset-') && !originalAssets.find(oa => oa.id === a.id));
        const deletedAssets = originalAssets.filter(oa => !currentAssetIds.includes(oa.id));

        let changeLogHtml = "";
        if (addedAssets.length > 0 || deletedAssets.length > 0) {
            changeLogHtml += "<div style='background-color:#fff0f0; border:1px solid #ffccc7; padding:15px; border-radius:8px; margin-bottom:20px;'>";
            changeLogHtml += "<h3 style='color:#e74c3c; margin-top:0;'>🚨 기획 변경 사항 안내</h3><ul style='margin-bottom:0;'>";
            addedAssets.forEach(a => changeLogHtml += `<li style='color:#333;'><b>➕ 추가된 배너:</b> ${a.name} (수동 추가)</li>`);
            deletedAssets.forEach(a => changeLogHtml += `<li style='color:#333;'><b>➖ 삭제/제외된 배너:</b> ${a.name}</li>`);
            changeLogHtml += "</ul><p style='color:#666; font-size:12px; margin-top:10px;'><i>※ 상단 유저플로우는 기획 초안 기준이며, 실제 세팅은 위 변경 사항 및 하단 종합표를 기준으로 진행해 주세요.</i></p></div>";
        }

        const rawMermaidForJira = mermaidCode ? mermaidCode.replace(/<img[^>]*>/gi, '').trim() : '';
        const mermaidSectionHtml = rawMermaidForJira
          ? `<!--MERMAID_START-->${rawMermaidForJira}<!--MERMAID_END-->`
          : '<p style="color:#888;">유저플로우 데이터 없음</p>';

        setExportState({ isExporting: true, progress: 85, msg: "Jira 데이터 조립 중..." });

        let parentTable = `<table border="1" style="border-collapse: collapse; width: 100%; text-align: center; font-size: 13px;"><tbody><tr style="background-color: #f4f5f7; color: #333;"><td style="padding: 10px; font-weight: bold; width: 5%;">순번</td><td style="padding: 10px; font-weight: bold; width: 25%;">배너명</td><td style="padding: 10px; font-weight: bold; width: 15%;">편성 GNB</td><td style="padding: 10px; font-weight: bold; width: 25%;">랜딩 URL</td><td style="padding: 10px; font-weight: bold; width: 30%;">시안 미리보기</td></tr>`;
        let parentImagesToUpload = [];
        let uniqueAssignees = new Set();

        const childIssues = await Promise.all(assets.map(async (asset, idx) => {
          const data = asset?.data || {};
          let targetGnbs = Array.isArray(data.gnb) ? data.gnb : [data.gnb || '미지정'];

            <div className="fixed inset-0 bg-[#0a0812]/95 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-in zoom-in-95 duration-200">
              <div className="bg-[#12141c] w-[900px] border border-[#262833] rounded-3xl shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/10">
                <div className="p-6 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                  <h3 className="text-xl font-black text-white flex items-center gap-2"><LayoutTemplate size={22} className="text-[#4f3df6]"/> Select Template</h3>
                  <button onClick={() => setIsAddAssetModalOpen(false)} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={20}/></button>
                </div>
                <div className="p-8 grid grid-cols-2 lg:grid-cols-3 gap-5 max-h-[70vh] overflow-y-auto custom-scrollbar bg-[#0a0812]">
                  {BANNER_SPECS.map((spec) => (
                    <div key={spec.type} onClick={() => addAsset(spec.type, spec.name)} className="bg-[#1a1c26] border border-[#262833] rounded-2xl p-6 cursor-pointer hover:border-[#4f3df6] hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(79,61,246,0.2)] transition-all flex flex-col h-full group">
                      <div className="flex items-start justify-between mb-4"><div className="p-3 bg-[#0a0812] border border-[#303340] rounded-xl text-[#7387ff] group-hover:bg-[#4f3df6] group-hover:border-[#4f3df6] group-hover:text-white transition-colors"><spec.icon size={24} /></div><span className="text-[10px] font-bold bg-[#0a0812] border border-[#303340] text-slate-400 px-2 py-1 rounded-md font-mono">{spec.ratio}</span></div>
                      <h4 className="text-lg font-bold text-white mb-1 group-hover:text-[#7387ff] transition-colors">{spec.name}</h4>
                      <p className="text-xs text-slate-500 leading-relaxed mt-auto pt-4 border-t border-[#262833]">{spec.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
