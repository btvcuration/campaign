<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    
    import { 
      Tv, LayoutTemplate, Send, ChevronRight, ChevronDown, ChevronUp, Copy, CheckCircle, 
      Search, Mic, Menu, Home, Grid, Settings, Calendar, GitMerge, Plus, PlusCircle, Trash2, 
      Image as ImageIcon, ListTodo, Smartphone, LayoutPanelLeft, MonitorPlay, Sparkles, Bot, 
      X, User, ExternalLink, Monitor, Layout, Type, RectangleHorizontal, FileText, CalendarDays, 
      MessageSquare, Loader2, Lock, Users, Download, RefreshCw, Inbox, FolderOpen, PanelLeftOpen, 
      PanelLeftClose, Database, Clock, AlertTriangle, BarChart3, Filter, Zap, Check, Edit3, RotateCcw
    } from 'lucide-react';
    
    // 🌟 Mermaid 코드 양방향 파서 (코드 <-> 노드/간선 객체 자동 변환)
    const FLOW_THUMB_OPTIONS = [
      { label: '아이콘 없음 (일반 단계 박스)', url: '' },
      { label: 'Today B tv', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/today_btv.png' },
      { label: '일반/2단/세트 배너', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png' },
      { label: '풀프로모션', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/full_promo.png' },
      { label: '빅배너', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/big_banner.png' },
      { label: '롱배너', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/long_banner.png' },
      { label: '띠배너', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/strip_banner.png' },
      { label: '시놉시스 배너', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/synopsis_banner.png' },
      { label: 'TV 팝업', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/promo_popup.png' },
      { label: '실시간/미니 EPG 배너', url: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/mini_epg.png' }
    ];

    // 🌟 [업그레이드] 병렬(A & B --> C) 및 체인(A --> B --> C) 문법을 100% 지원하는 양방향 파서
    const parseMermaidGraph = (code = '') => {
      const nodesMap = {};
      const edges = [];
      if (!code) return { nodes: [], edges: [] };

      const normalized = code.replace(/\\n/g, '<br/>');

      // 1. 모든 노드 정의 추출: A["..."], A[...], A("...")
      const nodeRegex = /(?:^|[\s;]|-->|---|\&)\s*([A-Za-z0-9_]+)\s*(?:\[\s*"([\s\S]*?)"\s*\]|\(\s*"([\s\S]*?)"\s*\)|\[\s*([^\[\]"\n]+?)\s*\])/g;
      let m;
      while ((m = nodeRegex.exec(normalized)) !== null) {
        const id = m[1];
        if (['graph', 'flowchart', 'subgraph', 'end', 'style', 'classDef', 'direction'].includes(id)) continue;
        const rawContent = (m[2] ?? m[3] ?? m[4] ?? '').trim();
        const imgMatch = rawContent.match(/<img[^>]+src=['"]([^'"]+)['"][^>]*>/i);
        const imgUrl = imgMatch ? imgMatch[1] : '';
        const textOnly = rawContent
          .replace(/<img[^>]*>/gi, '')
          .replace(/^(?:<br\s*\/?>|\s)+/i, '')
          .replace(/(?:<br\s*\/?>)+/gi, '\n')
          .trim();
        const lines = textOnly.split('\n').map(s => s.trim()).filter(Boolean);
        nodesMap[id] = {
          id,
          title: lines[0] || id,
          subText: lines.slice(1).join(' '),
          imgUrl
        };
      }

      // 2. 병렬(A & B --> C & D) 및 체인(A --> B --> C) 화살표 간선 완벽 추출
      const cleanLines = normalized.split('\n');
      cleanLines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed || /^(graph|flowchart|subgraph|end|style|classDef|direction)\b/.test(trimmed)) return;

        // 대괄호/소괄호 안의 라벨 정의를 제거하여 순수 ID와 화살표만 남김
        const stripped = trimmed
          .replace(/\[\s*"[\s\S]*?"\s*\]/g, '')
          .replace(/\(\s*"[\s\S]*?"\s*\)/g, '')
          .replace(/\{\s*"[\s\S]*?"\s*\}/g, '')
          .replace(/\[\s*[^\[\]"\n]+?\s*\]/g, '')
          .replace(/\(\s*[^\(\)"\n]+?\s*\)/g, '');

        if (!stripped.includes('-->')) return;

        // -->|라벨| 형태를 토큰화하여 체인 및 & 병렬 분리
        const segments = stripped.split(/--+>(?:\|([^|]*)\|)?/);
        // segments 구조: [노드그룹0, 라벨0, 노드그룹1, 라벨1, 노드그룹2, ...]
        for (let i = 0; i < segments.length - 2; i += 2) {
          const leftGroup = segments[i] || '';
          const edgeLabel = (segments[i + 1] || '').trim();
          const rightGroup = segments[i + 2] || '';

          const fromIds = leftGroup.split('&').map(s => (s.match(/[A-Za-z0-9_]+/) || [])[0]).filter(Boolean);
          const toIds = rightGroup.split('&').map(s => (s.match(/[A-Za-z0-9_]+/) || [])[0]).filter(Boolean);

          fromIds.forEach(from => {
            if (!nodesMap[from]) nodesMap[from] = { id: from, title: from, subText: '', imgUrl: '' };
            toIds.forEach(to => {
              if (!nodesMap[to]) nodesMap[to] = { id: to, title: to, subText: '', imgUrl: '' };
              if (from !== to && !edges.some(e => e.from === from && e.to === to)) {
                edges.push({ id: `e-${from}-${to}`, from, to, label: edgeLabel });
              }
            });
          });
        }
      });

      return { nodes: Object.values(nodesMap), edges };
    };

    const serializeMermaidGraph = (nodes, edges) => {
      if (!nodes || nodes.length === 0) return '';
      const lines = ['graph TD'];
      nodes.forEach(n => {
        const parts = [];
        if (n.imgUrl) parts.push(`<img src='${n.imgUrl}' width='120' height='68'/>`);
        if (n.title) parts.push(n.title.replace(/"/g, "'"));
        if (n.subText) parts.push(n.subText.replace(/"/g, "'"));
        const label = parts.join('<br/>') || n.id;
        lines.push(`  ${n.id}["${label}"]`);
      });
      edges.forEach(e => {
        if (nodes.some(n => n.id === e.from) && nodes.some(n => n.id === e.to)) {
          if (e.label) lines.push(`  ${e.from} -->|${e.label}| ${e.to}`);
          else lines.push(`  ${e.from} --> ${e.to}`);
        }
      });
      return lines.join('\n');
    };

    // 🌟 새 노드 ID 생성 헬퍼 (A~Z 빈 알파벳 우선 부여)
    const getNextNodeId = (nodes) => {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      for (let ch of alphabet) {
        if (!nodes.some(n => n.id === ch)) return ch;
      }
      return `N${nodes.length + 1}`;
    };

    // 🌟 마우스 클릭으로 병렬(N:1)·분기(1:N)·문구·썸네일을 즉시 조작하는 인터랙티브 MermaidViewer
    const MermaidViewer = ({ code, onChange, selectedNodeId: externalSelectedId, onSelectNode }) => {
      const containerRef = useRef(null);
      const [zoom, setZoom] = useState(1);
      const [internalSelectedId, setInternalSelectedId] = useState(null);
      const activeNodeId = externalSelectedId !== undefined ? externalSelectedId : internalSelectedId;

      const setSelectedId = (id) => {
        if (onSelectNode) onSelectNode(id);
        else setInternalSelectedId(id);
      };

      const parsed = parseMermaidGraph(code);
      const selectedNode = parsed.nodes.find(n => n.id === activeNodeId) || null;

      useEffect(() => {
        if (code && containerRef.current && window.mermaid) {
          containerRef.current.innerHTML = ''; 
          window.mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { htmlLabels: true, useMaxWidth: false, nodeSpacing: 28, rankSpacing: 45, padding: 14, curve: 'basis' }
          });

          const normalizedCode = code.replace(/\\n/g, '<br/>');

          window.mermaid.render(`mermaid-${Date.now()}`, normalizedCode).then(({svg}) => {
            if (containerRef.current) {
              containerRef.current.innerHTML = svg;
              const svgEl = containerRef.current.querySelector('svg');
              if (svgEl) {
                const viewBox = svgEl.getAttribute('viewBox');
                if (viewBox) {
                  const parts = viewBox.split(/\s+|,/).map(Number);
                  if (parts.length === 4 && parts[2] > 0) {
                    // 병렬 노드가 여러 개일 때도 자연스럽게 보이도록 최대 폭을 620px까지 허용하되 컨테이너 안에 맞춤
                    svgEl.style.width = `${Math.min(parts[2], 620)}px`;
                    svgEl.style.maxWidth = '100%';
                    svgEl.style.height = 'auto';
                  }
                }

                const nodeEls = svgEl.querySelectorAll('.node');
                nodeEls.forEach(nodeEl => {
                  const rawDomId = nodeEl.id || '';
                  const matchedNode = parsed.nodes.find(n => {
                    const regex = new RegExp(`^flowchart-${n.id}-\\d+$`);
                    return regex.test(rawDomId) || rawDomId === n.id;
                  });
                  if (matchedNode) {
                    if (matchedNode.id === activeNodeId) {
                      nodeEl.classList.add('selected-mermaid-node');
                    }
                    nodeEl.addEventListener('click', (ev) => {
                      ev.stopPropagation();
                      setSelectedId(matchedNode.id);
                    });
                  }
                });
              }
            }
          }).catch(e => console.error("Mermaid Render Error:", e));
        }
      }, [code, activeNodeId]);

      const handleQuickNodeUpdate = (field, val) => {
        if (!selectedNode || !onChange) return;
        const nextNodes = parsed.nodes.map(n => n.id === selectedNode.id ? { ...n, [field]: val } : n);
        onChange(serializeMermaidGraph(nextNodes, parsed.edges));
      };

      const handleQuickNodeDelete = () => {
        if (!selectedNode || !onChange) return;
        const nextNodes = parsed.nodes.filter(n => n.id !== selectedNode.id);
        const nextEdges = parsed.edges.filter(e => e.from !== selectedNode.id && e.to !== selectedNode.id);
        setSelectedId(null);
        onChange(serializeMermaidGraph(nextNodes, nextEdges));
      };

      // 🌟 특정 도착 노드로의 화살표(랜딩 연결) On/Off 토글 — 병렬(N:1) 및 분기(1:N) 원클릭 구성!
      const handleToggleTargetEdge = (targetId) => {
        if (!selectedNode || !onChange || selectedNode.id === targetId) return;
        const exists = parsed.edges.some(e => e.from === selectedNode.id && e.to === targetId);
        let nextEdges;
        if (exists) {
          nextEdges = parsed.edges.filter(e => !(e.from === selectedNode.id && e.to === targetId));
        } else {
          nextEdges = [...parsed.edges, { id: `e-${selectedNode.id}-${targetId}`, from: selectedNode.id, to: targetId, label: '' }];
        }
        onChange(serializeMermaidGraph(parsed.nodes, nextEdges));
      };

      // 🌟 병렬 진입 배너 추가 (현재 선택된 배너와 동일한 도착지로 향하는 형제 배너 생성)
      const handleAddParallelBanner = () => {
        if (!onChange) return;
        const newId = getNextNodeId(parsed.nodes);
        const newNode = {
          id: newId,
          title: '[홈] 추가 배너',
          subText: '프로모션 카피',
          imgUrl: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png'
        };
        const nextNodes = [...parsed.nodes, newNode];
        let nextEdges = [...parsed.edges];

        // 선택된 노드가 가리키던 도착지가 있으면 동일하게 연결(병렬 N:1), 없으면 첫 번째 하위 노드에 연결
        const currentTargets = selectedNode
          ? parsed.edges.filter(e => e.from === selectedNode.id).map(e => e.to)
          : (parsed.edges[0] ? [parsed.edges[0].to] : []);

        if (currentTargets.length > 0) {
          currentTargets.forEach(tId => {
            nextEdges.push({ id: `e-${newId}-${tId}`, from: newId, to: tId, label: '' });
          });
        }
        setSelectedId(newId);
        onChange(serializeMermaidGraph(nextNodes, nextEdges));
      };

      // 🌟 하위 랜딩 단계 추가 (현재 선택된 박스에서 이어지는 다음 단계 생성)
      const handleAddChildStep = () => {
        if (!onChange) return;
        const newId = getNextNodeId(parsed.nodes);
        const newNode = { id: newId, title: '신규 랜딩 페이지', subText: '상세 화면', imgUrl: '' };
        const nextNodes = [...parsed.nodes, newNode];
        const nextEdges = [...parsed.edges];
        const fromId = selectedNode ? selectedNode.id : parsed.nodes[parsed.nodes.length - 1]?.id;
        if (fromId) {
          nextEdges.push({ id: `e-${fromId}-${newId}`, from: fromId, to: newId, label: '' });
        }
        setSelectedId(newId);
        onChange(serializeMermaidGraph(nextNodes, nextEdges));
      };
      
      if (!code) return null;
      return (
        <div className="relative w-full h-full flex flex-col overflow-hidden" onClick={() => setSelectedId(null)}>
          {/* 상단 액션 & 줌 컨트롤 바 */}
          <div className="absolute top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
            {onChange && !onSelectNode ? (
              <div className="flex items-center gap-1.5 pointer-events-auto" onClick={e => e.stopPropagation()}>
                <button
                  type="button"
                  onClick={handleAddParallelBanner}
                  className="px-2.5 py-1 rounded-lg bg-[#4f3df6] hover:bg-[#6252ff] text-white text-[10px] font-bold shadow-lg flex items-center gap-1"
                  title="같은 목적지로 랜딩되는 병렬 배너 박스를 추가합니다"
                >
                  <Plus size={11} /> 병렬 배너 추가
                </button>
                <button
                  type="button"
                  onClick={handleAddChildStep}
                  className="px-2.5 py-1 rounded-lg bg-[#1a1c26] hover:bg-[#262833] text-slate-200 border border-[#303340] text-[10px] font-bold shadow-lg flex items-center gap-1"
                  title="아래로 이어지는 다음 랜딩 단계를 추가합니다"
                >
                  <Plus size={11} /> 하위 단계 추가
                </button>
              </div>
            ) : (
              <span className="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-[#12141c]/90 border border-[#303340] text-slate-400 backdrop-blur">
                🖱️ 박스를 클릭해 문구 수정 및 병렬 랜딩 연결을 설정하세요
              </span>
            )}

            <div className="flex items-center gap-1 bg-[#12141c]/90 border border-[#303340] rounded-lg p-1 shadow-lg backdrop-blur pointer-events-auto" onClick={e => e.stopPropagation()}>
              <button type="button" onClick={() => setZoom(z => Math.max(0.6, +(z - 0.15).toFixed(2)))} className="px-2 py-0.5 text-xs font-black text-slate-400 hover:text-white">-</button>
              <button type="button" onClick={() => setZoom(1)} className="px-1.5 py-0.5 text-[10px] font-bold text-slate-300 hover:text-[#7387ff]">{Math.round(zoom * 100)}%</button>
              <button type="button" onClick={() => setZoom(z => Math.min(1.6, +(z + 0.15).toFixed(2)))} className="px-2 py-0.5 text-xs font-black text-slate-400 hover:text-white">+</button>
            </div>
          </div>

          {/* 메인 다이어그램 캔버스 */}
          <div className="flex-1 w-full h-full overflow-auto custom-scrollbar p-6 pt-14 flex items-start justify-center">
            <div
              id="mermaid-export-area"
              ref={containerRef}
              style={{ transform: `scale(${zoom})`, transformOrigin: 'top center', transition: 'transform 0.15s ease' }}
              className="w-full flex justify-center"
            />
          </div>

          {/* 🌟 Step 2에서 노드를 클릭했을 때 뜨는 병렬 연결 & 문구 편집 팝오버 */}
          {onChange && !onSelectNode && selectedNode && (
            <div
              onClick={e => e.stopPropagation()}
              className="p-3.5 bg-[#12141c] border-t border-pink-500/40 shadow-2xl space-y-2.5 animate-in slide-in-from-bottom-2 z-30"
            >
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-black text-pink-400 flex items-center gap-1.5">
                  <Edit3 size={12} /> [{selectedNode.id}] 박스 편집 & 랜딩 연결
                </span>
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={handleQuickNodeDelete}
                    className="px-2 py-1 bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/30 rounded text-[10px] font-bold flex items-center gap-1"
                  >
                    <Trash2 size={11} /> 박스 삭제
                  </button>
                  <button type="button" onClick={() => setSelectedId(null)} className="p-1 text-slate-400 hover:text-white"><X size={13} /></button>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="block text-[9px] font-bold text-slate-400 mb-0.5">배너 썸네일</label>
                  <select
                    value={selectedNode.imgUrl || ''}
                    onChange={e => handleQuickNodeUpdate('imgUrl', e.target.value)}
                    className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-2 py-1.5 text-[11px] text-white outline-none focus:border-pink-400"
                  >
                    {FLOW_THUMB_OPTIONS.map(opt => (
                      <option key={opt.label} value={opt.url}>{opt.label}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-[9px] font-bold text-slate-400 mb-0.5">1줄 타이틀 (GNB/배너명)</label>
                  <input
                    type="text"
                    value={selectedNode.title}
                    onChange={e => handleQuickNodeUpdate('title', e.target.value)}
                    className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-2.5 py-1.5 text-xs text-white font-bold outline-none focus:border-pink-400"
                  />
                </div>
                <div>
                  <label className="block text-[9px] font-bold text-slate-400 mb-0.5">2줄 서브 문구</label>
                  <input
                    type="text"
                    value={selectedNode.subText}
                    onChange={e => handleQuickNodeUpdate('subText', e.target.value)}
                    placeholder="비워두면 1줄만 표시"
                    className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-2.5 py-1.5 text-xs text-slate-200 outline-none focus:border-pink-400"
                  />
                </div>
              </div>

              {/* 🌟 병렬(N:1) 및 분기(1:N) 화살표를 원클릭으로 켜고 끄는 타겟 토글 칩 */}
              {parsed.nodes.length > 1 && (
                <div className="pt-1.5 border-t border-[#1e202b]">
                  <label className="block text-[9px] font-bold text-cyan-400 mb-1">
                    🔗 이 박스 클릭 시 이동(랜딩)할 도착 박스 선택 (클릭 시 화살표 연결/해제):
                  </label>
                  <div className="flex flex-wrap gap-1.5">
                    {parsed.nodes.filter(n => n.id !== selectedNode.id).map(targetNode => {
                      const isConnected = parsed.edges.some(e => e.from === selectedNode.id && e.to === targetNode.id);
                      return (
                        <button
                          key={targetNode.id}
                          type="button"
                          onClick={() => handleToggleTargetEdge(targetNode.id)}
                          className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all flex items-center gap-1 ${
                            isConnected
                              ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 shadow'
                              : 'bg-[#0a0812] border-[#262833] text-slate-500 hover:text-slate-300'
                          }`}
                        >
                          <span>{isConnected ? '✓' : '+'}</span>
                          <span>➔ [{targetNode.id}] {targetNode.title}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // 🌟 Step 3 [유저플로우] 버튼 클릭 시 열리는 노코드(No-Code) 병렬 플로우 에디터 모달
    const InteractiveFlowEditorModal = ({ mermaidCode, setMermaidCode, onClose }) => {
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [showRawCode, setShowRawCode] = useState(false);

      const { nodes, edges } = parseMermaidGraph(mermaidCode);
      const activeNode = nodes.find(n => n.id === selectedNodeId) || nodes[0] || null;

      useEffect(() => {
        if (!selectedNodeId && nodes.length > 0) {
          setSelectedNodeId(nodes[0].id);
        }
      }, [nodes.length]);

      const updateGraph = (nextNodes, nextEdges) => {
        setMermaidCode(serializeMermaidGraph(nextNodes, nextEdges));
      };

      const handleNodeFieldChange = (id, field, val) => {
        const nextNodes = nodes.map(n => n.id === id ? { ...n, [field]: val } : n);
        updateGraph(nextNodes, edges);
      };

      const handleDeleteNode = (id) => {
        const nextNodes = nodes.filter(n => n.id !== id);
        const nextEdges = edges.filter(e => e.from !== id && e.to !== id);
        if (selectedNodeId === id) setSelectedNodeId(nextNodes[0]?.id || null);
        updateGraph(nextNodes, nextEdges);
      };

      // 병렬 진입 배너 추가 (현재 선택된 배너와 동일한 목적지로 연결)
      const handleAddParallelNode = () => {
        const newId = getNextNodeId(nodes);
        const newNode = {
          id: newId,
          title: '[홈] 추가 배너',
          subText: '프로모션 카피',
          imgUrl: 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png'
        };
        const nextNodes = [...nodes, newNode];
        const nextEdges = [...edges];
        const currentTargets = activeNode
          ? edges.filter(e => e.from === activeNode.id).map(e => e.to)
          : (edges[0] ? [edges[0].to] : []);

        currentTargets.forEach(tId => {
          nextEdges.push({ id: `e-${newId}-${tId}`, from: newId, to: tId, label: '' });
        });
        setSelectedNodeId(newId);
        updateGraph(nextNodes, nextEdges);
      };

      // 하위 랜딩 단계 추가
      const handleAddChildNode = () => {
        const newId = getNextNodeId(nodes);
        const newNode = { id: newId, title: '새 랜딩 화면', subText: '상세 내용', imgUrl: '' };
        const nextNodes = [...nodes, newNode];
        const nextEdges = [...edges];
        if (activeNode) {
          nextEdges.push({ id: `e-${activeNode.id}-${newId}`, from: activeNode.id, to: newId, label: '' });
        }
        setSelectedNodeId(newId);
        updateGraph(nextNodes, nextEdges);
      };

      // 특정 도착 노드로의 연결 On/Off 토글 (다대일 N:1 / 일대다 1:N 설정)
      const handleToggleOutgoingEdge = (fromId, toId) => {
        if (!fromId || !toId || fromId === toId) return;
        const exists = edges.some(e => e.from === fromId && e.to === toId);
        const nextEdges = exists
          ? edges.filter(e => !(e.from === fromId && e.to === toId))
          : [...edges, { id: `e-${fromId}-${toId}`, from: fromId, to: toId, label: '' }];
        updateGraph(nodes, nextEdges);
      };

      // 반대로 "어떤 배너들이 현재 선택된 박스(예: TV팝업)로 모여드는지" 역방향(Incoming) 연결 On/Off 토글
      const handleToggleIncomingEdge = (sourceId, targetId) => {
        handleToggleOutgoingEdge(sourceId, targetId);
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in zoom-in-95 duration-200" onClick={onClose}>
          <div className="bg-[#12141c] w-full max-w-5xl border border-[#262833] rounded-2xl shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/10 h-[86vh]" onClick={e => e.stopPropagation()}>
            <div className="p-5 border-b border-[#262833] flex flex-wrap justify-between items-center gap-3 bg-[#0f111a]">
              <div>
                <h3 className="text-base font-black text-white flex items-center gap-2">
                  <GitMerge size={18} className="text-cyan-400"/> 인터랙티브 유저플로우 에디터 (병렬/분기 지원)
                </h3>
                <p className="text-[11px] text-slate-400 mt-0.5">여러 배너가 하나의 TV팝업·시놉시스로 모이는 병렬(N:1) 동선을 체크박스 클릭만으로 구성할 수 있습니다.</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={handleAddParallelNode}
                  className="px-3 py-1.5 bg-[#4f3df6] hover:bg-[#6252ff] text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow"
                >
                  <Plus size={14} /> 병렬 진입 배너 추가
                </button>
                <button
                  type="button"
                  onClick={handleAddChildNode}
                  className="px-3 py-1.5 bg-[#1a1c26] hover:bg-[#262833] text-slate-200 border border-[#303340] rounded-lg text-xs font-bold flex items-center gap-1"
                >
                  <Plus size={14} /> 하위 랜딩 단계 추가
                </button>
                <button onClick={onClose} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={18}/></button>
              </div>
            </div>

            <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden bg-[#0a0812]">
              {/* 좌측: 인터랙티브 다이어그램 프리뷰 (7칸) */}
              <div className="lg:col-span-7 h-full overflow-hidden border-b lg:border-b-0 lg:border-r border-[#262833] flex items-center justify-center relative">
                {mermaidCode ? (
                  <MermaidViewer
                    code={mermaidCode}
                    onChange={setMermaidCode}
                    selectedNodeId={activeNode?.id}
                    onSelectNode={setSelectedNodeId}
                  />
                ) : (
                  <div className="text-center space-y-3">
                    <p className="text-xs text-slate-500">등록된 유저플로우가 없습니다.</p>
                    <button onClick={handleAddParallelNode} className="px-4 py-2 bg-[#4f3df6] text-white rounded-xl text-xs font-bold">+ 첫 단계 박스 만들기</button>
                  </div>
                )}
              </div>

              {/* 우측: 노코드 마우스 편집 패널 (5칸) */}
              <div className="lg:col-span-5 h-full overflow-y-auto custom-scrollbar p-5 space-y-5 bg-[#12141c]">
                {/* 1. 전체 노드 칩 목록 */}
                <div>
                  <label className="block text-[11px] font-black text-slate-300 mb-2">1. 편집할 박스 선택 ({nodes.length}개)</label>
                  <div className="flex flex-wrap gap-1.5">
                    {nodes.map(n => (
                      <button
                        key={n.id}
                        type="button"
                        onClick={() => setSelectedNodeId(n.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center gap-1.5 ${activeNode?.id === n.id ? 'bg-pink-500/20 border-pink-500 text-white shadow' : 'bg-[#0a0812] border-[#262833] text-slate-400 hover:text-white'}`}
                      >
                        <span className="text-[10px] font-mono text-pink-400">[{n.id}]</span>
                        <span className="truncate max-w-[120px]">{n.title}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* 2. 선택된 노드 상세 수정 폼 */}
                {activeNode && (
                  <div className="bg-[#0a0812] border border-pink-500/30 rounded-2xl p-4 space-y-3.5">
                    <div className="flex items-center justify-between border-b border-[#262833] pb-2.5">
                      <span className="text-xs font-black text-pink-400">✏️ [{activeNode.id}] 박스 내용 수정</span>
                      <button
                        type="button"
                        onClick={() => handleDeleteNode(activeNode.id)}
                        className="px-2.5 py-1 bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/30 rounded-lg text-[11px] font-bold flex items-center gap-1"
                      >
                        <Trash2 size={12} /> 이 박스 삭제
                      </button>
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 mb-1">배너 썸네일 아이콘 선택</label>
                      <select
                        value={activeNode.imgUrl || ''}
                        onChange={e => handleNodeFieldChange(activeNode.id, 'imgUrl', e.target.value)}
                        className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-pink-400"
                      >
                        {FLOW_THUMB_OPTIONS.map(opt => (
                          <option key={opt.label} value={opt.url}>{opt.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 mb-1">1줄 메인 타이틀 (예: [홈] Today B tv)</label>
                      <input
                        type="text"
                        value={activeNode.title}
                        onChange={e => handleNodeFieldChange(activeNode.id, 'title', e.target.value)}
                        className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:border-pink-400"
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 mb-1">2줄 서브 문구 (예: 대표 카피 또는 시놉시스명)</label>
                      <input
                        type="text"
                        value={activeNode.subText}
                        onChange={e => handleNodeFieldChange(activeNode.id, 'subText', e.target.value)}
                        placeholder="비워두면 1줄만 표시됩니다"
                        className="w-full bg-[#12141c] border border-[#303340] rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-pink-400"
                      />
                    </div>
                  </div>
                )}

                {/* 3. 🌟 병렬(N:1) 및 분기(1:N) 화살표 직관적 체크박스 제어 */}
                {activeNode && nodes.length > 1 && (
                  <div className="bg-[#0a0812] border border-[#262833] rounded-2xl p-4 space-y-4">
                    <div>
                      <div className="text-xs font-black text-cyan-400 mb-1">
                        ➔ [{activeNode.title}]에서 이동할 다음 단계 (1:N 분기)
                      </div>
                      <p className="text-[10px] text-slate-400 mb-2">클릭하면 [{activeNode.id}]에서 해당 박스로 향하는 화살표가 연결/해제됩니다.</p>
                      <div className="flex flex-wrap gap-1.5">
                        {nodes.filter(n => n.id !== activeNode.id).map(targetNode => {
                          const isConnected = edges.some(e => e.from === activeNode.id && e.to === targetNode.id);
                          return (
                            <button
                              key={targetNode.id}
                              type="button"
                              onClick={() => handleToggleOutgoingEdge(activeNode.id, targetNode.id)}
                              className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold border transition-all flex items-center gap-1.5 ${
                                isConnected
                                  ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 shadow'
                                  : 'bg-[#12141c] border-[#262833] text-slate-500 hover:text-slate-300'
                              }`}
                            >
                              <span>{isConnected ? '✓ 연결됨' : '+ 연결'}</span>
                              <span className="text-white">➔ [{targetNode.id}] {targetNode.title}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="pt-3 border-t border-[#1e202b]">
                      <div className="text-xs font-black text-[#32d782] mb-1">
                        🎯 [{activeNode.title}](으)로 모여드는 이전 배너들 (N:1 병렬 합류)
                      </div>
                      <p className="text-[10px] text-slate-400 mb-2">Today B tv, 롱배너, 2단배너가 모두 이 박스로 랜딩되게 하려면 아래에서 해당 배너들을 모두 켜주세요.</p>
                      <div className="flex flex-wrap gap-1.5">
                        {nodes.filter(n => n.id !== activeNode.id).map(sourceNode => {
                          const isIncoming = edges.some(e => e.from === sourceNode.id && e.to === activeNode.id);
                          return (
                            <button
                              key={sourceNode.id}
                              type="button"
                              onClick={() => handleToggleIncomingEdge(sourceNode.id, activeNode.id)}
                              className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold border transition-all flex items-center gap-1.5 ${
                                isIncoming

    const extractSpecLimitsFromSheetText = (specText = '', defaults = {}) => {
      const raw = String(specText || '');
      const findNum = (regex, fb) => {
        const m = raw.match(regex);
        return m ? parseInt(m[1], 10) : fb;
      };

      const parts = raw.split(/\(\s*배너\s*\)/);
      const firstPart = parts[0] || raw;
      const secondPart = parts[1] || '';

      const findInPart = (partStr, regex, fb) => {
        const m = String(partStr || '').match(regex);
        return m ? parseInt(m[1], 10) : fb;
      };

      return {
        rawText: raw,
        maxLines: findNum(/최대\s*(\d+)\s*줄/, defaults.maxLines || 2),
        logoMax: findInPart(firstPart, /로고\s*[:：]?\s*(?:최대\s*)?(\d+)\s*자/, defaults.logoMax || 9),
        mainMax: findInPart(firstPart, /메인\s*텍스트\s*[:：]?\s*(?:최대\s*)?(\d+)\s*자/,
                 findInPart(firstPart, /상단\s*텍스트\s*[:：]?\s*(?:최대\s*)?(\d+)\s*자/,
                 findInPart(firstPart, /텍스트\s*[:：]?\s*(?:최대\s*)?(?:\d+\s*~\s*)?(\d+)\s*자/, defaults.mainMax || 20))),
        subMax:  findInPart(firstPart, /서브\s*텍스트\s*[:：]?\s*(?:최대\s*)?(\d+)\s*자/,
                 findInPart(firstPart, /하단\s*텍스트\s*[:：]?\s*(?:최대\s*)?(\d+)\s*자/,
                 findInPart(firstPart, /텍스트\s*[:：]?\s*(?:최대\s*)?(?:\d+\s*~\s*)?(\d+)\s*자/, defaults.subMax || 20))),
        cardMax: secondPart
                 ? findInPart(secondPart, /(?:1줄\s*내\s*|텍스트\s*[:：]?\s*)?(?:최대\s*)?(\d+)\s*자/, defaults.cardMax || 8)
                 : (defaults.cardMax || 8),
        btnMax:  findNum(/텍스트\s*[:：]?\s*\d+\s*~\s*(\d+)\s*자/,
                 findNum(/텍스트\s*[:：]?\s*(?:최대\s*)?(\d+)\s*자/, defaults.btnMax || 9))
      };
    };

    const CopyInputWithSpec = ({ label, value = '', onChange, maxChars, maxLines = 1, placeholder = '', multiline = false, textColorClass = 'text-white' }) => {
      const text = String(value || '');
      const lines = text ? text.split('\n') : [''];

      const totalLength = text.replace(/\n/g, '').length;
      
      const isTotalLimit = maxChars >= 35 && maxLines > 1;
      const currentCount = isTotalLimit ? totalLength : maxLineLength;
      const isCharExceeded = maxChars ? currentCount > maxChars : false;
      const isLineExceeded = maxLines ? lineCount > maxLines : false;
      const isWarning = isCharExceeded || isLineExceeded;

      return (
        <div className="space-y-1">

                {maxLines > 1 ? ` · ${lineCount}/${maxLines}줄` : ''}

            />

              onChange={onChange}

    const DraggableMemo = ({ memo, updateMemo, removeMemo }) => {
      const [pos, setPos] = useState({ x: memo.x || 50, y: memo.y || 50 });
      const isDragging = useRef(false);
      const dragStart = useRef({ mouseX: 0, mouseY: 0, boxX: 0, boxY: 0 });

      useEffect(() => { setPos({ x: memo.x || 50, y: memo.y || 50 }); }, [memo.x, memo.y]);

      const handleMouseDown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        e.preventDefault(); e.stopPropagation();
        isDragging.current = true;
        dragStart.current = { mouseX: e.clientX, mouseY: e.clientY, boxX: pos.x, boxY: pos.y };

        const handleMouseMove = (ev) => {
          if (!isDragging.current) return;
          ev.preventDefault();
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          setPos({ x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
        };

        const handleMouseUp = (ev) => {
          if (!isDragging.current) return;
          isDragging.current = false;
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          updateMemo(memo.id, { x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove, { passive: false });
        document.addEventListener('mouseup', handleMouseUp);
      };

      return (
        <div 
          onMouseDown={handleMouseDown}
          className="absolute bg-yellow-300/95 backdrop-blur-sm px-4 py-3 rounded-xl shadow-2xl border border-yellow-400 min-w-[200px] max-w-[300px] transition-shadow hover:shadow-[0_0_20px_rgba(250,204,21,0.6)] cursor-move z-50 pointer-events-auto"
          style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`, left: 0, top: 0, willChange: 'transform' }}
        >
          <div className="flex items-center justify-between gap-4 mb-2 pointer-events-none">
            <div className="flex items-center gap-1.5 text-yellow-800 font-bold text-[10px]"><MessageSquare size={12}/> 시안 메모</div>

          </div>
          <textarea 
            onMouseDown={(e) => e.stopPropagation()}
            value={memo.text} 
            onChange={(e) => updateMemo(memo.id, { text: e.target.value })}
            className="w-full bg-yellow-100/50 border border-yellow-400/30 rounded p-2 text-xs text-yellow-900 font-bold outline-none resize-none focus:bg-white focus:ring-1 focus:ring-yellow-500 custom-scrollbar h-[60px] cursor-text pointer-events-auto"
            placeholder="여기에 메모를 입력하세요..."
          />
        </div>
      );

        <div className="absolute inset-0 pointer-events-none z-50 overflow-visible">

            <div className="absolute bottom-[8%] left-[5%] right-[5%] h-[140px] bg-transparent rounded-lg shadow-2xl flex items-center p-4 backdrop-blur-md z-10 gap-6">
              <div className="h-full aspect-[1.48/1] bg-[#0a0a0f] rounded-md relative overflow-hidden border-[2px] border-[#7387FF] shadow-[0_0_20px_rgba(255,255,255,0.2)] shrink-0 flex items-center justify-center">
                <div className="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform z-0" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
                  {!checkIsUrl(block.data?.imageUrl) && <ImageIcon size={32} className="text-white/20"/>}
                </div>
                <div className="absolute inset-x-0 bottom-0 h-[45%] bg-gradient-to-t from-black/90 to-transparent pointer-events-none z-10"></div>
                <div className="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 z-20">
                  <div className="bg-white text-[#111] font-black text-[11px] px-2.5 py-0.5 rounded-[12px] shadow-md tracking-tighter">OK</div><div className="text-white font-extrabold text-[15px] tracking-tight drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">{block.data?.buttonText || '감상하기'}</div>
                </div>
                <FallbackText text={block.data?.imageUrl} />
              </div>
              <div className="flex-1 h-full flex flex-col justify-center pb-2">
                <div className="flex items-center gap-2 mb-1 text-[#5ea3ff] font-bold text-[15px] tracking-wider"><span>003 ★</span><span>tvN</span></div>
                <h3 className="text-white font-black text-[1.9rem] drop-shadow-md mb-2 truncate leading-tight">벌거벗은 세계사 206회 <span className="text-[10px] bg-white/20 px-1 py-0.5 rounded ml-1 align-middle">ALL</span></h3>
                <div className="flex items-center gap-3 w-full border-t border-white/20 pt-2">
                  <span className="text-slate-300 text-[13px] font-bold">14:00</span>
                  <div className="w-[150px] h-[3px] bg-[#333] rounded-full overflow-hidden"><div className="w-[60%] h-full bg-[#5ea3ff]"></div></div>
                  <span className="text-slate-400 text-[12px] font-bold">16:00 | 현재 시각 15:32</span>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (block.type === 'LONG_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0 flex items-center justify-center">
            <div className="absolute inset-0 p-12 flex justify-center gap-4 z-0 bg-[#0a0a0f]">
              <div className="h-[90%] aspect-[129/181.5] bg-[#1a1c26] rounded-xl overflow-hidden relative shadow-[0_10px_30px_rgba(0,0,0,0.8)] border-[3px] border-[#7387FF] shrink-0">
                <div className="absolute inset-0 bg-cover bg-top bg-no-repeat z-10" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
                  {!checkIsUrl(block.data?.imageUrl) && !checkHasText(block.data?.imageUrl) && <div className="absolute inset-0 flex items-center justify-center bg-[#0a0a0f]"><ImageIcon size={48} className="text-white/10"/></div>}
                  <FallbackText text={block.data?.imageUrl} alignClass="justify-center items-center text-center px-4" />
                </div>
                <div className="absolute bottom-0 inset-x-0 p-6 bg-gradient-to-t from-black via-black/80 to-transparent z-20 text-center flex flex-col justify-end h-[40%]">
                  <p className="text-white font-extrabold text-xl leading-tight drop-shadow-md whitespace-pre-wrap">{block.data?.copy || '메인 카피 입력'}</p>
                  {block.data?.subTitle && <p className="text-slate-300 font-medium text-xs mt-2 whitespace-pre-wrap">{block.data.subTitle}</p>}
                </div>
              </div>
              {[1, 2].map(i => (
                <div key={i} className="h-[90%] aspect-[129/181.5] bg-[#222530] rounded-xl border border-white/5 shadow-lg shrink-0 flex items-center justify-center relative overflow-hidden">
                   <ImageIcon size={48} className="text-white/5" />
                </div>
              ))}
            </div>
          </div>
        );
      }

      // 시트에 새로 추가된 배너 유형(CUSTOM_BANNER) 범용 스마트 프리뷰 렌더러
      return (
        <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0 flex items-center justify-center p-10">
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <span className="text-white/[0.03] font-black text-[96px] tracking-widest select-none uppercase">{block.name || block.type}</span>
          </div>
          <div className="relative z-10 w-full max-w-[780px] bg-[#12141c]/95 border-[3px] border-[#7387FF] rounded-2xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.85)] flex items-center min-h-[210px]">
            <div className="flex-1 p-8 flex flex-col justify-center gap-2 z-10">
              <span className="text-[10px] font-black px-2.5 py-0.5 rounded bg-[#4f3df6]/20 text-[#7387ff] border border-[#4f3df6]/40 w-max mb-1">
                {block.name || '시트 연동 신규 배너'}
              </span>
              {block.data?.mainTitle && (
                <h2 className="text-white font-black text-2xl leading-tight whitespace-pre-wrap drop-shadow-md">{block.data.mainTitle}</h2>
              )}
              {block.data?.subTitle && (
                <p className="text-slate-300 font-medium text-sm leading-snug whitespace-pre-wrap">{block.data.subTitle}</p>
              )}
              {block.data?.buttonText && (
                <div className="mt-3 inline-flex bg-[#4f3df6] text-white px-5 py-1.5 rounded-lg font-bold text-xs w-max shadow-lg">
                  {block.data.buttonText}
                </div>
              )}
            </div>
            <div className="w-[42%] self-stretch bg-[#1a1c26] relative bg-cover bg-center shrink-0 min-h-[210px]" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
              {!checkIsUrl(block.data?.imageUrl) && !checkHasText(block.data?.imageUrl) && (
                <div className="absolute inset-0 flex items-center justify-center"><ImageIcon size={40} className="text-white/10"/></div>
              )}
              <FallbackText text={block.data?.imageUrl} />
              <div className="absolute inset-y-0 left-0 w-16 bg-gradient-to-r from-[#12141c] to-transparent pointer-events-none" />
            </div>
          </div>
        </div>
      );
    };

    const parseAndFormatKoreanNumber = (str) => {
      if (!str) return '';
      let cleanStr = String(str).replace(/,/g, '').replace(/명/g, '').replace(/원/g, '').trim();
      let multiplier = 1;
      if (cleanStr.includes('만')) { multiplier = 10000; cleanStr = cleanStr.replace('만', ''); }
      else if (cleanStr.includes('천')) { multiplier = 1000; cleanStr = cleanStr.replace('천', ''); }
      const num = parseFloat(cleanStr);
      if (isNaN(num)) return str; 
      return (num * multiplier).toLocaleString();
    };

    const getUniqueAssetName = (existingNames, baseName) => {
      if (!existingNames.includes(baseName)) return baseName;
      let n = 2;
      while (existingNames.includes(`${baseName} (${n})`)) n++;
      return `${baseName} (${n})`;
    };

    // ====================================================================================
    // 🌟 Step 2. AI 프로모션 기획 뷰
    // ====================================================================================
    const AiPlannerView = ({ campaignMeta, setCampaignMeta, chatHistory, setChatHistory, assets, mermaidCode, onUpdateMermaid, onResetMermaid, onMoveToEditor }) => {
      const [inputValue, setInputValue] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [pendingAiPayload, setPendingAiPayload] = useState(null); 
      const chatEndRef = useRef(null);

      const [isGeneratingImg, setIsGeneratingImg] = useState(false);
      const [previewImageUrl, setPreviewImageUrl] = useState('');
      const [showPreviewModal, setShowPreviewModal] = useState(false);

      const handleTargetSizeBlur = (e) => {
        setCampaignMeta(prev => ({ ...prev, targetSize: parseAndFormatKoreanNumber(e.target.value) }));
      };

      const handleResetPlanner = () => {
        if (!window.confirm("현재 작성 중인 기획 폼과 AI 대화 내역을 모두 초기화하시겠습니까?\n(요청 부서와 담당자 이름은 유지됩니다.)")) return;
        setCampaignMeta({
          campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
          hasCoupon: 'N', couponBenefit: '', externalGift: '', conceptCopy: '', mainImageUrl: '',
          bannerTypes: '', gnbLocations: '', bannerPlan: [], isCapaChecked: false,
          department: localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
          marketer: localStorage.getItem('myMarketerName') || '',
          cycle: '단발성', uiVersion: '5.0'
        });
        setChatHistory([
          { id: 'msg-init', sender: 'ai', text: '매니저님, 기획 폼이 깨끗하게 초기화되었습니다!\n새로 기획하실 프로모션 목적이나 상품을 편하게 말씀해 주세요.' }
        ]);
        setPendingAiPayload(null);
        if (onResetMermaid) onResetMermaid();
      };

      const handleOpenImagePreview = () => {
        if (campaignMeta.mainImageUrl) {
          setPreviewImageUrl(campaignMeta.mainImageUrl);
          setShowPreviewModal(true);
          return;
        }
        handleGenerateImage();
      };
      
      const handleGenerateImage = async () => {
        if (!campaignMeta.conceptCopy) {
          alert("먼저 'Key 컨셉 & 대표 문구'를 입력해 주세요!");
          return;
        }
        setIsGeneratingImg(true);
        if (!showPreviewModal) setShowPreviewModal(true); 

        try {
          const response = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "generateImage",
              product: campaignMeta.product,
              conceptCopy: campaignMeta.conceptCopy
            })
          });
          
          const rawText = await response.text();
          if (rawText.trim().startsWith('<!DOCTYPE') || rawText.trim().startsWith('<html')) {
            throw new Error("서버 응답 지연(HTML 수신)");
          }
          const resData = JSON.parse(rawText);
          if (resData.status === "success" && resData.url) {
            setPreviewImageUrl(resData.url);
          } else {
            alert("⚠️ 이미지 생성 실패: " + resData.message);
            setShowPreviewModal(false);
          }
        } catch (error) {
          console.error(error);
          alert("⚠️ 서버와 통신하는 중 에러가 발생했습니다: " + error.message);
          setShowPreviewModal(false);
        } finally {
          setIsGeneratingImg(false);
        }
      };

      const applyGeneratedImage = () => {
        setCampaignMeta(prev => ({ ...prev, mainImageUrl: previewImageUrl }));
        setShowPreviewModal(false);
        setPreviewImageUrl('');
      };

      const cancelGeneratedImage = () => {
        setShowPreviewModal(false);
        setPreviewImageUrl('');
      };
      
      const handleMetaChange = (e) => {
        const { name, value } = e.target;
        if (name === 'department') localStorage.setItem('myDepartment', value);
        if (name === 'marketer') localStorage.setItem('myMarketerName', value);
        setCampaignMeta(prev => ({ ...prev, [name]: value }));
      };

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isLoading]);

      const handleSendMessage = async (customText = null) => {
        const textToSend = typeof customText === 'string' ? customText : inputValue.trim();
        if (!textToSend || isLoading) return;
        if (typeof customText !== 'string') setInputValue('');
        
        const newHistory = [...chatHistory, { id: `msg-${Date.now()}`, sender: 'user', text: textToSend }];
        setChatHistory(newHistory);
        setIsLoading(true);

        try {
          const proxyUrl = "https://btv-proxy.alcheminos.workers.dev";
          
          const cleanHistory = newHistory
            .filter(msg => !String(msg.id).startsWith('msg-init'))
            .map(msg => ({
              sender: msg.sender,
              text: msg.text
            }));

          let resData = null;
          let isSuccess = false;
          let lastError = "";

          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const response = await fetch(proxyUrl, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'chatWithGemini', history: cleanHistory, currentState: campaignMeta })
              });

              if (!response.ok) throw new Error("HTTP 통신 에러: " + response.status);

              const rawText = await response.text();
              if (rawText.trim().startsWith('<!DOCTYPE') || rawText.trim().startsWith('<html')) {
                throw new Error("프록시 지연으로 HTML 에러 페이지가 수신되었습니다.");
              }

              resData = JSON.parse(rawText);
              if (resData.status !== 'success') throw new Error(resData.message || "서버 로직 에러");
              
              isSuccess = true;
              break;
            } catch (err) {
              lastError = err.message;
              if (attempt < 3) await new Promise(r => setTimeout(r, 1500));
            }
          }

          if (!isSuccess) throw new Error("서버 혼잡이 심합니다. 잠시 후 다시 시도해주세요. (" + lastError + ")");

          let displayAiText = (resData.text || "").trim();
          
          if (resData.action === "UPDATE_STATE" && resData.rawGasData) {
            setCampaignMeta(prev => ({ ...prev, ...resData.rawGasData }));
          }
          else if (resData.action === "CREATE_CAMPAIGN_ASSETS" && resData.rawGasData) {
            const metaData = resData.rawGasData.meta || {};
            const generatedAssets = resData.rawGasData.assets || [];
          
            if (generatedAssets.length === 0) {
              displayAiText = "🚨 앗, 배너 시안 데이터를 생성하는 중에 문제가 발생했어요. (서버 스키마 에러 의심)\n번거로우시겠지만 '다시 생성해줘'라고 한 번 더 말씀해 주시겠어요?";
            } else {
              if (Array.isArray(metaData.bannerTypes)) metaData.bannerTypes = metaData.bannerTypes.join(', ');
              if (Array.isArray(metaData.gnbLocations)) metaData.gnbLocations = metaData.gnbLocations.join(', ');
              metaData.bannerPlan = generatedAssets.map(a => ({
                name: a.name || a.type,
                gnb: Array.isArray(a.data?.gnb) ? a.data.gnb.join(', ') : (a.data?.gnb || '')
              }));
              setCampaignMeta(prev => ({ 
                ...prev, 
                ...metaData,
                mainImageUrl: prev.mainImageUrl || metaData.mainImageUrl || '',
                department: prev.department || metaData.department || localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
                marketer: prev.marketer || metaData.marketer || localStorage.getItem('myMarketerName') || '',
                cycle: prev.cycle || metaData.cycle || '단발성'
              }));
          
              setPendingAiPayload({
                action: "CREATE_CAMPAIGN_ASSETS",
                mermaidCode: resData.mermaidCode || "",
                rawGasData: resData.rawGasData
              });
          
              if (!displayAiText) {
                displayAiText = "매니저님, 우측 **'비주얼 유저플로우 시뮬레이터'**에 플로우차트가 렌더링되었습니다! 확인해 보시고, 하단의 **[Step 3. 프로모션 시안 편집 이동 〉]** 버튼을 눌러주세요.";
              }
            }
          }
          
          if (!displayAiText) {
            displayAiText = resData.action === "UPDATE_STATE" 
              ? "네, 반영했습니다. 다음으로 어떤 정보를 알려주시겠어요?" 
              : "우측 기획 정보가 업데이트되었습니다!";
          }
          
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: displayAiText }]);

        } catch (error) {
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: "🚨 통신 에러 발생: " + error.message }]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleRequestCreateFromForm = () => {
        if (!campaignMeta.campaignName || !campaignMeta.product || !campaignMeta.startDate || !campaignMeta.dueDate || !campaignMeta.conceptCopy) {
          alert("⚠️ 시안을 생성하려면 먼저 필수 기획 정보(캠페인명, 대상 상품, 시작/종료일, Key 컨셉)를 모두 입력해 주세요.");
          return;
        }
        if (!campaignMeta.department || !campaignMeta.marketer) {
          alert("⚠️ 캠페인 스케줄 반영을 위해 '요청 부서'와 '담당자 이름'을 입력해 주세요.");
          return;
        }
        if (campaignMeta.target === 'TARGET' && !campaignMeta.targetSize) {
          alert("⚠️ TARGET 프로모션은 '타겟 모수'를 입력해 주세요.");
          return;
        }
        handleSendMessage("우측 폼에 입력된 기획 정보를 바탕으로 최종 배너 시안(에셋) 데이터와 유저플로우를 바로 생성해줘.");
      };

      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } };

      const displayMermaid = pendingAiPayload?.mermaidCode 
                          || pendingAiPayload?.rawGasData?.mermaidCode 
                          || campaignMeta?.mermaidCode 
                          || mermaidCode;

      return (
        <div className="flex h-full w-full bg-[#06070a] overflow-hidden p-6 gap-6">
          {/* 1단: 좌측 챗봇 (33%) */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[320px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-7 h-7 rounded-full bg-[#4f3df6]/20 flex items-center justify-center"><Bot size={16} className="text-[#7387ff]" /></div>
                <h2 className="text-white font-bold text-[15px] tracking-tight">Step 2. AI 캠페인 기획</h2>
              </div>
            </div>
            
            <div className="flex-1 overflow-y-auto p-5 space-y-6 custom-scrollbar">
              {chatHistory.map((msg) => (
                <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  {msg.sender === 'ai' && <div className="w-7 h-7 rounded-full bg-[#262833] flex items-center justify-center mr-2 shrink-0"><Bot size={14} className="text-slate-300" /></div>}
                  {msg.sender === 'user' ? (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#4f3df6] text-white rounded-br-none shadow-[0_4px_15px_rgba(79,61,246,0.3)] whitespace-pre-wrap">
                      {msg.text}
                    </div>
                  ) : (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#1a1c26] text-slate-200 border border-[#303340] rounded-bl-none shadow-md ai-chat-body" dangerouslySetInnerHTML={{ __html: typeof window.marked !== 'undefined' ? window.marked.parse(msg.text) : msg.text }} />
                  )}
                </div>
              ))}
              {isLoading && (
                <div className="flex justify-start items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-[#262833] flex items-center justify-center shrink-0"><Bot size={14} className="text-slate-300" /></div>
                  <div className="bg-[#1a1c26] border border-[#303340] rounded-2xl rounded-bl-none px-4 py-3 flex items-center gap-2">
                    <Loader2 size={14} className="text-[#7387ff] animate-spin" />
                    <span className="text-xs text-slate-400 font-medium">슬롯 여유도 확인 및 시안 동기화 중...</span>
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>
            <div className="p-3 bg-[#12141c] border-t border-[#262833]">
              <div className="relative flex items-end bg-[#0a0812] border border-[#303340] rounded-xl overflow-hidden focus-within:border-[#4f3df6] transition-colors">
                <textarea value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyDown={handleKeyDown} placeholder="프로모션 목적이나 타겟을 편하게 말씀해 주세요." className="flex-1 max-h-[120px] min-h-[48px] bg-transparent text-white placeholder-slate-500 px-4 py-3 outline-none resize-none custom-scrollbar text-xs" rows={1} />
                <button onClick={() => handleSendMessage()} disabled={!inputValue.trim() || isLoading} className="mb-1.5 mr-1.5 p-2 rounded-lg bg-[#4f3df6] text-white hover:bg-[#6252ff] disabled:bg-[#262833] disabled:text-slate-500 transition-colors shrink-0"><Send size={16} /></button>
              </div>
            </div>
          </div>

          {/* 2단: 중앙 기획 폼 */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[350px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between shrink-0">
              <h3 className="text-white font-bold text-[15px] tracking-tight flex items-center gap-2"><Settings size={16} className="text-pink-400" /> 캠페인 기획 폼</h3>
              <div className="flex items-center gap-2">
                <span className="text-[9px] text-slate-400 bg-[#1a1c26] px-2 py-0.5 rounded border border-[#303340] animate-pulse">AI 실시간 동기화</span>
                <button
                  type="button"
                  onClick={handleResetPlanner}
                  title="기획 폼 및 대화 초기화"
                  className="flex items-center gap-1 px-2 py-1 rounded bg-[#1a1c26] hover:bg-red-500/20 text-slate-300 hover:text-red-300 border border-[#303340] text-[10px] font-bold transition-colors"
                >
                  <RotateCcw size={11} /> 초기화
                </button>
