                            <div className={`h-[32px] px-3 flex justify-between items-center relative ${activeTabId === asset.id ? 'bg-[#4f3df6]' : 'bg-[#12141c]'}`}>
                              <span className={`text-[10px] font-bold truncate pr-4 ${activeTabId === asset.id ? 'text-white' : 'text-slate-300'}`}>{asset.name}</span>
                              <button onClick={(e) => removeAsset(asset.id, e)} className={`absolute right-2 opacity-0 group-hover:opacity-100 p-1 rounded-full transition-all ${activeTabId === asset.id ? 'hover:bg-white/20 text-white' : 'hover:bg-red-500/20 text-red-400'}`}>
                                <Trash2 size={10}/>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}

          </main>

          {/* 시안 편집 화면용 유저플로우(Mermaid) 확인 및 코드 편집 모달 */}
          {isFlowModalOpen && (
            <InteractiveFlowEditorModal
              mermaidCode={mermaidCode}
              setMermaidCode={setMermaidCode}
              onClose={() => setIsFlowModalOpen(false)}
            />
          )}

          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in zoom-in-95 duration-200">
              <div className="bg-[#12141c] w-[500px] border border-[#262833] rounded-2xl shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/10">
                <div className="p-5 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                  <h3 className="text-base font-black text-white flex items-center gap-2"><Settings size={18} className="text-[#4f3df6]"/> 시스템 설정 (Admin)</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={16}/></button>
                </div>
                
                <div className="p-6 space-y-6 bg-[#0a0812] max-h-[70vh] overflow-y-auto custom-scrollbar">
                  <div className="space-y-3">
                    <h4 className="text-xs font-bold text-[#7387ff] flex items-center gap-1.5"><User size={14}/> 내 계정 및 마케터 정보 연동</h4>
                    <div className="bg-[#1a1c26] p-4 rounded-xl border border-[#262833] space-y-3">
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-1">기본 담당자 Jira ID (이메일)</label>
                        <input type="text" defaultValue={localStorage.getItem('myJiraId') || ''} onBlur={(e) => localStorage.setItem('myJiraId', e.target.value.trim())} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none" placeholder="example@sk.com" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[10px] text-slate-400 mb-1">기본 요청 부서</label>
                          <input type="text" defaultValue={localStorage.getItem('myDepartment') || 'Btv큐레이션팀'} onBlur={(e) => localStorage.setItem('myDepartment', e.target.value.trim())} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none" placeholder="Btv큐레이션팀" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-400 mb-1">담당자 이름</label>
                          <input type="text" defaultValue={localStorage.getItem('myMarketerName') || ''} onBlur={(e) => localStorage.setItem('myMarketerName', e.target.value.trim())} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none" placeholder="홍길동" />
                        </div>
                      </div>
                      <p className="text-[9px] text-slate-500">* Jira 일감 할당 및 캠페인 스케줄 대시보드 통계/이력 조회 시 기본값으로 사용됩니다.</p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <h4 className="text-xs font-bold text-pink-400 flex items-center gap-1.5"><Users size={14}/> GNB별 자동 멘션 (편집 가능)</h4>
                    <p className="text-[10px] text-slate-400 leading-snug">
                      현재 Config 시트에서 불러온 담당자 매핑 정보입니다. 내용을 수정하면 이번 세션의 하위 일감(Sub-task) 담당자 할당에 즉시 반영됩니다.
                    </p>
                    
                    <div className="bg-[#1a1c26] rounded-xl border border-[#262833] overflow-hidden">
                      <div className="grid grid-cols-3 gap-0 text-[10px] bg-[#262833] text-slate-300 font-bold">
                        <div className="p-2.5 text-center border-r border-[#1a1c26]">GNB 명칭</div>
                        <div className="col-span-2 grid grid-cols-2 gap-2 p-2.5 text-center">
                          <div>담당자 이름</div>
                          <div>Jira ID</div>
                        </div>
                      </div>
                      
                      {Object.entries(configMap).map(([gnbName, info], i) => (
                        <div key={i} className="grid grid-cols-3 gap-0 text-xs border-t border-[#262833] items-center">
                          <div className="p-2.5 text-center border-r border-[#262833] text-slate-400 font-bold">
                            {gnbName}
                          </div>
                          <div className="col-span-2 grid grid-cols-2 gap-2 p-2">
                            <input 
                              type="text" 
                              placeholder="이름"
                              value={info.name || ''} 
                              onChange={(e) => handleConfigChange(gnbName, 'name', e.target.value)}
                              className="w-full bg-[#0a0812] border border-[#303340] rounded-md px-2 py-1.5 text-white outline-none focus:border-[#4f3df6] transition-colors" 
                            />
                            <input 
                              type="text" 
                              placeholder="Jira ID"
                              value={info.jiraId || ''} 
                              onChange={(e) => handleConfigChange(gnbName, 'jiraId', e.target.value)}
                              className="w-full bg-[#0a0812] border border-[#303340] rounded-md px-2 py-1.5 text-white outline-none focus:border-[#4f3df6] transition-colors" 
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                
                <div className="p-4 border-t border-[#262833] bg-[#0f111a] flex justify-end">
                  <button onClick={handleSaveConfig} className="px-6 py-2 bg-[#4f3df6] hover:bg-[#6252ff] text-white rounded-lg text-xs font-bold transition-all shadow-lg">저장 및 닫기</button>
                </div>
              </div>
            </div>
          )}

          {isAddAssetModalOpen && (
            <div className="fixed inset-0 bg-[#0a0812]/95 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-in zoom-in-95 duration-200">
              <div className="bg-[#12141c] w-[900px] border border-[#262833] rounded-3xl shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/10">
                <div className="p-6 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                  <h3 className="text-xl font-black text-white flex items-center gap-2"><LayoutTemplate size={22} className="text-[#4f3df6]"/> Select Template</h3>
                  <button onClick={() => setIsAddAssetModalOpen(false)} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={20}/></button>
                </div>
                <div className="p-8 grid grid-cols-2 lg:grid-cols-3 gap-5 max-h-[70vh] overflow-y-auto custom-scrollbar bg-[#0a0812]">
                  {BANNER_SPECS.map((spec) => (
                    <div key={spec.type} onClick={() => addAsset(spec.type, spec.name)} className="bg-[#1a1c26] border border-[#262833] rounded-2xl p-6 cursor-pointer hover:border-[#4f3df6] hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(79,61,246,0.2)] transition-all flex flex-col h-full group">
                      <div className="flex items-start justify-between mb-4"><div className="p-3 bg-[#0a0812] border border-[#303340] rounded-xl text-[#7387ff] group-hover:bg-[#4f3df6] group-hover:border-[#4f3df6] group-hover:text-white transition-colors"><spec.icon size={24} /></div><span className="text-[10px] font-bold bg-[#0a0812] border border-[#303340] text-slate-400 px-2 py-1 rounded-md font-mono">{spec.ratio}</span></div>
                      <h4 className="text-lg font-bold text-white mb-1 group-hover:text-[#7387ff] transition-colors">{spec.name}</h4>
                      <p className="text-xs text-slate-500 leading-relaxed mt-auto pt-4 border-t border-[#262833]">{spec.desc}</p>
                    </div>
                  ))}

                  {sheetBannerSpecs
                    .filter(s => s.type === 'CUSTOM_BANNER' || !BANNER_SPECS.some(b => b.name.replace(/\s+/g, '') === s.bannerName.replace(/\s+/g, '')))
                    .map((s) => (
                      <div key={s.id} onClick={() => addAsset(s.type, s.bannerName)} className="bg-[#1a1c26] border border-[#262833] rounded-2xl p-6 cursor-pointer hover:border-[#32d782] hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(50,215,130,0.15)] transition-all flex flex-col h-full group">
                        <div className="flex items-start justify-between mb-4">
                          <div className="p-3 bg-[#0a0812] border border-[#303340] rounded-xl text-[#32d782] group-hover:bg-[#32d782] group-hover:text-black transition-colors"><Sparkles size={24} /></div>
                          <span className="text-[10px] font-bold bg-[#0a0812] border border-[#303340] text-[#32d782] px-2 py-1 rounded-md">시트 연동 ({String(s.targetable).includes('불가') ? 'MASS전용' : '타겟가능'})</span>
                        </div>
                        <h4 className="text-lg font-bold text-white mb-1 group-hover:text-[#32d782] transition-colors">{s.bannerName}</h4>
                        <p className="text-[11px] text-slate-400 leading-relaxed mb-3 line-clamp-2">{s.feature}</p>
                        <p className="text-[10px] text-slate-500 leading-snug mt-auto pt-3 border-t border-[#262833] whitespace-pre-wrap">{s.textSpec}</p>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
