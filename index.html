            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',

            if(containerRef.current) containerRef.current.innerHTML = svg;
          }).catch(e => console.error("Mermaid Render Error:", e));

    const DEFAULT_GENERAL_SET_BANNER = {

        { heroTitle: '세트 2 좌상단 타이틀', heroSub: '세트 2에 대한 서브 설명글', heroImg: '', cardCopy: '카드 2 타이틀', cardImg: '', landingValue: 'UI_PATH: /set2' },
        { heroTitle: '세트 3 좌상단 타이틀', heroSub: '세트 3에 대한 서브 설명글', heroImg: '', cardCopy: '카드 3 타이틀', cardImg: '', landingValue: 'UI_PATH: /set3' }
      ],

    };

    const DEFAULT_PROMO_POPUP = { imageUrl: '', buttonText: '바로가기', closeText: '닫기', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };

    const DraggableMemo = ({ memo, updateMemo, removeMemo }) => {
      const [pos, setPos] = useState({ x: memo.x || 50, y: memo.y || 50 });
      const isDragging = useRef(false);
      const dragStart = useRef({ mouseX: 0, mouseY: 0, boxX: 0, boxY: 0 });

      useEffect(() => { setPos({ x: memo.x || 50, y: memo.y || 50 }); }, [memo.x, memo.y]);

      const handleMouseDown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        e.preventDefault(); e.stopPropagation();
        isDragging.current = true;
        dragStart.current = { mouseX: e.clientX, mouseY: e.clientY, boxX: pos.x, boxY: pos.y };

        const handleMouseMove = (ev) => {
          if (!isDragging.current) return;
          ev.preventDefault();
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          setPos({ x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
        };

        const handleMouseUp = (ev) => {
          if (!isDragging.current) return;
          isDragging.current = false;
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          updateMemo(memo.id, { x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove, { passive: false });
        document.addEventListener('mouseup', handleMouseUp);
      };

      return (
        <div 
          onMouseDown={handleMouseDown}
          className="absolute bg-yellow-300/95 backdrop-blur-sm px-4 py-3 rounded-xl shadow-2xl border border-yellow-400 min-w-[200px] max-w-[300px] transition-shadow hover:shadow-[0_0_20px_rgba(250,204,21,0.6)] cursor-move z-50 pointer-events-auto"
          style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`, left: 0, top: 0, willChange: 'transform' }}
        >
          <div className="flex items-center justify-between gap-4 mb-2 pointer-events-none">
            <div className="flex items-center gap-1.5 text-yellow-800 font-bold text-[10px]"><MessageSquare size={12}/> 시안 메모</div>
            <button onMouseDown={(e) => e.stopPropagation()} onClick={() => removeMemo(memo.id)} className="pointer-events-auto text-yellow-700 hover:text-red-600 hover:bg-yellow-400 p-1 rounded-full transition-colors"><X size={12}/></button>
          </div>
          <textarea 
            onMouseDown={(e) => e.stopPropagation()}
            value={memo.text} 
            onChange={(e) => updateMemo(memo.id, { text: e.target.value })}
            className="w-full bg-yellow-100/50 border border-yellow-400/30 rounded p-2 text-xs text-yellow-900 font-bold outline-none resize-none focus:bg-white focus:ring-1 focus:ring-yellow-500 custom-scrollbar h-[60px] cursor-text pointer-events-auto"
            placeholder="여기에 메모를 입력하세요..."
          />
        </div>
      );
    };

    const OverlayMemos = ({ block, onUpdate }) => {
      const memos = block.data?.memos || [];
      if (memos.length === 0) return null;

      const updateMemo = (id, updates) => {

              <div className="flex flex-row items-center gap-3 h-[80px]">
                <div className="h-full px-10 bg-[#222530] text-white rounded-xl font-bold text-lg shadow-xl flex items-center justify-center select-none shrink-0">구매하기</div>
                <div className="h-full px-10 bg-[#222530] text-slate-300 border border-white/5 rounded-xl font-bold text-lg flex items-center justify-center select-none shrink-0">예고편 보기</div>
                <div className="h-full w-[280px] bg-gradient-to-r from-[#1a1a1a] to-[#2a2a2a] rounded-xl relative overflow-hidden shadow-[0_10px_40px_rgba(0,0,0,0.5)] border-[3px] border-[#7387FF] flex items-center justify-between px-5 shrink-0 z-10">
                  <div className="absolute -bottom-10 -right-10 w-[100px] h-[100px] bg-[#7387FF]/10 blur-2xl rounded-full pointer-events-none"></div>

                    <h2 className="text-white font-extrabold text-lg tracking-tight whitespace-pre-wrap leading-tight drop-shadow-md">{block.data?.mainTitle || '메인 문구 입력'}</h2>

                        <span className="text-[#111] font-black text-[10px] whitespace-pre-wrap leading-snug">{block.data?.badgeText || '뱃지'}</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (block.type === 'PROMO_POPUP') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0 flex items-center justify-center">
            <div className="bg-[#26272e] p-5 rounded-xl shadow-[0_20px_60px_rgba(0,0,0,0.8)] flex flex-col w-[680px] z-10">
              <div className="relative w-full aspect-[16/9] bg-[#0c0920] rounded-lg overflow-hidden mb-6 shadow-inner">
                <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
                  {!checkIsUrl(block.data?.imageUrl) && <div className="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-[#1a1359] to-[#0a0812]"><ImageIcon size={64} className="text-white/10" /></div>}
                  <FallbackText text={block.data?.imageUrl} />
                </div>
              </div>
              <div className="flex justify-center gap-3 w-full pb-2">
                <div className="w-[240px] py-3.5 bg-[#401ce8] text-white rounded-lg font-extrabold text-xl flex items-center justify-center shadow-[0_4px_15px_rgba(64,28,232,0.4)] tracking-tight">{block.data?.buttonText || '바로가기'}</div>
                <div className="w-[240px] py-3.5 bg-[#1f2026] text-slate-200 rounded-lg font-bold text-xl flex items-center justify-center tracking-tight shadow-md">{block.data?.closeText || '닫기'}</div>
              </div>
            </div>
          </div>
        );
      }

      if (block.type === 'MINI_EPG_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] max-w-[1000px] bg-[#0c0d14] rounded-lg overflow-hidden shadow-2xl shrink-0 mt-4">
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0"><span className="text-white/[0.03] font-black text-[180px] tracking-[0.2em] select-none">LIVE</span></div>
            <div className="absolute bottom-[8%] left-[5%] right-[5%] h-[140px] bg-transparent rounded-lg shadow-2xl flex items-center p-4 backdrop-blur-md z-10 gap-6">
              <div className="h-full aspect-[1.48/1] bg-[#0a0a0f] rounded-md relative overflow-hidden border-[2px] border-[#7387FF] shadow-[0_0_20px_rgba(255,255,255,0.2)] shrink-0 flex items-center justify-center">
                <div className="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform z-0" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
                  {!checkIsUrl(block.data?.imageUrl) && <ImageIcon size={32} className="text-white/20"/>}
                </div>
                <div className="absolute inset-x-0 bottom-0 h-[45%] bg-gradient-to-t from-black/90 to-transparent pointer-events-none z-10"></div>
                <div className="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 z-20">
                  <div className="bg-white text-[#111] font-black text-[11px] px-2.5 py-0.5 rounded-[12px] shadow-md tracking-tighter">OK</div><div className="text-white font-extrabold text-[15px] tracking-tight drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">{block.data?.buttonText || '감상하기'}</div>
                </div>
                <FallbackText text={block.data?.imageUrl} />
              </div>
              <div className="flex-1 h-full flex flex-col justify-center pb-2">
                <div className="flex items-center gap-2 mb-1 text-[#5ea3ff] font-bold text-[15px] tracking-wider"><span>003 ★</span><span>tvN</span></div>
                <h3 className="text-white font-black text-[1.9rem] drop-shadow-md mb-2 truncate leading-tight">벌거벗은 세계사 206회 <span className="text-[10px] bg-white/20 px-1 py-0.5 rounded ml-1 align-middle">ALL</span></h3>
                <div className="flex items-center gap-3 w-full border-t border-white/20 pt-2">
                  <span className="text-slate-300 text-[13px] font-bold">14:00</span>
                  <div className="w-[150px] h-[3px] bg-[#333] rounded-full overflow-hidden"><div className="w-[60%] h-full bg-[#5ea3ff]"></div></div>
                  <span className="text-slate-400 text-[12px] font-bold">16:00 | 현재 시각 15:32</span>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (block.type === 'LONG_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0 flex items-center justify-center">
            <div className="absolute inset-0 p-12 flex justify-center gap-4 z-0 bg-[#0a0a0f]">
              <div className="h-[90%] aspect-[129/181.5] bg-[#1a1c26] rounded-xl overflow-hidden relative shadow-[0_10px_30px_rgba(0,0,0,0.8)] border-[3px] border-[#7387FF] shrink-0">
                <div className="absolute inset-0 bg-cover bg-top bg-no-repeat z-10" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
                  {!checkIsUrl(block.data?.imageUrl) && !checkHasText(block.data?.imageUrl) && <div className="absolute inset-0 flex items-center justify-center bg-[#0a0a0f]"><ImageIcon size={48} className="text-white/10"/></div>}
                  <FallbackText text={block.data?.imageUrl} alignClass="justify-center items-center text-center px-4" />
                </div>
                <div className="absolute bottom-0 inset-x-0 p-6 bg-gradient-to-t from-black via-black/80 to-transparent z-20 text-center flex flex-col justify-end h-[40%]">
                  <p className="text-white font-extrabold text-xl leading-tight drop-shadow-md whitespace-pre-wrap">{block.data?.copy || '메인 카피 입력'}</p>
                  {block.data?.subTitle && <p className="text-slate-300 font-medium text-xs mt-2 whitespace-pre-wrap">{block.data.subTitle}</p>}
                </div>
              </div>
              {[1, 2].map(i => (
                <div key={i} className="h-[90%] aspect-[129/181.5] bg-[#222530] rounded-xl border border-white/5 shadow-lg shrink-0 flex items-center justify-center relative overflow-hidden">
                   <ImageIcon size={48} className="text-white/5" />
                </div>
              ))}
            </div>
          </div>
        );
      }
    };

    const parseAndFormatKoreanNumber = (str) => {
      if (!str) return '';
      let cleanStr = String(str).replace(/,/g, '').replace(/명/g, '').replace(/원/g, '').trim();
      let multiplier = 1;
      if (cleanStr.includes('만')) { multiplier = 10000; cleanStr = cleanStr.replace('만', ''); }
      else if (cleanStr.includes('천')) { multiplier = 1000; cleanStr = cleanStr.replace('천', ''); }
      const num = parseFloat(cleanStr);
      if (isNaN(num)) return str; 
      return (num * multiplier).toLocaleString();
    };

    const getUniqueAssetName = (existingNames, baseName) => {
      if (!existingNames.includes(baseName)) return baseName;
      let n = 2;
      while (existingNames.includes(`${baseName} (${n})`)) n++;
      return `${baseName} (${n})`;
    };

    // ====================================================================================
    // 🌟 AI 프로모션 기획 뷰 (요청 부서, 담당자 이름, 주기성 여부 필드 포함)
    // ====================================================================================
    const AiPlannerView = ({ campaignMeta, setCampaignMeta, chatHistory, setChatHistory, assets, mermaidCode, onMoveToEditor }) => {
      const [inputValue, setInputValue] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [pendingAiPayload, setPendingAiPayload] = useState(null); 
      const chatEndRef = useRef(null);

      const [isGeneratingImg, setIsGeneratingImg] = useState(false);
      const [previewImageUrl, setPreviewImageUrl] = useState('');
      const [showPreviewModal, setShowPreviewModal] = useState(false);

      const handleTargetSizeBlur = (e) => {
        setCampaignMeta(prev => ({ ...prev, targetSize: parseAndFormatKoreanNumber(e.target.value) }));
      };

      const handleOpenImagePreview = () => {
        if (campaignMeta.mainImageUrl) {
          setPreviewImageUrl(campaignMeta.mainImageUrl);
          setShowPreviewModal(true);
          return;
        }
        handleGenerateImage();
      };
      
      const handleGenerateImage = async () => {
        if (!campaignMeta.conceptCopy) {
          alert("먼저 'Key 컨셉 & 대표 문구'를 입력해 주세요!");
          return;
        }
        setIsGeneratingImg(true);
        if (!showPreviewModal) setShowPreviewModal(true); 

        try {
          const response = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "generateImage",
              product: campaignMeta.product,
              conceptCopy: campaignMeta.conceptCopy
            })
          });
          
          const rawText = await response.text();
          if (rawText.trim().startsWith('<!DOCTYPE') || rawText.trim().startsWith('<html')) {
            throw new Error("서버 응답 지연(HTML 수신)");
          }
          const resData = JSON.parse(rawText);
          if (resData.status === "success" && resData.url) {
            setPreviewImageUrl(resData.url);
          } else {
            alert("⚠️ 이미지 생성 실패: " + resData.message);
            setShowPreviewModal(false);
          }
        } catch (error) {
          console.error(error);
          alert("⚠️ 서버와 통신하는 중 에러가 발생했습니다: " + error.message);
          setShowPreviewModal(false);
        } finally {
          setIsGeneratingImg(false);
        }
      };

      const applyGeneratedImage = () => {
        setCampaignMeta(prev => ({ ...prev, mainImageUrl: previewImageUrl }));
        setShowPreviewModal(false);
        setPreviewImageUrl('');
      };

      const cancelGeneratedImage = () => {
        setShowPreviewModal(false);
        setPreviewImageUrl('');
      };
      
      const handleMetaChange = (e) => {
        const { name, value } = e.target;
        if (name === 'department') localStorage.setItem('myDepartment', value);
        if (name === 'marketer') localStorage.setItem('myMarketerName', value);
        setCampaignMeta(prev => ({ ...prev, [name]: value }));
      };

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isLoading]);

      const handleSendMessage = async (customText = null) => {
        const textToSend = typeof customText === 'string' ? customText : inputValue.trim();
        if (!textToSend || isLoading) return;
        if (typeof customText !== 'string') setInputValue('');
        
        const newHistory = [...chatHistory, { id: `msg-${Date.now()}`, sender: 'user', text: textToSend }];
        setChatHistory(newHistory);
        setIsLoading(true);

        try {
          const proxyUrl = "https://btv-proxy.alcheminos.workers.dev";
          
          const cleanHistory = newHistory
            .filter(msg => msg.id !== 'msg-init')
            .map(msg => ({
              sender: msg.sender,
              text: msg.text
            }));

          let resData = null;
          let isSuccess = false;
          let lastError = "";

          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const response = await fetch(proxyUrl, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'chatWithGemini', history: cleanHistory, currentState: campaignMeta })
              });

              if (!response.ok) throw new Error("HTTP 통신 에러: " + response.status);

              const rawText = await response.text();
              if (rawText.trim().startsWith('<!DOCTYPE') || rawText.trim().startsWith('<html')) {
                console.error("🚨 [서버 반환 HTML 원본]:", rawText);
                throw new Error("프록시 지연으로 HTML 에러 페이지가 수신되었습니다.");
              }

              resData = JSON.parse(rawText);
              if (resData.status !== 'success') throw new Error(resData.message || "서버 로직 에러");
              
              isSuccess = true;
              break;
            } catch (err) {
              lastError = err.message;
              console.warn(`[통신 튐 방어] ${attempt}차 시도 실패, 1.5초 후 재시도합니다...`, lastError);
              if (attempt < 3) await new Promise(r => setTimeout(r, 1500));
            }
          }

          if (!isSuccess) throw new Error("서버 혼잡이 심합니다. 잠시 후 다시 시도해주세요. (" + lastError + ")");

          let displayAiText = (resData.text || "").trim();
          
          if (resData.action === "UPDATE_STATE" && resData.rawGasData) {
            setCampaignMeta(prev => ({ ...prev, ...resData.rawGasData }));
          }
          else if (resData.action === "CREATE_CAMPAIGN_ASSETS" && resData.rawGasData) {
            const metaData = resData.rawGasData.meta || {};
            const generatedAssets = resData.rawGasData.assets || [];
          
            if (generatedAssets.length === 0) {
              displayAiText = "🚨 앗, 배너 시안 데이터를 생성하는 중에 문제가 발생했어요. (서버 스키마 에러 의심)\n번거로우시겠지만 '다시 생성해줘'라고 한 번 더 말씀해 주시겠어요?";
            } else {
              if (Array.isArray(metaData.bannerTypes)) metaData.bannerTypes = metaData.bannerTypes.join(', ');
              if (Array.isArray(metaData.gnbLocations)) metaData.gnbLocations = metaData.gnbLocations.join(', ');
              metaData.bannerPlan = generatedAssets.map(a => ({
                name: a.name || a.type,
                gnb: Array.isArray(a.data?.gnb) ? a.data.gnb.join(', ') : (a.data?.gnb || '')
              }));
              // 🌟 폼에서 입력한 부서, 담당자, 대표 이미지가 덮어써지지 않도록 보존
              setCampaignMeta(prev => ({ 
                ...prev, 
                ...metaData,
                mainImageUrl: prev.mainImageUrl || metaData.mainImageUrl || '',
                department: prev.department || metaData.department || localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
                marketer: prev.marketer || metaData.marketer || localStorage.getItem('myMarketerName') || '',
                cycle: prev.cycle || metaData.cycle || '단발성'
              }));
          
              setPendingAiPayload({
                action: "CREATE_CAMPAIGN_ASSETS",
                mermaidCode: resData.mermaidCode || "",
                rawGasData: resData.rawGasData
              });
          
              if (!displayAiText) {
                displayAiText = "매니저님, 우측 **'비주얼 유저플로우 시뮬레이터'**에 플로우차트가 렌더링되었습니다! 확인해 보시고, 하단의 **[완성된 기획안으로 시안 편집 이동 〉]** 버튼을 눌러주세요.";
              }
            }
          }
          
          if (!displayAiText) {
            displayAiText = resData.action === "UPDATE_STATE" 
              ? "네, 반영했습니다. 다음으로 어떤 정보를 알려주시겠어요?" 
              : "우측 기획 정보가 업데이트되었습니다!";
          }
          
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: displayAiText }]);

        } catch (error) {
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: "🚨 통신 에러 발생: " + error.message }]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleRequestCreateFromForm = () => {
        if (!campaignMeta.campaignName || !campaignMeta.product || !campaignMeta.startDate || !campaignMeta.dueDate || !campaignMeta.conceptCopy) {
          alert("⚠️ 시안을 생성하려면 먼저 필수 기획 정보(캠페인명, 대상 상품, 시작/종료일, Key 컨셉)를 모두 입력해 주세요.");
          return;
        }
        if (!campaignMeta.department || !campaignMeta.marketer) {
          alert("⚠️ 캠페인 스케줄 반영을 위해 '요청 부서'와 '담당자 이름'을 입력해 주세요.");
          return;
        }
        if (campaignMeta.target === 'TARGET' && !campaignMeta.targetSize) {
          alert("⚠️ TARGET 프로모션은 '타겟 모수'를 입력해 주세요.");
          return;
        }
        handleSendMessage("우측 폼에 입력된 기획 정보를 바탕으로 최종 배너 시안(에셋) 데이터와 유저플로우를 바로 생성해줘.");
      };

      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } };

      const displayMermaid = pendingAiPayload?.mermaidCode 
                          || pendingAiPayload?.rawGasData?.mermaidCode 
                          || campaignMeta?.mermaidCode 
                          || mermaidCode;

      return (
        <div className="flex h-full w-full bg-[#06070a] overflow-hidden p-6 gap-6">
          {/* 1단: 좌측 챗봇 (33%) */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[320px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-7 h-7 rounded-full bg-[#4f3df6]/20 flex items-center justify-center"><Bot size={16} className="text-[#7387ff]" /></div>
                <h2 className="text-white font-bold text-[15px] tracking-tight">AI 캠페인 기획</h2>
              </div>
            </div>
            
            <div className="flex-1 overflow-y-auto p-5 space-y-6 custom-scrollbar">
              {chatHistory.map((msg) => (
                <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  {msg.sender === 'ai' && <div className="w-7 h-7 rounded-full bg-[#262833] flex items-center justify-center mr-2 shrink-0"><Bot size={14} className="text-slate-300" /></div>}
                  {msg.sender === 'user' ? (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#4f3df6] text-white rounded-br-none shadow-[0_4px_15px_rgba(79,61,246,0.3)] whitespace-pre-wrap">
                      {msg.text}
                    </div>
                  ) : (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#1a1c26] text-slate-200 border border-[#303340] rounded-bl-none shadow-md ai-chat-body" dangerouslySetInnerHTML={{ __html: typeof window.marked !== 'undefined' ? window.marked.parse(msg.text) : msg.text }} />
                  )}
                </div>
              ))}
              {isLoading && (
                <div className="flex justify-start items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-[#262833] flex items-center justify-center shrink-0"><Bot size={14} className="text-slate-300" /></div>
                  <div className="bg-[#1a1c26] border border-[#303340] rounded-2xl rounded-bl-none px-4 py-3 flex items-center gap-2">
                    <Loader2 size={14} className="text-[#7387ff] animate-spin" />
                    <span className="text-xs text-slate-400 font-medium">AI 기획 및 시안 동기화 중...</span>
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>
            <div className="p-3 bg-[#12141c] border-t border-[#262833]">
              <div className="relative flex items-end bg-[#0a0812] border border-[#303340] rounded-xl overflow-hidden focus-within:border-[#4f3df6] transition-colors">
                <textarea value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyDown={handleKeyDown} placeholder="프로모션 목적이나 타겟을 편하게 말씀해 주세요." className="flex-1 max-h-[120px] min-h-[48px] bg-transparent text-white placeholder-slate-500 px-4 py-3 outline-none resize-none custom-scrollbar text-xs" rows={1} />
                <button onClick={() => handleSendMessage()} disabled={!inputValue.trim() || isLoading} className="mb-1.5 mr-1.5 p-2 rounded-lg bg-[#4f3df6] text-white hover:bg-[#6252ff] disabled:bg-[#262833] disabled:text-slate-500 transition-colors shrink-0"><Send size={16} /></button>
              </div>
            </div>
          </div>

          {/* 2단: 중앙 기획 폼 */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[350px]">

    const ScheduleDashboardView = ({ onStartPlanWithDate }) => {
      const todayObj = new Date();
      const todayLocalStr = new Date(todayObj.getTime() - (todayObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

      const [rawSourceData, setRawSourceData] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isAssigning, setIsAssigning] = useState(false);

      // 필터 상태
      const [typeFilters, setTypeFilters] = useState([]); // ['TV', '토스트팝업', '쿠폰', 'Seg채널']
      const [dateFilters, setDateFilters] = useState(['start']); // ['start', 'end']
      const [excludeWired, setExcludeWired] = useState(false);
      const [onlyUnassigned, setOnlyUnassigned] = useState(false);
      const [searchText, setSearchText] = useState('');
      const [channelBarFilter, setChannelBarFilter] = useState(''); // '' | '배너' | '쿠폰' | 'TV팝업' | '토스트팝업'

      // 우측 상단 Capa 계산기 상태
      const [capaDate, setCapaDate] = useState(todayLocalStr);
      const [capaTarget, setCapaTarget] = useState('');
      const [capaBanner, setCapaBanner] = useState(true);
      const [capaCoupon, setCapaCoupon] = useState(true);

      // 현재 캘린더 기준 연/월 요약 상태
      const [currentCalMonth, setCurrentCalMonth] = useState({ year: todayObj.getFullYear(), month: todayObj.getMonth() });

      // 모달 상태 (상세 정보 / 일자별 요약 / 단순 Capa 신청)
      const [detailModal, setDetailModal] = useState(null); // { type: 'EVENT' | 'DATE', title, data, dateStr }
      const [isReqModalOpen, setIsReqModalOpen] = useState(false);
      const [isSubmittingReq, setIsSubmittingReq] = useState(false);
      const [reqStatusMsg, setReqStatusMsg] = useState('');
      const [marketerSearch, setMarketerSearch] = useState(localStorage.getItem('myMarketerName') || '');
      const [showHistoryList, setShowHistoryList] = useState(false);

      const [reqForm, setReqForm] = useState({
        campaignName: '',
        startDate: todayLocalStr,
        endDate: todayLocalStr,
        uiVersions: ['5.0'],
        channels: ['타겟배너'],
        gnb: '홈',
        cycle: '단발성',
        offerType: '쿠폰',
        totalTarget: '',
        segIdCount: '1개',
        department: localStorage.getItem('myDepartment') || 'Btv큐레이션팀',
        marketer: localStorage.getItem('myMarketerName') || ''
      });

      const calendarNodeRef = useRef(null);
      const calendarInstanceRef = useRef(null);
      const monthlyChartRef = useRef(null);
      const monthlyChartInstanceRef = useRef(null);
      const tooltipRef = useRef(null);
      const filteredEventsRef = useRef([]);
      const rawDataRef = useRef([]);

      // 유틸리티 함수들
      const cleanDateStr = (dateVal) => {
        if (!dateVal) return "";
        let str = String(dateVal).trim();
        if (str.includes("T")) str = str.split("T")[0];
        str = str.replace(/[.\/]/g, "-");
        const parts = str.split("-").map(v => v.trim()).filter(Boolean);
        if (parts.length === 3) {
          let [y, m, d] = parts;
          if (y.length === 2) y = "20" + y;
          return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
        }
        return str;
      };

      const formatTargetNumber = (num) => {
        if (typeof num !== 'number' || isNaN(num) || num === 0) return "0만";
        const sign = num < 0 ? "-" : "";
        const abs = Math.abs(num);
        if (abs >= 10000) return sign + Math.round(abs / 10000).toLocaleString('ko-KR') + "만";
        if (abs >= 1000) return sign + Math.round(abs / 1000).toLocaleString('ko-KR') + "천";
        return sign + Math.round(abs / 100).toLocaleString('ko-KR') + "백";
      };

      const getTargetValue = (item) => {
        if (!item) return 0;
        let targetValue = 0;
        Object.keys(item).forEach(k => {
          const nk = k.replace(/\s+/g, '');
          if (nk === '타겟수' || nk === '타겟수(만)' || nk === '전체타겟수' || nk === '발송모수') {
            const cleanNum = String(item[k]).replace(/[^0-9]/g, '');
            if (cleanNum) targetValue = Number(cleanNum);
          }
        });
        return targetValue;
      };

      const getCouponValue = (item) => {
        const keys = Object.keys(item || {}).filter(k => String(k).replace(/\s+/g, '').toUpperCase().includes('쿠폰'));
        for (const key of keys) {
          const cleanNum = String(item[key]).replace(/[^0-9]/g, '');
          if (cleanNum) return Number(cleanNum);
        }
        return 0;
      };

      const getCampaignTitle = (item) => {
        if (!item) return "제목 없음";
        const direct = item['캠페인명'] || item['캠페인 명'] || item['제목'] || item['Title'];
        if (direct && String(direct).trim()) return String(direct).trim();
        return "제목 없음";
      };

      const isWiredDept = (item) => {
        const dept = item ? String(item['부서'] || '').trim() : '';
        return dept.includes('밸류애드팀') || dept.includes('유선');
      };

      const getDateOffset = (dateStr, offsetDays) => {
        const d = new Date(`${dateStr}T00:00:00`);
        d.setDate(d.getDate() + offsetDays);
        const tzOffset = d.getTimezoneOffset() * 60000;
        return new Date(d.getTime() - tzOffset).toISOString().split('T')[0];
      };

      const getDayLabel = (dateStr) => {
        const d = new Date(`${dateStr}T00:00:00`);
        const days = ['일','월','화','수','목','금','토'];
        return `${dateStr.slice(5).replace('-', '/')}(${days[d.getDay()]})`;
      };

      const getDailyCapa = (type, dateStr) => {
        const d = new Date(`${dateStr}T00:00:00`);
        if (type === 'banner') return d.getDay() === 4 ? 2700000 : 2800000;
        if (type === 'coupon') return 2700000;
        return 0;
      };

      const getDailyUsed = (type, dateStr, sourceArr = rawSourceData, exWired = excludeWired) => {
        return sourceArr.reduce((sum, item) => {
          if (exWired && isWiredDept(item)) return sum;
          const start = cleanDateStr(item['시작일']);
          if (start !== dateStr) return sum;
          const filterText = String(item['필터'] || item['채널'] || '').toUpperCase();
          const offerText = String(item['오퍼분류'] || '').toUpperCase();
          const targetValue = getTargetValue(item);
          if (type === 'banner' && (filterText.includes('SEG') || filterText.includes('배너'))) return sum + targetValue;
          if (type === 'coupon') {
            const couponValue = getCouponValue(item);
            if (filterText.includes('쿠폰') || offerText.includes('쿠폰') || couponValue > 0) return sum + (couponValue || targetValue);
          }
          return sum;
        }, 0);
      };

      // 서버에서 스케줄 데이터 불러오기
      const fetchScheduleData = async () => {
        setIsLoading(true);
        try {
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev?action=getScheduleData");
          const json = await res.json();
          if (json && json.status === 'success' && Array.isArray(json.data)) {
            setRawSourceData(json.data);
            rawDataRef.current = json.data;
          } else if (Array.isArray(json)) {
            setRawSourceData(json);
            rawDataRef.current = json;
          }
        } catch (err) {
          console.error("스케줄 로드 실패:", err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchScheduleData();
      }, []);

      // ⚡ 실행시각 자동배정 트리거
      const handleAssignExecutionTimes = async () => {
        setIsAssigning(true);
        try {
          const res = await fetch("https://btv-proxy.alcheminos.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "assignExecutionTimes" })
          });
          const json = await res.json();
          if (json.status === 'success') {
            if (Array.isArray(json.data)) {
              setRawSourceData(json.data);
              rawDataRef.current = json.data;
            } else {
              await fetchScheduleData();
            }
            const s = json.summary || {};
            alert(`✅ 실행시각 자동배정 완료!\n• 확정 배정: ${s.assignedCount || 0}건\n• 배정 불가(미반영): ${s.failedCount || 0}건`);
          } else {
            alert("⚠️ 자동배정 실패: " + (json.message || "알 수 없는 오류"));
          }
        } catch (e) {
          alert("⚠️ 서버 통신 오류: " + e.message);
        } finally {
          setIsAssigning(false);
        }
      };

      // 필터링된 이벤트 목록 생성
      const buildFilteredEvents = () => {
        const processed = [];
        rawSourceData.forEach((item, idx) => {
          if (excludeWired && isWiredDept(item)) return;
          const status = String(item['상태'] || '').trim();
          const execTime = String(item['실행시각'] || '').trim();
          const isUnassigned = status === '미반영' || execTime.includes('배정 불가');
          if (onlyUnassigned && !isUnassigned) return;

          const startVal = cleanDateStr(item['시작일']);
          const endVal = cleanDateStr(item['종료일']) || startVal;
          const rawTitle = getCampaignTitle(item);
          const timePrefix = execTime && !execTime.includes('배정 불가') && execTime !== '상시(MASS)' ? `[${execTime}] ` : (isUnassigned ? `[⚠️미반영] ` : '');
          const displayTitle = `${timePrefix}${rawTitle}`;

          const filterText = String(item['필터'] || item['채널'] || '').toUpperCase();
          const offerText = String(item['오퍼분류'] || '').toUpperCase();

          // 검색어 필터
          if (searchText && !rawTitle.toUpperCase().includes(searchText.toUpperCase())) return;

          // 채널 필터
          if (typeFilters.length > 0) {
            const hasTV = typeFilters.includes("TV") && filterText.includes("TV");
            const hasToast = typeFilters.includes("토스트팝업") && filterText.includes("토스트");
            const hasCoupon = typeFilters.includes("쿠폰") && (filterText.includes("쿠폰") || offerText.includes("쿠폰") || getCouponValue(item) > 0);
            const hasSeg = typeFilters.includes("Seg채널") && (filterText.includes("SEG") || filterText.includes("배너"));
            if (!(hasTV || hasToast || hasCoupon || hasSeg)) return;
          }

          if (startVal && dateFilters.includes('start')) {
            processed.push({
              id: `ev-start-${idx}`,
              title: displayTitle,
              start: startVal,
              allDay: true,
              className: isUnassigned ? 'event-unassigned' : 'event-start',
              extendedProps: { ...item, _rawTitle: rawTitle, type: 'start', sortOrder: isUnassigned ? 0 : 1, _calStart: startVal, _calEnd: endVal }
            });
          }
          if (endVal && startVal !== endVal && dateFilters.includes('end')) {
            processed.push({
              id: `ev-end-${idx}`,
              title: `[종료] ${rawTitle}`,
              start: endVal,
              allDay: true,
              className: 'event-end',
              extendedProps: { ...item, _rawTitle: rawTitle, type: 'end', sortOrder: 2, _calStart: startVal, _calEnd: endVal }
            });
          }
        });
        return processed;
      };

      // 캘린더 셀 내부의 타겟 합계 / 잔여 Capa / 신호등 뱃지 갱신
      const refreshCalendarCellBadges = () => {
        if (!calendarNodeRef.current) return;
        const events = filteredEventsRef.current;
        const rawArr = rawDataRef.current;

        calendarNodeRef.current.querySelectorAll('.calendar-day-target-sum').forEach(el => {
          const dateStr = el.getAttribute('data-date');
          const dayStartEvents = events.filter(e => e.extendedProps?.type === 'start' && e.start === dateStr);
          const totalTarget = dayStartEvents.reduce((sum, e) => sum + getTargetValue(e.extendedProps), 0);
          el.innerText = totalTarget > 0 ? `(${formatTargetNumber(totalTarget)})` : '';

          const cellEl = el.closest('.fc-daygrid-day');
          if (cellEl) {
            let capaEl = cellEl.querySelector('.calendar-day-capa-remain');
            if (!capaEl) {
              capaEl = document.createElement('div');
              capaEl.className = 'calendar-day-capa-remain';
              cellEl.appendChild(capaEl);
            }
            const bannerRemain = Math.max(getDailyCapa('banner', dateStr) - getDailyUsed('banner', dateStr, rawArr, excludeWired), 0);
            const couponRemain = Math.max(getDailyCapa('coupon', dateStr) - getDailyUsed('coupon', dateStr, rawArr, excludeWired), 0);
            capaEl.innerText = `B ${formatTargetNumber(bannerRemain)} · C ${formatTargetNumber(couponRemain)}`;
          }

          const topEl = el.parentElement;
          if (topEl) {
            const oldBadge = topEl.querySelector('.calendar-congestion-badge');
            if (oldBadge) oldBadge.remove();
            const bannerUsed = getDailyUsed('banner', dateStr, rawArr, excludeWired);
            const congestionClass = bannerUsed < 1000000 ? 'green' : (bannerUsed < 2000000 ? 'yellow' : 'red');
            const badge = document.createElement('span');
            badge.className = `calendar-congestion-badge ${congestionClass}`;
            badge.setAttribute('title', `배너 사용: ${formatTargetNumber(bannerUsed)}`);
            topEl.appendChild(badge);
          }
        });
      };

      // FullCalendar 초기화 및 업데이트
      useEffect(() => {
        if (!calendarNodeRef.current || typeof window.FullCalendar === 'undefined') return;
        const filtered = buildFilteredEvents();
        filteredEventsRef.current = filtered;

        if (!calendarInstanceRef.current) {
          const cal = new window.FullCalendar.Calendar(calendarNodeRef.current, {
            initialView: 'dayGridMonth',
            locale: 'ko',
            events: filtered,
            dayMaxEvents: 5,
            height: 'auto',
            eventOrder: 'sortOrder,title',
            eventClick: (info) => {
              info.jsEvent.stopPropagation();
              setDetailModal({
                type: 'EVENT',
                title: info.event.extendedProps._rawTitle || info.event.title,
                data: info.event.extendedProps,
                dateStr: info.event.startStr
              });
            },
            dateClick: (info) => {
              const dayCampaigns = filteredEventsRef.current.filter(e => e.extendedProps?.type === 'start' && e.start === info.dateStr);
              setDetailModal({
                type: 'DATE',
                title: `${info.dateStr} 발송 캠페인 및 실행시각 현황`,
                data: dayCampaigns,
                dateStr: info.dateStr
              });
            },
            dayCellDidMount: (info) => {
              const cellEl = info.el;
              const topEl = cellEl.querySelector('.fc-daygrid-day-top');
              const offset = info.date.getTimezoneOffset() * 60000;
              const dStr = new Date(info.date.getTime() - offset).toISOString().split('T')[0];

              if (topEl && !topEl.querySelector('.calendar-day-target-sum')) {
                const sumEl = document.createElement('span');
                sumEl.className = 'calendar-day-target-sum';
                sumEl.setAttribute('data-date', dStr);
                topEl.appendChild(sumEl);
              }

              cellEl.addEventListener('mouseenter', (ev) => {
                if (!tooltipRef.current) return;
                const dayEvs = filteredEventsRef.current.filter(e => e.extendedProps?.type === 'start' && e.start === dStr);
                let tvC = 0, toastC = 0, cpnC = 0, segC = 0;
                let tvSum = 0, toastSum = 0, cpnSum = 0, segSum = 0;
                dayEvs.forEach(c => {
                  const p = c.extendedProps;
                  const f = String(p['필터'] || p['채널'] || '').toUpperCase();
                  const tv = getTargetValue(p);
                  if (f.includes('TV')) { tvC++; tvSum += tv; }
                  if (f.includes('토스트')) { toastC++; toastSum += tv; }
                  if (f.includes('쿠폰') || getCouponValue(p) > 0) { cpnC++; cpnSum += tv; }
                  if (f.includes('SEG') || f.includes('배너')) { segC++; segSum += tv; }
                });
                tooltipRef.current.innerHTML = `
                  <span class="text-indigo-300 font-bold">TV:</span> ${tvC}건(${formatTargetNumber(tvSum)}) <span class="text-slate-600 mx-1">|</span>
                  <span class="text-slate-300 font-bold">토스트:</span> ${toastC}건(${formatTargetNumber(toastSum)}) <span class="text-slate-600 mx-1">|</span>
                  <span class="text-pink-300 font-bold">쿠폰:</span> ${cpnC}건(${formatTargetNumber(cpnSum)}) <span class="text-slate-600 mx-1">|</span>
                  <span class="text-emerald-300 font-bold">배너:</span> ${segC}건(${formatTargetNumber(segSum)})
                `;
                tooltipRef.current.style.display = 'block';
                tooltipRef.current.style.left = (ev.pageX + 12) + 'px';
                tooltipRef.current.style.top = (ev.pageY + 12) + 'px';
              });
              cellEl.addEventListener('mousemove', (ev) => {
                if (!tooltipRef.current || tooltipRef.current.style.display === 'none') return;
                tooltipRef.current.style.left = (ev.pageX + 12) + 'px';
                tooltipRef.current.style.top = (ev.pageY + 12) + 'px';
              });
              cellEl.addEventListener('mouseleave', () => {
                if (tooltipRef.current) tooltipRef.current.style.display = 'none';
              });
            },
            datesSet: (info) => {
              const currentDate = info.view.currentStart;
              setCurrentCalMonth({ year: currentDate.getFullYear(), month: currentDate.getMonth() });
              setTimeout(refreshCalendarCellBadges, 0);
            }
          });
          cal.render();
          calendarInstanceRef.current = cal;
        } else {
          calendarInstanceRef.current.removeAllEvents();
          calendarInstanceRef.current.addEventSource(filtered);
        }
        setTimeout(refreshCalendarCellBadges, 50);
      }, [rawSourceData, typeFilters, dateFilters, excludeWired, onlyUnassigned, searchText]);

      // 월별 추이 Chart.js 렌더링 (다크 모드)
      useEffect(() => {
        if (!monthlyChartRef.current || typeof window.Chart === 'undefined') return;
        const monthMap = {};
        rawSourceData.forEach(item => {
          if (excludeWired && isWiredDept(item)) return;
          const start = cleanDateStr(item['시작일']);
          if (!start || start.length < 7) return;
          const mKey = start.slice(0, 7);
          if (!monthMap[mKey]) monthMap[mKey] = { monthKey: mKey, label: `${Number(mKey.split('-')[1])}월`, tv: 0, toast: 0, target: 0 };
          const fText = String(item['필터'] || item['채널'] || '').toUpperCase();
          const tVal = getTargetValue(item);
          if (fText.includes('TV')) monthMap[mKey].tv += 1;
          if (fText.includes('토스트')) monthMap[mKey].toast += 1;
          monthMap[mKey].target += tVal;
        });

        const sortedMonths = Object.values(monthMap).sort((a, b) => a.monthKey.localeCompare(b.monthKey)).slice(-8);
        if (monthlyChartInstanceRef.current) monthlyChartInstanceRef.current.destroy();

        monthlyChartInstanceRef.current = new window.Chart(monthlyChartRef.current, {
          type: 'bar',
          data: {
            labels: sortedMonths.map(d => d.label),
            datasets: [
              { type: 'bar', label: 'TV팝업', data: sortedMonths.map(d => d.tv), yAxisID: 'y', backgroundColor: '#4f3df6', borderRadius: 6, maxBarThickness: 24 },
              { type: 'bar', label: '토스트팝업', data: sortedMonths.map(d => d.toast), yAxisID: 'y', backgroundColor: '#475569', borderRadius: 6, maxBarThickness: 24 },
              { type: 'line', label: '전체 타겟 수', data: sortedMonths.map(d => d.target), yAxisID: 'yTarget', borderColor: '#32d782', backgroundColor: 'rgba(50, 215, 130, 0.15)', borderWidth: 2.5, pointRadius: 3, tension: 0.35 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', align: 'end', labels: { color: '#94a3b8', usePointStyle: true, boxWidth: 8, font: { size: 11, weight: 'bold' } } },
              datalabels: { display: false }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 11, weight: 'bold' } } },
              y: { beginAtZero: true, position: 'left', ticks: { color: '#64748b', precision: 0, callback: v => `${v}건`, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
              yTarget: { beginAtZero: true, position: 'right', ticks: { color: '#32d782', callback: v => formatTargetNumber(v), font: { size: 10 } }, grid: { drawOnChartArea: false } }
            }
          }
        });
      }, [rawSourceData, excludeWired]);

      // 현재 캘린더 월 기준 채널 요약 수치 계산
      const monthlySummary = (() => {
        let tvCount = 0, toastCount = 0, couponCount = 0, segCount = 0;
        let tvSum = 0, toastSum = 0, couponSum = 0, segSum = 0;
        rawSourceData.forEach(item => {
          if (excludeWired && isWiredDept(item)) return;
          const start = cleanDateStr(item['시작일']);
          if (!start) return;
          const parts = start.split('-');
          if (Number(parts[0]) === currentCalMonth.year && (Number(parts[1]) - 1) === currentCalMonth.month) {
            const fText = String(item['필터'] || item['채널'] || '').toUpperCase();
            const oText = String(item['오퍼분류'] || '').toUpperCase();
            const tv = getTargetValue(item);
            if (fText.includes('TV')) { tvCount++; tvSum += tv; }
            if (fText.includes('토스트')) { toastCount++; toastSum += tv; }
            if (fText.includes('쿠폰') || oText.includes('쿠폰') || getCouponValue(item) > 0) { couponCount++; couponSum += tv; }
            if (fText.includes('SEG') || fText.includes('배너')) { segCount++; segSum += tv; }
          }
        });
        return { tvCount, toastCount, couponCount, segCount, tvSum, toastSum, couponSum, segSum };
      })();

      // 향후 7일 주간 잔여 슬롯 데이터 계산
      const weeklyData = (() => {
        const list = [];
        for (let i = 0; i < 7; i++) {
          const dStr = getDateOffset(todayLocalStr, i);
          const bCapa = getDailyCapa('banner', dStr);
          const bUsed = getDailyUsed('banner', dStr);
          const cCapa = getDailyCapa('coupon', dStr);
          const cUsed = getDailyUsed('coupon', dStr);

          // 채널별 일일 타겟 합산
          let tvTarget = 0, toastTarget = 0;
          rawSourceData.forEach(item => {
            if (excludeWired && isWiredDept(item)) return;
            if (cleanDateStr(item['시작일']) !== dStr) return;
            const f = String(item['필터'] || item['채널'] || '').toUpperCase();
            const tv = getTargetValue(item);
            if (f.includes('TV')) tvTarget += tv;
            if (f.includes('토스트')) toastTarget += tv;
          });

          list.push({
            dateStr: dStr,
            label: getDayLabel(dStr),
            bannerCapa: bCapa, bannerUsed: bUsed, bannerRemain: bCapa - bUsed,
            couponCapa: cCapa, couponUsed: cUsed, couponRemain: cCapa - cUsed,
            tvPopup: tvTarget, toastPopup: toastTarget
          });
        }
        return list;
      })();

      // 미반영 캠페인 건수 체크
      const unassignedCampaigns = rawSourceData.filter(item => {
        const st = String(item['상태'] || '').trim();
        const tm = String(item['실행시각'] || '').trim();
        return st === '미반영' || tm.includes('배정 불가');
      });

      // 우측 상단 Capa 시뮬레이터 결과 계산
      const capaSimResults = (() => {
        const tVal = Number(String(capaTarget).replace(/[^0-9]/g, '')) || 0;
        const checks = [
          { type: 'banner', label: '배너', checked: capaBanner },
          { type: 'coupon', label: '쿠폰', checked: capaCoupon }
        ].filter(c => c.checked);
        if (!capaDate || !tVal || checks.length === 0) return [];

        return checks.map(c => {
          const capa = getDailyCapa(c.type, capaDate);
          const used = getDailyUsed(c.type, capaDate);
          const remain = Math.max(capa - used, 0);
          const ok = remain >= tVal;
          const recos = [];
          if (!ok) {
            for (let i = -2; i <= 2; i++) {
              if (i === 0) continue;
              const altDate = getDateOffset(capaDate, i);
              const altRemain = Math.max(getDailyCapa(c.type, altDate) - getDailyUsed(c.type, altDate), 0);
              if (altRemain >= tVal) recos.push({ dateStr: altDate, label: `${getDayLabel(altDate)} 잔여 ${formatTargetNumber(altRemain)}` });
            }
          }
          return { ...c, capa, used, remain, ok, recos, requested: tVal };
        });
      })();

      // 단순 Capa 신청 제출 (Track A)
      const handleSimpleRequestSubmit = async (e) => {
        e.preventDefault();
        if (!reqForm.campaignName || !reqForm.startDate) {
          return alert("캠페인명과 시작일은 필수입니다.");
        }
        if (reqForm.uiVersions.length === 0 || reqForm.channels.length === 0) {
          return alert("UI버전과 채널을 1개 이상 선택해 주세요.");
        }
        setIsSubmittingReq(true);
        setReqStatusMsg("시트 반영 및 실행시각 자동 배정 중...");

        localStorage.setItem('myDepartment', reqForm.department);
        localStorage.setItem('myMarketerName', reqForm.marketer);

        const targetNum = Number(String(reqForm.totalTarget).replace(/[^0-9]/g, '')) || 0;
        const isCpn = reqForm.offerType.includes('쿠폰') || reqForm.channels.includes('쿠폰');

        const scheduleItem = {
          "캠페인명": reqForm.campaignName,

    // ====================================================================================
    const PromotionListView = ({ onLoadCampaign, onDuplicateCampaign }) => {
      const [campaigns, setCampaigns] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);

      const fetchCampaigns = async () => {
        setIsLoading(true);
        setError(null);
        try {
          const response = await fetch("https://btv-proxy.alcheminos.workers.dev?action=getCampaigns");
          if (!response.ok) throw new Error("서버와 통신할 수 없습니다.");
          const data = await response.json();
          
          if (data && data.status === 'error') {
            throw new Error(data.message || "서버에서 데이터를 불러오지 못했습니다.");
          }
          if (!Array.isArray(data)) {
            throw new Error("서버에서 올바른 목록 형식을 받지 못했습니다.");
          }
          
          setCampaigns(data);
        } catch (err) { 
          console.error("캠페인 로드 실패", err); 
          setError(err.message || "목록을 불러오는 중 문제가 발생했습니다."); 
          setCampaigns([]);
        } finally { 
          setIsLoading(false); 
        }
      };

      useEffect(() => {
        fetchCampaigns();
      }, []);

      const handleLoad = (item) => {
        const meta = item.meta || {
          campaignName: item.campaignName, target: item.target, targetSize: item.targetSize,
          startDate: item.startDate, dueDate: item.dueDate, hasCoupon: item.hasCoupon, 
          couponBenefit: item.couponBenefit, externalGift: item.externalGift || '', conceptCopy: item.conceptCopy, mainImageUrl: item.mainImageUrl,
          product: item.product, bannerTypes: item.bannerTypes, gnbLocations: item.gnbLocations
        };
        meta.parentJiraKey = item.jiraKey ? String(item.jiraKey).split('/').pop() : '';
        onLoadCampaign(meta, item.assets || [], item.mermaidCode || "");
      };

      const handleDuplicate = (item) => {
        const meta = item.meta || {
          campaignName: `${item.campaignName} (복제본)`, target: item.target, targetSize: item.targetSize,
          startDate: item.startDate, dueDate: item.dueDate, hasCoupon: item.hasCoupon, couponBenefit: item.couponBenefit,
          externalGift: item.externalGift || '', conceptCopy: item.conceptCopy, mainImageUrl: item.mainImageUrl,
          product: item.product, bannerTypes: item.bannerTypes, gnbLocations: item.gnbLocations
        };
        const duplicatedAssets = (item.assets || []).map((a, idx) => ({ ...a, id: `asset-dup-${Date.now()}-${idx}` }));
        onDuplicateCampaign(meta, duplicatedAssets, item.mermaidCode || "");
      };

      const isPastCampaign = (startDateStr) => {
        if (!startDateStr) return false;
        const todayStr = new Date(new Date().getTime() - (new Date().getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        return startDateStr < todayStr;
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#06070a] overflow-hidden p-6 gap-5">
          <div className="flex items-center justify-between shrink-0">
            <div>
              <h2 className="text-white font-black text-xl tracking-tight flex items-center gap-2"><FolderOpen size={22} className="text-[#7387ff]" /> 프로모션 관리</h2>
              <p className="text-slate-500 text-xs font-medium mt-1">과거에 만든 캠페인을 확인하고 불러와 수정할 수 있습니다.</p>
            </div>
            <button onClick={fetchCampaigns} disabled={isLoading} className="flex items-center gap-1.5 px-4 py-2 bg-[#1a1c26] text-slate-300 rounded-lg text-xs font-bold border border-[#303340] hover:bg-[#262833] hover:text-white transition-colors disabled:opacity-50">
              <RefreshCw size={14} className={isLoading ? 'animate-spin' : ''} /> 새로고침
            </button>
          </div>

          <div className="flex-1 min-h-0 bg-[#0f111a] border border-[#262833] rounded-2xl overflow-hidden flex flex-col shadow-xl">
            {isLoading ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-3 text-slate-500">
                <Loader2 size={28} className="animate-spin text-[#7387ff]" />
                <span className="text-sm font-medium">캠페인 목록을 불러오는 중...</span>
              </div>
            ) : error ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-3 text-slate-500 px-8 text-center">
                <Inbox size={32} className="text-slate-700" />
                <span className="text-sm font-medium text-red-400/80">{error}</span>
                <button onClick={fetchCampaigns} className="mt-2 px-4 py-1.5 bg-[#1a1c26] border border-[#303340] rounded-lg text-xs text-slate-300 hover:text-white transition-colors">다시 시도</button>
              </div>
            ) : campaigns.length === 0 ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-2 text-slate-500">
                <Inbox size={32} className="text-slate-700" />
                <span className="text-sm font-medium">등록된 캠페인이 없습니다.</span>
              </div>
            ) : (
              <div className="flex-1 overflow-y-auto custom-scrollbar divide-y divide-[#1a1c26]">
                {campaigns.map((item) => {
                  const safeTargetStr = item.targetSize ? String(item.targetSize).replace(/[^0-9]/g, '') : '';
                  const displayTargetSize = safeTargetStr ? parseInt(safeTargetStr).toLocaleString() : 0;
                  
                  let bannerTypesText = "등록된 배너 없음";
                  if (item.meta && item.meta.bannerTypes) {
                    bannerTypesText = item.meta.bannerTypes;
                  } else if (item.assets && item.assets.length > 0) {
                    bannerTypesText = item.assets.map(a => a.name || a.type).join(', ');
                  }

                  const isPast = isPastCampaign(item.startDate);
    
                  return (
                    <div key={item.id} className="bg-[#12141c] border border-[#262833] rounded-xl p-4 transition-all">
                      <div className="flex items-center w-full">
                        <div className="w-[33%] min-w-[240px] shrink-0 pr-4">
                          <div className="flex items-center gap-2 mb-1.5">
                            <h4 className="text-white font-bold text-[14px] truncate" title={item.campaignName}>{item.campaignName}</h4>
                            {item.target === 'TARGET' && (
                              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30 flex items-center gap-1 shrink-0 whitespace-nowrap">
                                TARGET {displayTargetSize !== 0 && <span className="text-orange-300">({displayTargetSize}명)</span>}
                              </span>
                            )}
                            {item.status === '확정 완료' && (
                              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 shrink-0 whitespace-nowrap">확정 완료</span>
                            )}
                          </div>
                          <div className="text-[11px] text-slate-400 flex items-center gap-2">
                            <span>{item.startDate} ~ {item.dueDate}</span>
                            <span>•</span>
                            <span>수정 {item.updatedAt}</span>
                          </div>
                        </div>
    
                        <div className="flex-1 px-5 text-left hidden md:block border-l border-[#262833] min-w-0 overflow-hidden">
                          <p className="text-[10px] text-slate-500 mb-0.5 font-bold">포함된 배너 에셋</p>
                          <p className="text-[12px] text-slate-300 font-medium truncate w-full" title={bannerTypesText}>
                            {bannerTypesText}
                          </p>
                        </div>
    
                        <div className="w-[250px] shrink-0 pl-4 border-l border-[#262833] flex items-center justify-end gap-1.5">
                          {item.jiraKey && item.jiraKey !== "-" && (
                            <button 
                              onClick={() => {
                                const url = item.jiraKey.startsWith('http') ? item.jiraKey : `https://jira.skbroadband.com/browse/${item.jiraKey}`;
                                window.open(url, '_blank');
                              }} 
                              className="px-3 py-1.5 bg-[#262833] text-slate-300 rounded text-xs font-medium hover:bg-[#303340] hover:text-white transition-colors flex items-center gap-1.5 whitespace-nowrap">
                              <ExternalLink size={12} /> Jira
                            </button>
                          )}
                          
                          <button onClick={() => handleDuplicate(item)} className="px-3 py-1.5 bg-[#d946ef]/10 text-[#e879f9] border border-[#d946ef]/30 rounded text-xs font-bold hover:bg-[#d946ef]/20 transition-colors flex items-center gap-1.5 whitespace-nowrap">
                            <Copy size={12} /> 복제
                          </button>
                          
                          {!isPast && (
                            <button onClick={() => handleLoad(item)} className="px-3 py-1.5 bg-[#4f3df6]/10 text-[#7387ff] border border-[#4f3df6]/30 rounded text-xs font-bold hover:bg-[#4f3df6]/20 transition-colors flex items-center gap-1 whitespace-nowrap">
                              수정 <ChevronRight size={12} />
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    };
    
    function App() {
      const [currentView, setCurrentView] = useState('PLANNER');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [isNavExpanded, setIsNavExpanded] = useState(false); 
      const [extensionVersion, setExtensionVersion] = useState(null);
      const [githubVersion, setGithubVersion] = useState(null);
      const [jiraSession, setJiraSession] = useState('CHECKING');
      
      const checkJiraSessionNow = () => {
        setJiraSession('CHECKING');
        const extNode = document.getElementById('btv-campaign-extension-installed');
        if (extNode) {
          setExtensionVersion(extNode.getAttribute('data-version') || '1.0.0');
          
          const sessionListener = (e) => {
            setJiraSession(e.detail?.isLogged ? 'LOGGED_IN' : 'LOGGED_OUT');
            window.removeEventListener('RECEIVE_JIRA_SESSION', sessionListener);
          };
          window.addEventListener('RECEIVE_JIRA_SESSION', sessionListener);
          window.dispatchEvent(new CustomEvent('REQUEST_JIRA_SESSION'));
        } else {
          setJiraSession('LOGGED_OUT');
        }
      };

      useEffect(() => {
        fetch('https://raw.githubusercontent.com/btvcuration/campaign/main/Tool/manifest.json')
          .then(res => res.json())
          .then(data => setGithubVersion(data.version))
          .catch(e => console.error("버전 체크 실패", e));

        checkJiraSessionNow();
        setTimeout(checkJiraSessionNow, 1000);
      }, []);

      const [campaignMeta, setCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', externalGift: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false
      });

      const [assets, setAssets] = useState([]); 
      const [mermaidCode, setMermaidCode] = useState('');
      const AUTOSAVE_KEY = 'btv_campaign_autosave_v1';
      
      const [aiCampaignMeta, setAiCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', externalGift: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false
      });
      const [aiChatHistory, setAiChatHistory] = useState([
        { id: 'msg-init', sender: 'ai', text: '매니저님, 환영합니다.\n어떤 프로모션을 기획하실 예정인가요? 우측 폼에 아시는 만큼 먼저 적어주셔도 좋고, 저와 대화하며 하나씩 채워가도 좋습니다!' }
      ]);

      const [exportState, setExportState] = useState({ isExporting: false, progress: 0, msg: '' });
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [openAccordions, setOpenAccordions] = useState({ campaign: true, banner: true });

      const handleSettingsClick = () => setIsSettingsOpen(true);
      const handleConfigChange = (gnbName, field, value) => setConfigMap(prev => ({ ...prev, [gnbName]: { ...prev[gnbName], [field]: value } }));
      const handleSaveConfig = async () => { setIsSettingsOpen(false); };

      // 🌟 [수정 1] 시안 편집기로 이동할 때 2단/3단 일반 배너 및 세트 배너 에셋 자체에 이미지가 정확히 들어가도록 매핑 보정
      const handleMoveToEditor = (payload, onInvalid) => {
        setCampaignMeta({ ...aiCampaignMeta });
        if (!payload || payload.action !== "CREATE_CAMPAIGN_ASSETS") {
          setCurrentView('EDITOR'); return;
        }
        const aiMeta = payload.rawGasData?.meta || {};
        const aiAssets = payload.rawGasData?.assets || [];
        const aiMermaid = payload.mermaidCode || payload.rawGasData?.mermaidCode || "";
      
        if (aiAssets.length === 0 && !aiMermaid) {
          alert("🚨 AI가 최종 시안 데이터를 정상적으로 렌더링하지 못했습니다. (서버 응답 오류)\n수동으로 배너를 추가하거나, AI에게 다시 시안 생성을 요청해 주세요.");
          if (onInvalid) onInvalid();
          return;
        }
        
        if (assets.length > 0) {
          const confirmOverwrite = window.confirm("⚠️ 이미 시안 편집 화면에 작업 중인 배너가 존재합니다.\n새로운 AI 기획안으로 덮어씌우시겠습니까?");
          if (!confirmOverwrite) { setCurrentView('EDITOR'); return; }
        }

        const formMainImg = aiCampaignMeta.mainImageUrl || aiMeta.mainImageUrl || '';

        if (aiMermaid) setMermaidCode(aiMermaid);
        if (aiMeta) {
          if (!aiMeta.conceptCopy && (aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept)) {
             aiMeta.conceptCopy = aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept;
          }
          if (Array.isArray(aiMeta.bannerTypes)) aiMeta.bannerTypes = aiMeta.bannerTypes.join(', ');
          if (Array.isArray(aiMeta.gnbLocations)) aiMeta.gnbLocations = aiMeta.gnbLocations.join(', ');
          if (formMainImg) aiMeta.mainImageUrl = formMainImg;
          setCampaignMeta(prev => ({ ...prev, ...aiMeta }));
        }

        if (aiAssets && Array.isArray(aiAssets)) {
          if (aiAssets.length === 0) {
            setAssets([]); setActiveTabId(null);
          } else {
            const timestamp = Date.now();
            const usedNames = [];
            const newAssets = aiAssets.map((aiAsset, index) => {
              let baseData = {};
              if (aiAsset.type === 'TODAY_BTV') baseData = { ...DEFAULT_TODAY_BTV };
              else if (aiAsset.type === 'GENERAL_BANNER') baseData = { ...DEFAULT_GENERAL_BANNER };
              else if (aiAsset.type === 'GENERAL_SET_BANNER') baseData = { ...DEFAULT_GENERAL_SET_BANNER };
              else if (aiAsset.type === 'FULL_PROMO_BANNER') baseData = { ...DEFAULT_FULL_PROMO_BANNER };
              else if (aiAsset.type === 'BIG_BANNER') baseData = { ...DEFAULT_BIG_BANNER };
              else if (aiAsset.type === 'LONG_BANNER') baseData = { ...DEFAULT_LONG_BANNER };
              else if (aiAsset.type === 'STRIP_BANNER') baseData = { ...DEFAULT_STRIP_BANNER };
              else if (aiAsset.type === 'SYNOPSIS_BANNER') baseData = { ...DEFAULT_SYNOPSIS_BANNER };
              else if (aiAsset.type === 'PROMO_POPUP') baseData = { ...DEFAULT_PROMO_POPUP };
              else if (aiAsset.type === 'MINI_EPG_BANNER') baseData = { ...DEFAULT_MINI_EPG_BANNER };

              let aiData = { ...(aiAsset.data || {}) };
              const masterImg = formMainImg || aiData.imageUrl || aiData.bannerImg || aiData.bgImg || '';

              if (aiAsset.type === 'TODAY_BTV') {
                if (aiData.subTitle && !aiData.subText) aiData.subText = aiData.subTitle;
                if (!aiData.imageUrl && masterImg) aiData.imageUrl = masterImg;
              } 
              else if (aiAsset.type === 'GENERAL_BANNER') {
                if (aiData.subTitle && !aiData.previewSub) aiData.previewSub = aiData.subTitle;
                if (aiData.mainTitle && !aiData.previewTitle) aiData.previewTitle = aiData.mainTitle;
                if (aiData.mainTitle && !aiData.bannerCopy) aiData.bannerCopy = aiData.mainTitle;
                if (!aiData.bannerImg && masterImg) aiData.bannerImg = masterImg;
                if (aiData.previewImg === aiData.bannerImg || (aiData.previewImg && aiData.previewImg.includes('ui-templates'))) {
                  aiData.previewImg = '';
                }
              }
              else if (aiAsset.type === 'GENERAL_SET_BANNER') {
                const rawCards = Array.isArray(aiData.cards) && aiData.cards.length > 0 ? aiData.cards : DEFAULT_GENERAL_SET_BANNER.cards;
                aiData.cards = rawCards.map((card, cIdx) => {
                  const defCard = DEFAULT_GENERAL_SET_BANNER.cards[cIdx] || DEFAULT_GENERAL_SET_BANNER.cards[0];
                  const mergedCard = { ...defCard, ...card };
                  if (!mergedCard.cardImg && (mergedCard.imageUrl || masterImg)) {
                    mergedCard.cardImg = mergedCard.imageUrl || masterImg;
                  }
                  if (mergedCard.heroImg === mergedCard.cardImg || (mergedCard.heroImg && mergedCard.heroImg.includes('ui-templates'))) {
                    mergedCard.heroImg = '';
                  }
                  return mergedCard;
                });
              }
              else if (aiAsset.type === 'FULL_PROMO_BANNER') {
                if (aiData.mainTitle && !aiData.mainCopy) aiData.mainCopy = aiData.mainTitle;
                if (aiData.subTitle && !aiData.subCopy) aiData.subCopy = aiData.subTitle;
                if (!aiData.bgImg && masterImg) aiData.bgImg = masterImg;
                [1, 2, 3].forEach(num => {
                  if (!aiData[`card${num}Img`] && masterImg) aiData[`card${num}Img`] = masterImg;
                });
              }
              else {
                if (!aiData.imageUrl && masterImg) aiData.imageUrl = masterImg;
              }

              let rawGnb = aiData.gnb || baseData.gnb;
              let gnbArray = Array.isArray(rawGnb) ? rawGnb : [rawGnb];
              let cleanedGnb = gnbArray.filter(g => typeof g === 'string' && g.trim() !== '').map(g => {
                  if (g.includes('영화') && g.includes('시리즈')) return '영화시리즈';
                  if (g.includes('TV') && g.includes('방송')) return 'TV 방송';
                  if (g === 'OTT 홈' || g === 'OTT') return 'OTT홈';
                  return g;
                });
              if (cleanedGnb.length === 0) cleanedGnb = ['홈'];  
              
              const rawName = aiAsset.name || `${aiAsset.type.replace('_', ' ')} (AI)`;
              const finalName = getUniqueAssetName(usedNames, rawName);
              usedNames.push(finalName);

              return { id: `ai-asset-${index}-${timestamp}`, type: aiAsset.type, name: finalName, data: { ...baseData, ...aiData, gnb: cleanedGnb, startDate: aiMeta?.startDate || aiCampaignMeta.startDate || baseData.startDate, dueDate: aiMeta?.dueDate || aiCampaignMeta.dueDate || baseData.dueDate } };
            });
            setAssets(newAssets); setActiveTabId(newAssets[0].id); 
            setCampaignMeta(prev => ({ ...prev, aiOriginalAssets: newAssets.map(a => ({ id: a.id, name: a.name })) }));
          }
        }
        setCurrentView('EDITOR');
      };

      const [activeTabId, setActiveTabId] = useState('asset-1');      
      const [isAddAssetModalOpen, setIsAddAssetModalOpen] = useState(false);
      const [configMap, setConfigMap] = useState({});

      useEffect(() => {
        try {
          const saved = localStorage.getItem(AUTOSAVE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.assets?.length > 0) {
              const ago = Math.round((Date.now() - parsed.savedAt) / 60000);
              const restore = window.confirm(
                `⏱️ ${ago}분 전 작업 중이던 임시저장 데이터가 있습니다.\n(${parsed.campaignMeta?.campaignName || '제목 없음'})\n불러올까요?`
              );
              if (restore) {
                setCampaignMeta(parsed.campaignMeta || {});
                setAssets(parsed.assets || []);
                setMermaidCode(parsed.mermaidCode || '');
                setActiveTabId(parsed.assets[0]?.id || null);
                setCurrentView('EDITOR');
              } else {
                localStorage.removeItem(AUTOSAVE_KEY);
              }
            }
          }
        } catch (e) { console.error("자동저장 복구 실패", e); }
      }, []);
      
      useEffect(() => {
        if (currentView !== 'EDITOR' || assets.length === 0) return;
        const timer = setTimeout(() => {
          try {
            localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ campaignMeta, assets, mermaidCode, savedAt: Date.now() }));
          } catch (e) { console.error("자동저장 실패", e); }
        }, 1500);
        return () => clearTimeout(timer);
      }, [campaignMeta, assets, mermaidCode, currentView]);

      useEffect(() => {
        const fetchConfig = async () => {
          try {
            const proxyUrl = "https://btv-proxy.alcheminos.workers.dev?action=getConfig";
            const response = await fetch(proxyUrl, { method: 'GET', headers: { 'Content-Type': 'application/json' } });
            if (!response.ok) throw new Error("네트워크 응답이 올바르지 않습니다.");
            const configData = await response.json();
            setConfigMap(configData);
          } catch (error) {
            console.error("Config 로드 실패:", error);
            setConfigMap({ "영화시리즈": { "name": "담당자 미지정", "jiraId": "system_auto" }, "TV 방송": { "name": "담당자 미지정", "jiraId": "system_auto" } });
          }
        };
        fetchConfig();
      }, []);

      const handleMetaChange = (e) => setCampaignMeta({ ...campaignMeta, [e.target.name]: e.target.value });
      
      const handleAssetChange = (id, field, value) => {
        setAssets(prevAssets => prevAssets.map(asset => asset.id === id ? { ...asset, data: { ...asset.data, [field]: value } } : asset));
      };
      
      const handleCardChange = (id, cardIndex, field, value) => {
        setAssets(prevAssets => prevAssets.map(asset => {
          if (asset.id !== id) return asset;
          const newCards = [...(asset.data.cards || [])];
          newCards[cardIndex] = { ...newCards[cardIndex], [field]: value };
          return { ...asset, data: { ...asset.data, cards: newCards } };
        }));
      };

      const handleAddMemo = () => {
        const currentMemos = activeAsset.data?.memos || [];
        const offset = currentMemos.length * 20; 
        const newMemo = { id: `memo-${Date.now()}`, text: '', x: 50 + offset, y: 50 + offset };
        handleAssetChange(activeAsset.id, 'memos', [...currentMemos, newMemo]);
      };

      const addAsset = (type, name) => {
        const newId = `asset-${Date.now()}`;
        const uniqueName = getUniqueAssetName(assets.map(a => a.name), name);
        let newData = {};
        const masterImg = campaignMeta.mainImageUrl || '';

        if (type === 'TODAY_BTV') newData = { ...DEFAULT_TODAY_BTV, imageUrl: masterImg };
        else if (type === 'GENERAL_BANNER') newData = { ...DEFAULT_GENERAL_BANNER, bannerImg: masterImg };
        else if (type === 'GENERAL_SET_BANNER') {
          newData = { 
            ...DEFAULT_GENERAL_SET_BANNER,
            cards: DEFAULT_GENERAL_SET_BANNER.cards.map(c => ({ ...c, cardImg: masterImg }))
          };
        }
        else if (type === 'FULL_PROMO_BANNER') newData = { ...DEFAULT_FULL_PROMO_BANNER, bgImg: masterImg };
        else if (type === 'BIG_BANNER') newData = { ...DEFAULT_BIG_BANNER, imageUrl: masterImg };
        else if (type === 'LONG_BANNER') newData = { ...DEFAULT_LONG_BANNER, imageUrl: masterImg };
        else if (type === 'STRIP_BANNER') newData = { ...DEFAULT_STRIP_BANNER, imageUrl: masterImg };
        else if (type === 'SYNOPSIS_BANNER') newData = { ...DEFAULT_SYNOPSIS_BANNER, imageUrl: masterImg };
        else if (type === 'PROMO_POPUP') newData = { ...DEFAULT_PROMO_POPUP, imageUrl: masterImg };
        else if (type === 'MINI_EPG_BANNER') newData = { ...DEFAULT_MINI_EPG_BANNER, imageUrl: masterImg };
      
        newData.startDate = campaignMeta.startDate;
        newData.dueDate = campaignMeta.dueDate;

        setAssets([...assets, { id: newId, type, name: uniqueName, data: newData }]);
        setActiveTabId(newId);
        setIsAddAssetModalOpen(false);
        setOpenAccordions({ ...openAccordions, banner: true }); 
      };

      const removeAsset = (id, e) => {
        e.stopPropagation();
        const filteredAssets = assets.filter(a => a.id !== id);
        setAssets(filteredAssets); 
        
        if (filteredAssets.length === 0) setActiveTabId(null);
        else if (activeTabId === id) setActiveTabId(filteredAssets[0].id);
      };

      const handleDownloadExtension = async () => {
        setExportState({ isExporting: true, progress: 10, msg: "최신 확장프로그램 패킹 준비 중..." });
        try {
          const zip = new window.JSZip();
          const filesToFetch = ["manifest.json", "background.js", "content.js"];
          const baseUrl = "https://raw.githubusercontent.com/btvcuration/campaign/main/Tool";

          for (let i = 0; i < filesToFetch.length; i++) {
            const fileName = filesToFetch[i];
            setExportState({ isExporting: true, progress: 10 + Math.floor((i / filesToFetch.length) * 60), msg: `${fileName} 가져오는 중...` });

            if (!response.ok) throw new Error(`${fileName} 파일을 찾을 수 없습니다.`);

          setExportState({ isExporting: true, progress: 85, msg: "압축 파일 생성 중..." });

      const handleExport = async () => {

            window.addEventListener('RECEIVE_SCREENSHOT', listener);
            window.dispatchEvent(new CustomEvent('REQUEST_SCREENSHOT', { detail: { x: rect.left, y: rect.top, width: rect.width, height: rect.height } }));

          if (!dataUrl) { setExportState({ isExporting: false, progress: 0, msg: '' }); throw new Error("Capture failed"); }
          return dataUrl;
        };

          mermaidSectionHtml + "<br><br>" +

        const mentionString = Array.from(uniqueAssignees).map(id => `[~${id}]`).join(' ');
        const parentCommentText = `${mentionString}\n담당자님, 신규 캠페인 프로모션이 등록(또는 업데이트) 되었습니다. 각 영역별 하위 일감(Sub-task)을 확인하시어 배너 편성 및 세팅을 부탁드립니다.`;
